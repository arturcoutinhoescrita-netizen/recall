<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Recall — Flashcards com repetição espaçada</title>
<meta name="description" content="Flashcards com repetição espaçada (SM-2), múltipla escolha, pergunta aberta e modo idioma.">
<meta name="theme-color" content="#14162B" id="theme-color-meta">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" id="status-bar-style-meta">
<meta name="apple-mobile-web-app-title" content="Recall">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    /* tema escuro (padrão) */
    --bg:#14162B;
    --bg-2:#0F1123;
    --surface:#1B1E3B;
    --surface-2:#242850;
    --accent:#F5A623;
    --accent-soft:rgba(245,166,35,0.16);
    --accent-dim:rgba(245,166,35,0.55);
    --accent-dark:#C97D1B;
    --glow:rgba(245,166,35,0.10);
    --brand-text:#1B1200;
    --success:#6EE7B7;
    --success-soft:rgba(110,231,183,0.14);
    --error:#FB7185;
    --error-soft:rgba(251,113,133,0.14);
    --text:#F4F1EA;
    --text-muted:#9498B8;
    --text-faint:#5C6088;
    --border:rgba(244,241,234,0.09);
  }
  :root[data-recall-theme="light"]{
    /* tema claro: Harmonia Botânica & Nude */
    --bg:#FAF8F5;
    --bg-2:#F3EFE0;
    --surface:#FFFFFF;
    --surface-2:#F3EFE0;
    --accent:#B88E74;
    --accent-soft:rgba(184,142,116,0.16);
    --accent-dim:rgba(184,142,116,0.55);
    --accent-dark:#4A3525;
    --glow:rgba(178,200,186,0.22);
    --brand-text:#1B1200;
    --success:#B2C8BA;
    --success-soft:rgba(120,153,132,0.22);
    --error:#C4636E;
    --error-soft:rgba(196,99,110,0.12);
    --text:#4A3525;
    --text-muted:#8A7460;
    --text-faint:rgba(74,53,37,0.45);
    --border:rgba(74,53,37,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, var(--glow), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    transition:background-color 0.2s ease, color 0.2s ease;
  }
  h1,h2,h3,.display{ font-family:Georgia,'Iowan Old Style','Palatino Linotype','Book Antiqua',Palatino,serif; letter-spacing:-0.01em; }
  .mono{ font-family:ui-monospace,'SF Mono','Cascadia Code','Roboto Mono',Consolas,'Courier New',monospace; }
  button{ font-family:inherit; cursor:pointer; }
  ::selection{ background:var(--accent-soft); }
  /* 100dvh acompanha a barra de endereço do navegador mobile aparecendo/sumindo
     ao rolar — com só 100vh (o tamanho "cheio", como se a barra estivesse
     sempre escondida) o topo fixo do app podia ficar parcialmente atrás dela.
     Mantém 100vh como fallback pra navegadores sem suporte a dvh. */
  #app{ display:flex; height:100vh; height:100dvh; }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:280px; flex-shrink:0;
    background:var(--bg-2);
    border-right:1px solid var(--border);
    padding:28px 20px;
    display:flex; flex-direction:column; gap:22px;
    overflow-y:auto; min-height:0;
  }
  .brand{ display:flex; align-items:center; gap:10px; padding:0 2px; }
  .brand-mark{
    width:34px; height:34px; border-radius:9px;
    background:linear-gradient(155deg, var(--accent), var(--accent-dark));
    display:flex; align-items:center; justify-content:center;
    font-family:Georgia,'Iowan Old Style','Palatino Linotype','Book Antiqua',Palatino,serif; font-weight:700; color:var(--brand-text); font-size:18px;
    box-shadow:0 0 22px var(--accent-soft);
  }
  .brand h1{ font-size:20px; margin:0; font-weight:600; }
  .brand span{ display:block; font-size:11px; color:var(--text-faint); margin-top:1px; letter-spacing:0.04em; }

  .new-deck-btn{
    background:var(--accent-soft); color:var(--accent);
    border:1px solid var(--accent-dim);
    border-radius:10px; padding:11px 14px; font-size:13.5px; font-weight:600;
    display:flex; align-items:center; gap:8px; transition:all .15s ease;
  }
  .new-deck-btn:hover{ background:var(--accent); color:var(--brand-text); }

  .deck-list{ display:flex; flex-direction:column; gap:4px; overflow-y:auto; flex:1; }
  .deck-item{
    display:flex; align-items:center; gap:10px;
    padding:10px 10px; border-radius:9px; border:1px solid transparent;
    color:var(--text-muted); transition:all .15s ease; position:relative;
  }
  .deck-item:hover{ background:var(--surface); color:var(--text); }
  .clickable-word{ cursor:pointer; border-bottom:1px dotted var(--text-faint); }
  .clickable-word:hover{ color:var(--accent); border-bottom-color:var(--accent); }
  @keyframes epubPageIn{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }
  .epub-page{ animation:epubPageIn .32s ease; }
  .book-cover-hover{ transition:transform 0.18s ease, box-shadow 0.18s ease; }
  .book-cover-hover:hover{ transform:scale(1.05); box-shadow:0 8px 20px rgba(0,0,0,0.35); }
  .deck-item.active{ background:var(--surface-2); color:var(--text); border-color:var(--border); }
  .deck-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .deck-item-name{ flex:1; font-size:13.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .due-badge{
    font-size:10.5px; font-weight:700; background:var(--accent); color:var(--brand-text);
    padding:2px 7px; border-radius:20px; font-family:ui-monospace,'SF Mono','Cascadia Code','Roboto Mono',Consolas,'Courier New',monospace;
  }
  .sidebar-foot{ font-size:11px; color:var(--text-faint); padding:0 2px; line-height:1.5; }

  /* ---------- Main ---------- */
  .main{ flex:1; padding:40px 48px; overflow-y:auto; }
  .empty-state{
    height:80vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; color:var(--text-muted); gap:14px;
  }
  .empty-state h2{ color:var(--text); font-size:26px; margin:0; }
  .empty-state p{ max-width:380px; margin:0; font-size:14px; line-height:1.6; }

  .deck-header{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px; }
  .deck-header h2{ font-size:30px; margin:0 0 6px 0; }
  .deck-header p{ color:var(--text-muted); font-size:14px; margin:0; max-width:520px; }
  .icon-btn{
    background:var(--surface); border:1px solid var(--border); color:var(--text-muted);
    width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center;
    font-size:16px; transition:all .15s ease;
  }
  .icon-btn:hover{ color:var(--error); border-color:var(--error); }
  .icon-btn:active{ transform:scale(0.92); color:var(--error); border-color:var(--error); }

  .stat-row{ display:flex; gap:10px; margin:22px 0 26px 0; }
  .stat-chip{
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:12px 16px; min-width:110px;
  }
  .stat-chip .num{ font-family:ui-monospace,'SF Mono','Cascadia Code','Roboto Mono',Consolas,'Courier New',monospace; font-size:20px; font-weight:600; color:var(--accent); }
  .stat-chip .lbl{ font-size:11px; color:var(--text-muted); margin-top:2px; }

  .tab-row{ display:flex; gap:6px; border-bottom:1px solid var(--border); margin-bottom:24px; }
  .tab{
    padding:10px 4px; margin-right:20px; font-size:13.5px; font-weight:600; color:var(--text-faint);
    border-bottom:2px solid transparent; transition:all .15s ease; background:none; border-top:none; border-left:none; border-right:none;
  }
  .tab.active{ color:var(--accent); border-bottom-color:var(--accent); }

  /* card list / editor */
  .card-form{
    background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:20px; margin-bottom:22px;
  }
  .card-form .row{ display:flex; gap:14px; margin-bottom:12px; }
  .field{ flex:1; display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:11.5px; color:var(--text-muted); font-weight:600; letter-spacing:0.02em; }
  input[type=text], textarea, select{
    background:var(--bg-2); border:1px solid var(--border); color:var(--text);
    border-radius:8px; padding:10px 12px; font-size:14px; font-family:inherit; resize:vertical;
  }
  input[type=text]:focus, textarea:focus, select:focus{ outline:none; border-color:var(--accent-dim); }
  .primary-btn{
    background:var(--accent); color:var(--brand-text); border:none; border-radius:9px;
    padding:10px 18px; font-weight:700; font-size:13.5px; transition:all .15s ease;
  }
  .primary-btn:hover{ filter:brightness(1.08); transform:translateY(-1px); }
  .primary-btn:active{ filter:brightness(0.94); transform:translateY(0) scale(0.97); }
  .primary-btn:disabled{ opacity:0.5; cursor:not-allowed; transform:none; }
  .ghost-btn{
    background:transparent; color:var(--text-muted); border:1px solid var(--border); border-radius:9px;
    padding:10px 16px; font-weight:600; font-size:13.5px; transition:all .15s ease;
  }
  .ghost-btn:hover{ color:var(--text); border-color:var(--text-faint); }
  .ghost-btn:active{ color:var(--accent); border-color:var(--accent-dim); background:var(--accent-soft); transform:scale(0.97); }
  .ghost-btn:disabled:active{ transform:none; color:var(--text-faint); border-color:var(--border); background:transparent; }

  .cards-grid{ display:flex; flex-direction:column; gap:8px; }
  .card-row{
    display:flex; align-items:center; gap:14px; background:var(--surface); border:1px solid var(--border);
    border-radius:10px; padding:13px 16px;
  }
  .card-row .front{ flex:1; font-size:14px; font-weight:500; }
  .card-row .back{ flex:1; font-size:14px; color:var(--text-muted); }
  .card-row .due-tag{ font-size:10.5px; font-family:ui-monospace,'SF Mono','Cascadia Code','Roboto Mono',Consolas,'Courier New',monospace; color:var(--text-faint); white-space:nowrap; }
  .card-row .del{ color:var(--text-faint); font-size:15px; }
  .card-row .del:hover{ color:var(--error); }

  .mode-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:6px; }
  .mode-card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:20px;
    display:flex; flex-direction:column; gap:8px; text-align:left; transition:all .18s ease;
  }
  .mode-card:hover{ border-color:var(--accent-dim); transform:translateY(-2px); }
  .mode-card .m-icon{ font-size:22px; }
  .mode-card h3{ font-size:15.5px; margin:0; }
  .mode-card p{ font-size:12.5px; color:var(--text-muted); margin:0; line-height:1.5; }

  /* ---------- Study session ---------- */
  .study-wrap{ max-width:680px; margin:0 auto; }
  .session-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:26px; }
  .progress-track{ flex:1; height:6px; background:var(--surface); border-radius:20px; margin:0 20px; overflow:hidden; }
  .progress-fill{ height:100%; background:linear-gradient(90deg, var(--accent-dim), var(--accent)); transition:width .3s ease; }
  .timer{ font-family:ui-monospace,'SF Mono','Cascadia Code','Roboto Mono',Consolas,'Courier New',monospace; color:var(--accent); font-size:14px; font-weight:600; }

  .study-card{
    background:radial-gradient(ellipse 400px 200px at 50% 0%, rgba(245,166,35,0.08), transparent 70%), var(--surface);
    border:1px solid var(--border); border-radius:20px; padding:44px 40px; min-height:220px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:18px;
    position:relative; overflow:hidden;
  }
  .study-card .eyebrow{ font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-faint); font-weight:600; }
  .study-card .question{ font-family:Georgia,'Iowan Old Style','Palatino Linotype','Book Antiqua',Palatino,serif; font-size:26px; font-weight:600; line-height:1.4; max-width:520px; }

  .answer-zone{ margin-top:26px; display:flex; flex-direction:column; gap:12px; }
  .options-grid{ display:flex; flex-direction:column; gap:10px; }
  .option-btn{
    background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:14px 16px;
    text-align:left; font-size:14.5px; color:var(--text); transition:all .15s ease;
  }
  .option-btn:hover{ border-color:var(--accent-dim); background:var(--surface-2); }
  .option-btn.correct{ background:var(--success-soft); border-color:var(--success); color:var(--success); }
  .option-btn.wrong{ background:var(--error-soft); border-color:var(--error); color:var(--error); }
  .option-btn:disabled{ pointer-events:none; }
  .opt-num{
    display:inline-flex; align-items:center; justify-content:center;
    width:20px; height:20px; margin-right:10px; border-radius:6px;
    background:var(--surface-2); border:1px solid var(--border); color:var(--text-faint);
    font-size:11px; font-weight:600; vertical-align:middle;
  }

  .reveal-zone{ display:flex; flex-direction:column; gap:14px; align-items:center; }
  .answer-box{
    background:var(--bg-2); border:1px dashed var(--border); border-radius:12px; padding:16px 20px;
    font-size:15px; color:var(--text-muted); max-width:520px;
    max-height:320px; overflow-y:auto; text-align:left; white-space:pre-wrap; word-break:break-word;
  }
  .feedback-banner{
    padding:14px 18px; border-radius:11px; font-size:14px; font-weight:600;
    animation:pop .25s ease; line-height:1.55; text-align:left; white-space:pre-wrap; word-break:break-word;
    max-height:360px; overflow-y:auto;
  }
  .feedback-banner.ok{ background:var(--success-soft); color:var(--success); }
  .feedback-banner.no{ background:var(--error-soft); color:var(--error); }
  @keyframes pop{ from{ transform:scale(0.94); opacity:0; } to{ transform:scale(1); opacity:1; } }

  .action-row{ display:flex; gap:10px; justify-content:center; margin-top:8px; }
  .spinner{
    width:22px; height:22px; border-radius:50%; border:2.5px solid var(--border); border-top-color:var(--accent);
    animation:spin .7s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .loading-line{ display:flex; align-items:center; gap:10px; color:var(--text-muted); font-size:13.5px; }

  /* ---------- Results ---------- */
  .results-wrap{ max-width:560px; margin:60px auto; text-align:center; display:flex; flex-direction:column; align-items:center; gap:22px; }
  .rank-ring{
    width:150px; height:150px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:conic-gradient(var(--accent) calc(var(--pct)*1%), var(--surface) 0);
    position:relative;
  }
  .rank-ring::after{
    content:''; position:absolute; inset:10px; border-radius:50%; background:var(--bg);
  }
  .rank-letter{ font-family:Georgia,'Iowan Old Style','Palatino Linotype','Book Antiqua',Palatino,serif; font-size:52px; font-weight:700; color:var(--accent); position:relative; z-index:1; }
  .results-stats{ display:flex; gap:14px; }
  .res-chip{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 22px; min-width:120px; }
  .res-chip .num{ font-family:ui-monospace,'SF Mono','Cascadia Code','Roboto Mono',Consolas,'Courier New',monospace; font-size:22px; color:var(--text); font-weight:600; }
  .res-chip .lbl{ font-size:11.5px; color:var(--text-muted); margin-top:3px; }

  /* modal */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(6,7,17,0.6); backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center; z-index:50;
  }
  .modal{
    background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:26px;
    width:400px; display:flex; flex-direction:column; gap:14px;
  }
  .modal h3{ margin:0; font-size:18px; }
  .color-picker{ display:flex; gap:8px; }
  .color-dot{ width:26px; height:26px; border-radius:50%; border:2px solid transparent; }
  .color-dot.selected{ border-color:var(--text); }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:6px; }

  /* toast */
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    padding:12px 20px; border-radius:12px; font-size:13.5px; box-shadow:0 8px 24px rgba(0,0,0,0.35);
    z-index:100; max-width:420px; text-align:center; animation:toast-in 0.2s ease-out;
  }
  .toast-error{ border-color:var(--error); color:var(--error); }
  @keyframes toast-in{ from{ opacity:0; transform:translateX(-50%) translateY(8px);} to{ opacity:1; transform:translateX(-50%) translateY(0);} }
  .mobile-back-btn{ display:none; align-items:center; gap:6px; margin-bottom:14px; }


  @media (max-width:820px){
    #app{ flex-direction:column; }
    .sidebar{ width:100%; flex-direction:column; padding:18px 16px; gap:16px; }
    .new-deck-btn, .sidebar > .ghost-btn{ width:100%; justify-content:center; }
    .deck-list{ flex-direction:column; overflow-x:visible; gap:8px; }
    .deck-item{ padding:14px 16px; border-radius:12px; background:var(--surface); border:1px solid var(--border); }
    .deck-dot{ width:11px; height:11px; }
    .deck-item-name{ font-size:16px; font-weight:600; }
    .due-badge{ font-size:11.5px; padding:3px 9px; }
    .main{ padding:16px; }
    .mode-grid{ grid-template-columns:1fr; }
    .stat-row{ flex-wrap:wrap; }
    .stat-chip{ min-width:0; flex:1 1 calc(33% - 8px); padding:10px 12px; }
    .session-top{ flex-wrap:wrap; row-gap:10px; }
    .session-progress{ flex-basis:100%; order:3; margin:0 !important; }
    .session-badges{ order:2; }
    .card-row{ flex-wrap:wrap; row-gap:6px; }
    .card-row .front, .card-row .back{ flex:1 1 100%; }
    .card-form .row{ flex-direction:column; }
    .modal{ width:calc(100vw - 40px) !important; max-height:85vh; overflow-y:auto; }
    .results-stats{ flex-wrap:wrap; justify-content:center; }
    .res-chip{ min-width:0; flex:1 1 calc(50% - 7px); }

    /* navegação em etapas: só uma "tela" por vez (lista de baralhos OU baralho aberto) */
    #app.step-detail .sidebar{ display:none; }
    #app.step-home .main{ display:none; }
    .mobile-back-btn{ display:inline-flex; }
  }
</style>
<script>
// aplica o tema salvo o quanto antes, antes do resto da página desenhar,
// pra não piscar o tema errado por uma fração de segundo.
(function(){
  try{
    if(localStorage.getItem('recall_theme') === 'light'){
      document.documentElement.setAttribute('data-recall-theme', 'light');
      var tc = document.getElementById('theme-color-meta'); if(tc) tc.content = '#FAF8F5';
      var sb = document.getElementById('status-bar-style-meta'); if(sb) sb.content = 'default';
    }
  }catch(e){}
})();
</script>
</head>
<body>
<div id="app"></div>

<script>
/* ============ STATE ============ */
const STORAGE_KEY = 'flashcards_app_data';
const DECK_COLORS = ['#F5A623','#6EE7B7','#7DA9FA','#FB7185','#C99CF7','#F5D76E'];
const EXERCISE_TYPES = ['translate','reverseTranslate','write','mc','translateOther'];
const EXERCISE_LABELS = { translate:'Tradução direta', reverseTranslate:'Tradução invertida', write:'Tradução de frase', mc:'Múltipla escolha', translateOther:'Tradução alternativa', 'copy-translation':'Copiar tradução' };
const STANDARD_STUDY_TYPES = ['mc', 'open', 'image'];
const STD_TYPE_LABELS = { mc:'Múltipla escolha', open:'Aberta', 'image-answer':'Com imagem' };
function getCardTranslations(card){
  return String((card&&card.back)||'').split('/').map(t=>t.trim()).filter(Boolean);
}

function stripParens(str){
  return String(str||'').replace(/\([^)]*\)/g, '').replace(/\s+/g,' ').trim();
}
function normalizeAnswer(str){
  return String(str||'')
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'') // remove acentos
    .replace(/[.,!?;:"'()]/g,'')
    .replace(/\s+/g,' ')
    .trim();
}
function diffWords(typedText, correctText){
  // compara palavra por palavra (maior subsequência comum) e marca quais palavras
  // digitadas pelo usuário não batem com a resposta correta, na ordem certa.
  const typedWords = String(typedText||'').split(/\s+/).filter(Boolean);
  const correctWords = String(correctText||'').split(/\s+/).filter(Boolean);
  const a = typedWords.map(normalizeAnswer);
  const b = correctWords.map(normalizeAnswer);
  const n = a.length, m = b.length;
  const dp = Array.from({length: n+1}, () => new Array(m+1).fill(0));
  for(let i=n-1; i>=0; i--){
    for(let j=m-1; j>=0; j--){
      dp[i][j] = a[i]===b[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
    }
  }
  const matched = new Array(n).fill(false);
  let i=0, j=0;
  while(i<n && j<m){
    if(a[i]===b[j]){ matched[i]=true; i++; j++; }
    else if(dp[i+1][j] >= dp[i][j+1]) i++;
    else j++;
  }
  return typedWords.map((w, idx) => ({ text: w, correct: matched[idx] }));
}
function checkLocalTranslation(userInput, correctBack){
  const norm = normalizeAnswer(userInput);
  const options = String(correctBack||'').split('/').map(o=>normalizeAnswer(o)).filter(Boolean);
  return options.includes(norm);
}

function hasClaudeStorage(){
  return typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function';
}

function hasFirebaseUser(){
  return !hasClaudeStorage() && !!state.firebaseUser;
}
async function loadData(){
  for(let attempt=0; attempt<2; attempt++){
    try{
      if(hasClaudeStorage()){
        const r = await window.storage.get(STORAGE_KEY, false);
        if(r && r.value){
          const d = JSON.parse(r.value);
          state.decks = d.decks || [];
          state.cards = d.cards || {};
          state.stats = d.stats || { totalPoints: 0 };
          state.books = (d.books || []).map(normalizeBook);
          if(d.geminiApiKey) setApiKey(d.geminiApiKey);
          if(d.booksApiKey) setBooksApiKey(d.booksApiKey);
        }
      } else if(hasFirebaseUser()){
        const snap = await db.collection('users').doc(state.firebaseUser.uid).get();
        if(snap.exists){
          const d = snap.data();
          state.decks = d.decks || [];
          state.cards = d.cards || {};
          state.stats = d.stats || { totalPoints: 0 };
          state.books = (d.books || []).map(normalizeBook);
          // sincroniza a chave do Gemini entre aparelhos logados na mesma conta —
          // assim não precisa configurar de novo em cada navegador/celular.
          if(d.geminiApiKey) setApiKey(d.geminiApiKey);
          if(d.booksApiKey) setBooksApiKey(d.booksApiKey);
        }
      }
      break; // sucesso, não precisa repetir
    }catch(e){
      if(attempt === 0){ await sleep(600); continue; } // falha temporária: tenta mais uma vez em silêncio
      // segunda falha: segue com o app vazio, sem travar a tela nem assustar com um log de erro
    }
  }
  render();
}
async function saveData(){
  const payload = JSON.parse(JSON.stringify({decks: state.decks, cards: state.cards, stats: state.stats, books: state.books, geminiApiKey: getApiKey(), booksApiKey: getBooksApiKey()}));
  for(let attempt=0; attempt<2; attempt++){
    try{
      if(hasClaudeStorage()){
        await window.storage.set(STORAGE_KEY, JSON.stringify(payload), false);
      } else if(hasFirebaseUser()){
        await db.collection('users').doc(state.firebaseUser.uid).set(payload);
      }
      if(state.saveFailed){ state.saveFailed = false; render(); }
      break; // sucesso
    }catch(e){
      if(attempt === 0){ await sleep(600); continue; }
      state.saveFailed = true; // segunda falha: sinaliza discretamente na UI, sem banner de erro
      render();
    }
  }
  // se o usuário escolheu um arquivo local (File System Access API), mantém ele sincronizado também
  if(state.fileHandle){
    try{
      const writable = await state.fileHandle.createWritable();
      await writable.write(JSON.stringify(payload));
      await writable.close();
    }catch(e){
      console.error('Falha ao sincronizar com o arquivo local', e);
      // não interrompe o fluxo — o armazenamento padrão já cuidou de salvar
    }
  }
}

// evita ficar "carregando pra sempre" se o Worker não responder — sem isso,
// uma falha de rede podia deixar a tela girando pra sempre.
function withTimeout(promise, ms, timeoutMessage){
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error(timeoutMessage || 'timeout')), ms))
  ]);
}
async function getFirebaseIdToken(){
  if(!auth || !auth.currentUser) throw new Error('not_logged_in');
  return await auth.currentUser.getIdToken();
}

  }), 25000, 'upload_timeout');

}

/* ============ SPACED REPETITION (SM-2 simplified) ============ */
function scheduleCard(card, correct){
  const now = Date.now();
  card.ease = card.ease || 2.5;
  card.reps = card.reps || 0;
  card.interval = card.interval || 0;
  card.missStreak = card.missStreak || 0;
  if(correct){
    card.reps += 1;
    if(card.reps === 1) card.interval = 1;
    else if(card.reps === 2) card.interval = 6;
    else card.interval = Math.round(card.interval * card.ease);
    card.ease = Math.max(1.3, card.ease + 0.1);
    card.missStreak = 0;
  } else {
    card.reps = 0;
    card.interval = 1;
    card.ease = Math.max(1.3, card.ease - 0.2);
    card.missStreak += 1;
  }
  card.due = now + card.interval * 24*60*60*1000;
}
/* variante com 3 níveis de dificuldade, usada na pergunta aberta sem IA (autoavaliação) */
function scheduleCardGraded(card, grade){
  const now = Date.now();
  card.ease = card.ease || 2.5;
  card.reps = card.reps || 0;
  card.interval = card.interval || 0;
  card.missStreak = card.missStreak || 0;
  if(grade === 'hard'){
    card.reps = 0;
    card.interval = 1;
    card.ease = Math.max(1.3, card.ease - 0.2);
    card.missStreak += 1;
  } else {
    card.reps += 1;
    if(card.reps === 1) card.interval = 1;
    else if(card.reps === 2) card.interval = 6;
    else card.interval = Math.round(card.interval * card.ease);
    if(grade === 'easy'){
      card.ease = Math.max(1.3, card.ease + 0.15);
      card.interval = Math.round(card.interval * 1.3);
    } else { // medium
      card.ease = Math.max(1.3, card.ease + 0.05);
    }
    card.missStreak = 0;
  }
  card.due = now + card.interval * 24*60*60*1000;
}
function getDueCards(deckId){

   interval===0 identifica com segurança um cartão nunca estudado. */
const MATURE_INTERVAL_DAYS = 21;
function getCardState(card){
  if(!card.interval) return 'new';
  return card.interval >= MATURE_INTERVAL_DAYS ? 'mature' : 'learning';
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

/* ============ SOUND ============ */
let audioCtx = null;
function getCtx(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
function beep(freq, dur, delay, vol){
  const ctx = getCtx();
  const osc = ctx.createOscillator(); const gain = ctx.createGain();
  osc.type = 'sine'; osc.frequency.value = freq;
  osc.connect(gain); gain.connect(ctx.destination);
  const t = ctx.currentTime + delay;
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(vol||0.28, t+0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  osc.start(t); osc.stop(t+dur+0.03);
}

function playWrong(){ beep(220,0.14,0); beep(160,0.22,0.09,0.22); }
function playStreakBonus(){
  beep(784,0.08,0); beep(988,0.08,0.08); beep(1318,0.08,0.16); beep(1568,0.08,0.24); beep(2093,0.22,0.32);

/* ============ PONTUAÇÃO / GAMIFICAÇÃO ============ */
function awardPoints(card, correct, exType, grade){
  const s = state.session;
  s.streak = s.streak || 0;
  s.points = s.points || 0;
  state.stats = state.stats || { totalPoints: 0 };
  let earned = 0;
  let bonusMsg = '';
  let streakBonus = false;
  if(correct){
    earned = grade === 'easy' ? 15 : grade === 'medium' ? 8 : 10;
    s.streak++;
    if(exType === 'translate' && s.userInput){
      const norm = normalizeAnswer(s.userInput.trim());
      card.usedTranslateAnswers = card.usedTranslateAnswers || [];
      if(card.usedTranslateAnswers.length > 0 && !card.usedTranslateAnswers.includes(norm)){
        earned += 5;
        bonusMsg = 'Nova tradução usada! +5';
      }
      if(!card.usedTranslateAnswers.includes(norm)) card.usedTranslateAnswers.push(norm);
    }
    if(s.streak % 5 === 0){
      earned += 20;
      streakBonus = true;
      bonusMsg = (bonusMsg ? bonusMsg + ' · ' : '') + `Sequência de ${s.streak}! +20`;
    }
  } else {
    earned = grade === 'hard' ? 2 : 0;
    s.streak = 0;
  }
  s.points += earned;
  state.stats.totalPoints = (state.stats.totalPoints||0) + earned;
  s.lastEarned = earned;
  s.lastBonusMsg = bonusMsg;
  if(streakBonus) playStreakBonus();
  else if(correct) playCorrect();
  else playWrong();
  saveData();
  return earned;
}

/* Lembra qual arquivo local foi escolhido, pra tentar reconectar sozinho na próxima vez
   que a página abrir (só faz sentido fora do sandbox do Claude.ai). */
const FS_DB_NAME = 'recall_fs_handles';
const FS_STORE = 'handles';
function openHandleDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(FS_DB_NAME, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(FS_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
/* o arquivo lembrado fica preso à conta logada, não só ao navegador — assim, se
   duas pessoas usarem o mesmo computador com contas diferentes, uma não reconecta
   sem querer ao arquivo que a outra configurou. */
function getFileHandleKey(){
  return hasFirebaseUser() ? `user:${state.firebaseUser.uid}` : 'main';
}
async function storeFileHandle(handle){
  try{
    const db = await openHandleDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(FS_STORE, 'readwrite');
      tx.objectStore(FS_STORE).put(handle, getFileHandleKey());
      tx.oncomplete = resolve; tx.onerror = () => reject(tx.error);
    });
  }catch(e){ console.error('Falha ao lembrar do arquivo local', e); }
}
async function loadStoredFileHandle(){
  try{
    const db = await openHandleDB();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(FS_STORE, 'readonly');
      const req = tx.objectStore(FS_STORE).get(getFileHandleKey());
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }catch(e){ console.error(e); return null; }
}
async function tryReconnectFileHandle(){
  if(hasClaudeStorage() || !hasFileSystemAccess()) return;
  const handle = await loadStoredFileHandle();
  if(!handle) return;
  try{
    const perm = await handle.queryPermission({ mode: 'readwrite' });
    if(perm === 'granted'){
      state.fileHandle = handle;
      render();
    } else {
      state.pendingFileHandle = handle; // precisa de 1 clique pra reconceder a permissão
      render();
    }
  }catch(e){ console.error('Falha ao tentar reconectar ao arquivo local', e); }
}
async function reconnectFileHandle(){
  const handle = state.pendingFileHandle;
  if(!handle) return;
  try{
    const perm = await handle.requestPermission({ mode: 'readwrite' });
    if(perm === 'granted'){
      state.fileHandle = handle;
      state.pendingFileHandle = null;
      showToast('Reconectado ao arquivo local.');
      render();
    } else {
      showToast('Permissão negada para o arquivo.', 'error');
    }
  }catch(e){ console.error(e); showToast('Não foi possível reconectar ao arquivo.', 'error'); }
}
async function saveToFileSystem(){
  try{
    if(!state.fileHandle){
      state.fileHandle = await window.showSaveFilePicker({
        suggestedName: 'recall-backup.json',
        types: [{ description: 'Backup do Recall', accept: {'application/json': ['.json']} }]
      });
      storeFileHandle(state.fileHandle);
    }
    const payload = JSON.stringify({ decks: state.decks, cards: state.cards, stats: state.stats }, null, 2);
    const writable = await state.fileHandle.createWritable();
    await writable.write(payload);
    await writable.close();

function replaceAllData(data){
  state.decks = (data.decks || []).map(d => ({ id: d.id || uid(), name: d.name, color: d.color || DECK_COLORS[0], type: d.type || 'standard', enabledExercises: d.enabledExercises, carryOverLang: d.carryOverLang || [], carryOverByMode: d.carryOverByMode || {} }));
  const newCards = {};
  state.decks.forEach(d => {
    const oldCards = (data.cards && data.cards[d.id]) || [];
    newCards[d.id] = oldCards.map(c => normalizeImportedCard(c));
  });
  state.cards = newCards;
  state.stats = data.stats || { totalPoints: 0 };
  state.currentDeckId = null; state.view = 'home';
  saveData(); render();
}
function normalizeImportedCard(c){
  const card = {
    id: c.id || uid(), front: c.front, back: c.back || '', note: c.note || '',
    ease: c.ease || 2.5, interval: c.interval || 0, reps: c.reps || 0, due: c.due || Date.now(),
    flagged: !!c.flagged, learned: !!c.learned, priority: !!c.priority,
    missStreak: c.missStreak || 0, usedTranslateAnswers: c.usedTranslateAnswers || []
  };
  if(c.cardKind === 'image'){
    card.cardKind = 'image'; card.imageUrl = c.imageUrl || ''; card.pinX = c.pinX || 0; card.pinY = c.pinY || 0;
  }
  return card;
}

function importFullBackup(data){
  const deckIdMap = {}; // id antigo -> novo, pra remapear o vínculo livro->baralho
  (data.decks || []).forEach(d => {
    const newId = uid();
    deckIdMap[d.id] = newId;
    state.decks.push({ id:newId, name: d.name, color: d.color || DECK_COLORS[state.decks.length % DECK_COLORS.length], type: d.type || 'standard', enabledExercises: d.enabledExercises, carryOverLang: d.carryOverLang || [], carryOverByMode: d.carryOverByMode || {} });
    const oldCards = (data.cards && data.cards[d.id]) || [];
    state.cards[newId] = oldCards.map(c => normalizeImportedCard(c));
  });
  (data.books || []).forEach(b => {
    const nb = normalizeBook(b);
    nb.id = uid();
    nb.quotes = (b.quotes||[]).map(q=>({ id: uid(), text: q.text||'', createdAt: q.createdAt||Date.now() }));
    nb.linkedDeckId = deckIdMap[b.linkedDeckId] || null;
    state.books.push(nb);
  });

}

function handleImportFile(deckId, filename, content){
  const deck = state.decks.find(d=>d.id===deckId);
  const isLanguage = deck && deck.type === 'language';
  let added = 0;
  try{
    if(filename.toLowerCase().endsWith('.json')){
      const data = JSON.parse(content);
      let items = [];
      if(Array.isArray(data)) items = data;
      else if(Array.isArray(data.cards)) items = data.cards;
      else if(data.decks && data.cards){ importFullBackup(data); showToast('Backup completo importado como novo(s) baralho(s).'); return; }
      items.forEach(item => {
        if(isLanguage){
          const term = typeof item === 'string' ? item : (item && (item.front || item.term));
          const translation = (item && typeof item === 'object') ? (item.back || item.translation || '') : '';
          if(term && String(term).trim()){ state.cards[deckId].push(makeCard(String(term), String(translation||''))); added++; }
        } else if(item && item.front && item.back){
          state.cards[deckId].push(makeCard(item.front, item.back)); added++;
        }
      });
    } else {
      // .txt / .csv / .tsv — cobre a exportação "Notes in Plain Text" do Anki
      const lines = content.split(/\r?\n/);
      lines.forEach(line => {
        if(!line.trim() || line.startsWith('#')) return; // ignora cabeçalho de metadados do Anki
        let parts = line.split('\t');
        if(parts.length < 2) parts = line.split(';');
        if(parts.length < 2) parts = line.split(',');
        if(isLanguage){
          const term = parts[0].trim().replace(/^"|"$/g,'').replace(/<[^>]+>/g,'');
          const translation = parts.length >= 2 ? parts[1].trim().replace(/^"|"$/g,'').replace(/<[^>]+>/g,'') : '';
          if(term){ state.cards[deckId].push(makeCard(term, translation)); added++; }
          return;
        }
        if(parts.length >= 2){
          const front = parts[0].trim().replace(/^"|"$/g,'').replace(/<[^>]+>/g,'');
          const back = parts[1].trim().replace(/^"|"$/g,'').replace(/<[^>]+>/g,'');
          if(front && back){ state.cards[deckId].push(makeCard(front, back)); added++; }
        }
      });
    }
  }catch(e){
    console.error(e);
    showToast('Não foi possível importar esse arquivo. Confira o formato e tente de novo.', 'error');
    return;
  }
  saveData(); render();
  showToast(added > 0 ? `${added} cartão(ões) importado(s) com sucesso.` : 'Nenhum cartão válido encontrado nesse arquivo.');
}

// modelo usado só pra ler foto e gerar as perguntas (função da câmera); o resto do
// app (pergunta aberta, tradução, múltipla escolha etc.) usa GEMINI_MODEL_TEXT.
const GEMINI_MODEL_VISION = "gemini-3.1-flash-lite";
const GEMINI_MODEL_TEXT = "gemini-3.5-flash-lite";
async function callGemini(prompt, opts){
  opts = opts || {};
  const key = getApiKey();
  if(!key){ const err = new Error('missing_api_key'); err.code = 'missing_api_key'; throw err; }
  const model = opts.model || GEMINI_MODEL_TEXT;
  const parts = [{ text: prompt }];
  if(opts.imageBase64) parts.push({ inline_data: { mime_type: opts.imageMime || 'image/jpeg', data: opts.imageBase64 } });
  const body = { contents: [{ parts }] };
  // os modelos "flash" atuais do Gemini gastam uma parte imprevisível do limite de tokens
  // em raciocínio interno (não aparece na resposta) antes de escrever o texto visível —
  // sem essa folga, respostas curtas saem cortadas no meio (finishReason: MAX_TOKENS).
  body.generationConfig = { maxOutputTokens: (opts.maxTokens||400) + 800 };
  if(opts.useSearch) body.tools = [{ google_search: {} }];
  const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if(!resp.ok){
    const errBody = await resp.text().catch(()=> '');
    const err = new Error('api_error');
    err.code = 'api_error'; err.status = resp.status; err.detail = errBody;
    throw err;
  }
  const data = await resp.json();
  const candidate = (data.candidates||[])[0];
  const text = (candidate && candidate.content && candidate.content.parts) ? candidate.content.parts.map(p=>p.text||'').join('') : '';
  if(!text){ const err = new Error('empty_response'); err.code = 'empty_response'; throw err; }
  return text;
}

async function generateDistractors(question, correctAnswer){
  const prompt = `Pergunta: ${question}\nResposta correta: ${correctAnswer}\n\nGere exatamente 3 alternativas ERRADAS, plausíveis, curtas e no mesmo estilo/formato da resposta correta, para um quiz de múltipla escolha. As alternativas devem poder confundir alguém que não sabe bem o assunto, mas precisam estar objetivamente erradas. Responda SOMENTE com um array JSON de 3 strings, sem nenhum texto antes ou depois. Exemplo de formato: ["alternativa 1", "alternativa 2", "alternativa 3"]`;
  const text = (await callGemini(prompt, { maxTokens: 300 })).trim();
  const clean = text.replace(/```json|```/g,"").trim();
  const arr = JSON.parse(clean);
  if(!Array.isArray(arr) || arr.length < 3) throw new Error('formato inesperado');
  return arr.slice(0,3);
}

async function verifyOpenAnswer(question, referenceAnswer, userAnswer){
  const prompt = `Pergunta: ${question}\nResposta de referência: ${referenceAnswer}\nResposta dada pelo usuário: ${userAnswer}\n\nUse a busca na internet se precisar checar fatos atuais ou específicos. Avalie se a resposta do usuário está correta em conteúdo (não precisa ser idêntica em palavras). Termine sua resposta com uma linha, exatamente neste formato: "VEREDITO: CORRETO" ou "VEREDITO: INCORRETO", seguida de uma explicação de no máximo 2 frases sobre por quê.`;
  // a busca no Google (useSearch) tem uma cota gratuita bem mais restrita que as
  // chamadas comuns e costuma estourar (429) rapidinho; se isso acontecer, refaz
  // a verificação sem busca (só com o conhecimento do modelo) em vez de falhar.
  let text;
  try{
    text = await callGemini(prompt, { maxTokens: 600, useSearch: true });
  }catch(e){
    if(e && e.code === 'api_error' && e.status === 429){
      text = await callGemini(prompt, { maxTokens: 600, useSearch: false });
    } else {
      throw e;
    }
  }
  const isIncorrect = /VEREDITO:\s*INCORRETO/i.test(text);
  const isCorrect = !isIncorrect && /VEREDITO:\s*CORRETO/i.test(text);
  let explanation = text.split(/VEREDITO:\s*(CORRETO|INCORRETO)/i).pop().trim();
  if(!explanation) explanation = text.trim().slice(-280);
  return { correct: isCorrect, explanation };
}

async function generateFlashcardsFromImage(base64Data, mimeType, count, avoidFronts){
  count = count || 3;
  const avoidText = (avoidFronts && avoidFronts.length)
    ? `\n\nJá existem estes flashcards aprovados sobre essa mesma imagem — NÃO repita essas perguntas nem o mesmo foco, gere outras diferentes:\n${avoidFronts.map(f => `- ${f}`).join('\n')}`
    : '';
  const prompt = `Esta imagem é uma foto de uma página de livro. Leia e entenda o texto da página e crie exatamente ${count} flashcard(s) de pergunta e resposta em português sobre o conteúdo principal dela. As perguntas devem ser objetivas e as respostas curtas e diretas. Para cada flashcard, escreva também uma nota breve (1-2 frases) com uma explicação um pouco mais elaborada do conteúdo, pra consultar depois durante o estudo.${avoidText}\n\nResponda SOMENTE com um JSON válido, sem nenhum texto antes ou depois, exatamente neste formato:\n[{"front":"pergunta","back":"resposta objetiva","note":"breve explicação do conteúdo"}, ...]`;
  const text = (await callGemini(prompt, { maxTokens: 300*count, imageBase64: base64Data, imageMime: mimeType, model: GEMINI_MODEL_VISION })).trim();
  const clean = text.replace(/```json|```/g,"").trim();
  const arr = JSON.parse(clean);
  if(!Array.isArray(arr) || arr.length === 0) throw new Error('formato inesperado');
  return arr.slice(0,count).map(c => ({
    front: String((c && c.front) || '').trim(),
    back: String((c && c.back) || '').trim(),
    note: String((c && c.note) || '').trim()
  })).filter(c => c.front && c.back);
}

async function generateSentenceForTerm(term){
  const prompt = `Termo em inglês a treinar: "${term}"\n\nEscreva UMA frase natural em inglês, de nível intermediário, que use claramente o termo "${term}" em contexto. Responda SOMENTE com a frase em inglês, sem aspas e sem nenhum texto adicional.`;
  const text = (await callGemini(prompt, { maxTokens: 150 })).trim();
  return text.replace(/^"|"$/g,'');
}

async function translateWordInContext(word, sentence){
  const prompt = `Frase em inglês: "${sentence}"\nPalavra específica dentro dessa frase: "${word}"\n\nTraduza essa palavra pro português considerando o sentido dela NESSA frase (a mesma palavra pode significar coisas diferentes dependendo do contexto). Se houver mais de uma tradução igualmente válida pra ESSE sentido específico (sinônimos próximos — não liste sentidos diferentes da palavra, só desse uso), liste até 3, da mais natural pra menos natural. Escreva também uma explicação breve (1-2 frases, em português) sobre o significado/uso do termo nesse contexto — algo que ajude a fixar e entender nuances, não só decorar.\n\nResponda SOMENTE com um JSON válido, sem nenhum texto antes ou depois, exatamente neste formato:\n{"translations":["tradução principal","outra opção"],"note":"explicação breve"}`;
  const text = (await callGemini(prompt, { maxTokens: 300 })).trim();
  const clean = text.replace(/```json|```/g,"").trim();
  const obj = JSON.parse(clean);
  const translations = (Array.isArray(obj.translations) ? obj.translations : []).map(t=>String(t||'').trim()).filter(Boolean);
  if(translations.length === 0) throw new Error('empty_response');
  return { translations, note: String(obj.note||'').trim() };
}

async function verifyTranslation(term, sentence, userTranslation){
  const prompt = `Frase em inglês: "${sentence}"\nTermo sendo treinado: "${term}"\nTradução para português dada pelo usuário: "${userTranslation}"\n\nAvalie se a tradução está correta em sentido geral e no uso específico do termo "${term}" (pequenas variações de palavras são aceitáveis se o sentido estiver certo). Se houver erro, explique claramente qual foi o erro e qual seria uma tradução mais adequada. Termine sua resposta com uma linha exatamente neste formato: "VEREDITO: CORRETO" ou "VEREDITO: INCORRETO", seguida de uma explicação em português (máximo 3 frases).`;
  const text = await callGemini(prompt, { maxTokens: 400 });
  const isIncorrect = /VEREDITO:\s*INCORRETO/i.test(text);
  const isCorrect = !isIncorrect && /VEREDITO:\s*CORRETO/i.test(text);
  let explanation = text.split(/VEREDITO:\s*(CORRETO|INCORRETO)/i).pop().trim();
  if(!explanation) explanation = text.trim().slice(-280);
  return { correct: isCorrect, explanation };
}

async function aiVerify(prompt, maxTokens){
  const text = await callGemini(prompt, { maxTokens: maxTokens||400 });
  const isIncorrect = /VEREDITO:\s*INCORRETO/i.test(text);
  const isCorrect = !isIncorrect && /VEREDITO:\s*CORRETO/i.test(text);
  let explanation = text.split(/VEREDITO:\s*(CORRETO|INCORRETO)/i).pop().trim();
  if(!explanation) explanation = text.trim().slice(-280);
  return { correct: isCorrect, explanation };
}

function shuffleMCOptions(content){
  // usado pra evitar viés de posição em conteúdo vindo de fora (ex: IA sempre no índice 0)
  if(!content || !Array.isArray(content.options)) return content;
  const order = shuffle(content.options.map((_, i) => i));
  return {
    ...content,
    options: order.map(i => content.options[i]),
    correctIndex: order.indexOf(content.correctIndex)
  };
}
function generateLocalMC(card, deckCards){
  // múltipla escolha 100% local: usa as traduções de OUTROS termos do baralho como alternativas erradas
  const eligibleOthers = (deckCards||[]).filter(c => c.id !== card.id && c.back);
  if(!card.back || eligibleOthers.length < 3) return null; // não há termos suficientes com tradução cadastrada
  const pickOne = (backStr) => {
    const opts = String(backStr||'').split('/').map(s=>s.trim()).filter(Boolean);
    return opts[Math.floor(Math.random()*opts.length)] || backStr;
  };
  const distractorCards = shuffle(eligibleOthers.slice()).slice(0, 3);
  const direction = Math.random() < 0.5 ? 'term' : 'translation';
  const cardTranslations = getCardTranslations(card);
  let promptText, correctTexts, distractorTexts;
  if(direction === 'term'){
    promptText = `Qual é a tradução de "${card.front}"?`;
    if(cardTranslations.length >= 2){
      // termo com 2+ traduções aceitas: inclui 2 delas como certas, pra reforçar que mais de uma resposta vale
      correctTexts = shuffle(cardTranslations.slice()).slice(0, 2);
      distractorTexts = distractorCards.map(c => pickOne(c.back)).slice(0, 2);
    } else {
      correctTexts = [pickOne(card.back)];
      distractorTexts = distractorCards.map(c => pickOne(c.back));
    }
  } else {
    promptText = `Qual termo em inglês significa "${pickOne(card.back)}"?`;
    correctTexts = [stripParens(card.front)];
    distractorTexts = distractorCards.map(c => stripParens(c.front));
  }
  const entries = shuffle([
    ...correctTexts.map(t => ({ text: t, correct: true })),
    ...distractorTexts.map(t => ({ text: t, correct: false }))
  ]);
  return {
    prompt: promptText,
    options: entries.map(e => e.text),
    correctIndexes: entries.map((e,i) => e.correct ? i : -1).filter(i => i !== -1)
  };
}
function generateLocalMCStandard(card, deckCards){
  // múltipla escolha local pro baralho padrão: usa respostas de OUTROS cartões como alternativas erradas
  const eligibleOthers = (deckCards||[]).filter(c => c.id !== card.id && c.back && c.back !== card.back);
  if(eligibleOthers.length < 3) return null; // não há cartões suficientes no baralho
  const distractorCards = shuffle(eligibleOthers.slice()).slice(0, 3);
  return shuffle([card.back, ...distractorCards.map(c => c.back)]);
}

/* ============ GERAÇÃO EM LOTE (pré-carrega frases da sessão pra economizar mensagens) ============ */
const LANG_BATCH_SIZE = 6; // itens processados por chamada de IA
async function generateSentencesBatch(terms){
  const listText = terms.map((t,i)=>`${i}. "${t}"`).join('\n');
  const prompt = `Você vai receber uma lista numerada de termos em inglês para treinar.\n\n${listText}\n\nPara CADA termo, escreva UMA frase natural em inglês, de nível intermediário, que use claramente o termo em contexto.\n\nResponda SOMENTE com um JSON válido, sem nenhum texto antes ou depois, exatamente neste formato:\n[{"i": 0, "sentence": "frase em inglês"}, ...]\n\nO campo "i" deve corresponder ao número do termo na lista acima (começando em 0).`;
  const text = (await callGemini(prompt, { maxTokens: 120*terms.length })).trim();
  const clean = text.replace(/```json|```/g,"").trim();
  const parsed = JSON.parse(clean);
  if(!Array.isArray(parsed)) throw new Error('formato inesperado');
  return parsed;
}
async function prefetchSessionContent(s){
  const cardsById = {};
  (state.cards[s.deckId]||[]).forEach(c => cardsById[c.id] = c);
  const writeIds = []; const seen = new Set();
  s.queue.forEach(item => {
    const key = `${item.cardId}:${item.exType}`;
    if(seen.has(key)) return;
    seen.add(key);
    if(item.exType === 'write') writeIds.push(item.cardId);
  });
  s.contentCache = {};
  if(writeIds.length === 0) return; // nada pra pré-gerar (mc agora é local, e os demais tipos também)

  s.prefetch = { active: true, done: 0, total: writeIds.length };
  render();

  for(let i=0; i<writeIds.length; i+=LANG_BATCH_SIZE){
    const batchIds = writeIds.slice(i, i+LANG_BATCH_SIZE);
    const terms = batchIds.map(id => cardsById[id].front);
    try{
      const results = await generateSentencesBatch(terms);
      results.forEach(r => {
        const cardId = batchIds[r.i];
        if(cardId && r.sentence) s.contentCache[`${cardId}:write`] = { sentence: r.sentence };
      });
    }catch(e){ console.error('Falha ao pré-gerar frases em lote', e); }
    s.prefetch.done = Math.min(s.prefetch.done + batchIds.length, s.prefetch.total);
    render();
  }
  s.prefetch.active = false;
  render();
}

const PHOTO_MAX_DIM = 1280; // reduz a imagem antes de enviar pra IA, economiza tokens/tempo
function drawImageRegionToBase64(imgEl, sx, sy, sw, sh){
  let outW = sw, outH = sh;
  if(outW > PHOTO_MAX_DIM || outH > PHOTO_MAX_DIM){
    const scale = PHOTO_MAX_DIM / Math.max(outW, outH);
    outW = Math.round(outW * scale); outH = Math.round(outH * scale);
  }
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1, Math.round(outW)); canvas.height = Math.max(1, Math.round(outH));
  canvas.getContext('2d').drawImage(imgEl, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
  return { dataUrl, base64: dataUrl.split(',')[1], mime: 'image/jpeg' };
}
function openImagePicker(useCamera, onReady){

/* arrastar/redimensionar a área de corte: usa Pointer Events (unifica mouse e touch)
   e evita chamar render() durante o arraste — um innerHTML novo destruiria os
   listeners no meio do gesto, então só mexemos direto no estilo do DOM até soltar. */
let cropDragState = null;
function clampCropBox(box){
  box.w = Math.max(4, Math.min(100, box.w));
  box.h = Math.max(4, Math.min(100, box.h));
  box.x = Math.max(0, Math.min(100 - box.w, box.x));
  box.y = Math.max(0, Math.min(100 - box.h, box.y));
  return box;
}
function applyCropBoxStyle(box){
  const el = document.getElementById('crop-box');
  if(!el) return;
  el.style.left = box.x + '%'; el.style.top = box.y + '%';
  el.style.width = box.w + '%'; el.style.height = box.h + '%';
}
function startCropDrag(e){
  const m = state.modal;
  if(!m || m.type !== 'photo-crop') return;
  const container = document.getElementById('crop-container');
  const rect = container.getBoundingClientRect();
  const px = ((e.clientX - rect.left) / rect.width) * 100;
  const py = ((e.clientY - rect.top) / rect.height) * 100;
  const handleEl = e.target.closest && e.target.closest('[data-handle]');
  if(handleEl){
    cropDragState = { mode:'resize', handle: handleEl.dataset.handle, rect, startBox: { ...m.box } };
  } else {
    const box = m.box;
    const inside = px >= box.x && px <= box.x + box.w && py >= box.y && py <= box.y + box.h;
    if(inside){
      cropDragState = { mode:'move', rect, startBox: { ...box }, startPx: px, startPy: py };
    } else {
      cropDragState = { mode:'new', rect, originX: px, originY: py };
      m.box = { x: px, y: py, w: 0, h: 0 };
      applyCropBoxStyle(m.box);
    }
  }
  e.preventDefault();
  document.addEventListener('pointermove', onCropDrag);
  document.addEventListener('pointerup', endCropDrag, { once:true });
}
function onCropDrag(e){
  if(!cropDragState) return;
  const m = state.modal; if(!m || m.type !== 'photo-crop') return;
  const rect = cropDragState.rect;
  const px = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
  const py = Math.max(0, Math.min(100, ((e.clientY - rect.top) / rect.height) * 100));
  let box;
  if(cropDragState.mode === 'new'){
    const x0 = cropDragState.originX, y0 = cropDragState.originY;
    box = { x: Math.min(x0, px), y: Math.min(y0, py), w: Math.abs(px - x0), h: Math.abs(py - y0) };
  } else if(cropDragState.mode === 'move'){
    const dx = px - cropDragState.startPx, dy = py - cropDragState.startPy;
    box = { ...cropDragState.startBox, x: cropDragState.startBox.x + dx, y: cropDragState.startBox.y + dy };
  } else { // resize
    const sb = cropDragState.startBox;
    box = { ...sb };
    if(cropDragState.handle.includes('n')){ box.h = sb.y + sb.h - py; box.y = py; }
    if(cropDragState.handle.includes('s')){ box.h = py - sb.y; }
    if(cropDragState.handle.includes('w')){ box.w = sb.x + sb.w - px; box.x = px; }
    if(cropDragState.handle.includes('e')){ box.w = px - sb.x; }
  }
  if(cropDragState.mode !== 'new') clampCropBox(box);
  else { box.x = Math.max(0, box.x); box.y = Math.max(0, box.y); box.w = Math.min(100 - box.x, box.w); box.h = Math.min(100 - box.y, box.h); }
  m.box = box;
  applyCropBoxStyle(box);
  e.preventDefault();
}
function endCropDrag(){
  document.removeEventListener('pointermove', onCropDrag);
  cropDragState = null;
  const m = state.modal;
  if(m && m.type === 'photo-crop'){
    // corte acidentalmente minúsculo (ex: só um toque) não é útil — volta pra imagem inteira
    if(m.box.w < 4 || m.box.h < 4) m.box = { x:5, y:5, w:90, h:90 };
    else clampCropBox(m.box);
  }
  render();
}
function skipCropAndUseFull(){
  if(state.modal && state.modal.type === 'photo-crop') state.modal.box = { x:0, y:0, w:100, h:100 };
  confirmCrop();
}
function confirmCrop(){
  const m = state.modal;
  if(!m || m.type !== 'photo-crop') return;
  const box = m.box;
  const purpose = m.purpose, bookId = m.bookId;
  const img = new Image();
  img.onload = () => {
    const sx = (box.x / 100) * img.naturalWidth;
    const sy = (box.y / 100) * img.naturalHeight;
    const sw = (box.w / 100) * img.naturalWidth;
    const sh = (box.h / 100) * img.naturalHeight;
    const cropped = drawImageRegionToBase64(img, sx, sy, sw, sh);
    if(purpose === 'quote') runQuoteCapture(cropped, bookId);
    else runPhotoImportGeneration(cropped);
  };
  img.src = m.rawDataUrl;
}
async function runPhotoImportGeneration(img){
  const defaultDeck = state.decks.find(d => d.id === state.currentDeckId && d.type !== 'language') || state.decks.find(d => d.type !== 'language');
  state.modal = { type:'photo-import', status:'processing', imageDataUrl: img.dataUrl, base64: img.base64, mime: img.mime, cards: [], deckId: defaultDeck ? defaultDeck.id : '__new__', newDeckName:'', regenerating:false };
  render();
  try{
    const cards = await generateFlashcardsFromImage(img.base64, img.mime);
    if(cards.length === 0) throw new Error('empty_response');
    if(state.modal && state.modal.type === 'photo-import'){
      state.modal.status = 'review';
      state.modal.cards = cards.map(c => ({ ...c, include:true }));
    }
  }catch(err){
    console.error('Falha ao gerar cartões a partir da foto', err);
    if(state.modal && state.modal.type === 'photo-import'){
      state.modal.status = 'error';
      state.modal.error = friendlyAiErrorMsg(err);
    }
  }
  render();
}
function regenerateUncheckedCards(){
  const m = state.modal;
  if(!m || m.type !== 'photo-import' || m.status !== 'review' || m.regenerating) return;
  const uncheckedIdx = m.cards.map((c,i)=>i).filter(i => !m.cards[i].include);
  if(uncheckedIdx.length === 0){ showToast('Desmarque os cartões que quer trocar antes de gerar de novo.', 'error'); return; }
  m.regenerating = true; render();
  const keptFronts = m.cards.filter(c => c.include).map(c => c.front);
  generateFlashcardsFromImage(m.base64, m.mime, uncheckedIdx.length, keptFronts).then(newCards => {
    if(!state.modal || state.modal.type !== 'photo-import' || state.modal.status !== 'review') return;
    uncheckedIdx.forEach((idx,i) => { if(newCards[i]) state.modal.cards[idx] = { ...newCards[i], include:false }; });
  }).catch(err => {
    console.error('Falha ao gerar novos cartões', err);
    if(state.modal && state.modal.type === 'photo-import') showToast(friendlyAiErrorMsg(err), 'error');
  }).finally(() => {
    if(state.modal && state.modal.type === 'photo-import') state.modal.regenerating = false;
    render();
  });
}
function confirmPhotoImport(){
  const m = state.modal;
  const chosen = m.cards.filter(c => c.include && c.front.trim() && c.back.trim());
  if(chosen.length === 0){ showToast('Selecione ao menos um cartão pra adicionar.', 'error'); return; }
  let deckId = m.deckId;
  if(deckId === '__new__'){
    const name = (m.newDeckName||'').trim();
    if(!name){ showToast('Dê um nome ao novo baralho.', 'error'); return; }
    const color = DECK_COLORS[state.decks.length % DECK_COLORS.length];
    const deck = { id: uid(), name, color, type:'standard' };
    state.decks.push(deck);
    state.cards[deck.id] = [];
    deckId = deck.id;
  }
  if(!deckId || !state.decks.some(d=>d.id===deckId)){ showToast('Escolha um baralho.', 'error'); return; }
  chosen.forEach(c => {
    const card = makeCard(c.front, c.back);
    card.note = (c.note||'').trim();
    state.cards[deckId].push(card);
  });
  state.modal = null;
  state.currentDeckId = deckId; state.view = 'deck'; state.tab = 'cards';
  saveData(); render();
  showToast(`${chosen.length} cartão(ões) adicionado(s) ao baralho.`);
}

/* busca metadados/capa reais na API pública do Google Books — mais confiável
   que pedir pra uma IA "adivinhar" esses dados, e não gasta cota do Gemini. */
async function searchGoogleBooks(query){
  const key = getBooksApiKey();
  const url = `https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(query)}&maxResults=8${key ? `&key=${encodeURIComponent(key)}` : ''}`;
  const resp = await fetch(url);
  if(!resp.ok) throw new Error('books_api_error');
  const data = await resp.json();
  return (data.items||[]).map(it => {
    const info = it.volumeInfo || {};
    const cover = info.imageLinks ? (info.imageLinks.thumbnail || info.imageLinks.smallThumbnail || '') : '';
    return {
      title: info.title || '',
      author: (info.authors||[]).join(', '),
      category: (info.categories||[])[0] || '',
      coverUrl: cover.replace('http://','https://')
    };
  }).filter(b => b.title);
}

/* ============ STUDY SESSION ============ */
const AI_SESSION_CAP = 20;
function expandPoolForPriority(pool){
  // cartões marcados com 🔥 prioridade aparecem 2x na mesma sessão
  const expanded = [];
  pool.forEach(c => {
    expanded.push(c);
    if(c.priority) expanded.push(c);
  });
  return expanded;
}
function startSession(deckId, mode){
  const deck = state.decks.find(d=>d.id===deckId);
  const isImageMode = mode === 'image-answer' || mode === 'image-locate';
  const due = getDueCards(deckId).filter(c => isImageCard(c) === isImageMode);
  const basePool = due.length ? due : getStudyPool(deckId).filter(c => isImageCard(c) === isImageMode);
  if(basePool.length === 0){ showToast(isImageMode ? 'Nenhum cartão de imagem pronto pra estudar.' : 'Este baralho ainda não tem cartões.', 'error'); return; }
  const pool = expandPoolForPriority(basePool);
  const aiOn = isAiEnabled(deck);
  const usesAI = (mode === 'mc' || mode === 'open') && aiOn; // 'direct' é sempre local; mc/open só usam IA se o baralho tiver ela ligada

  let queue;
  if(usesAI){
    const fullIds = pool.map(c=>c.id);
    const carry = ((deck && deck.carryOverByMode && deck.carryOverByMode[mode]) || []).filter(id => fullIds.includes(id));
    const carrySet = new Set(carry);
    const fresh = shuffle(fullIds.filter(id => !carrySet.has(id)));
    const ordered = [...shuffle(carry), ...fresh];
    queue = ordered.slice(0, AI_SESSION_CAP);
    const leftover = ordered.slice(AI_SESSION_CAP);
    if(deck){
      deck.carryOverByMode = deck.carryOverByMode || {};
      deck.carryOverByMode[mode] = leftover;
      saveData();
    }
  } else {
    queue = shuffle(pool.map(c=>c.id));
  }

  state.session = {
    deckId, mode,
    usesGradedOpen: mode === 'open' && !aiOn,
    queue,
    index: 0,
    correct: 0,
    total: queue.length,
    startTime: Date.now(),
    cardStart: Date.now(),
    revealed: false,
    userInput: '',
    options: null,
    loadingOptions: false,
    verifying: false,
    verifyResult: null,
    lastFeedback: null,
    chosenIndex: null,
    graded: false,
    gradeChosen: null,
    autoMatched: false
  };
  state.view = 'study';
  render();
  const first = getCurrentCard();
  if(!first) return;
  if(mode === 'mc') loadOptionsForCurrent();
}
function finalizeCarryOver(){
  const s = state.session; if(!s) return;
  const remainder = s.queue.slice(s.index);
  if(remainder.length === 0) return;
  const deck = state.decks.find(d=>d.id===s.deckId);
  if(!deck) return;
  if(s.mode === 'lang-mixed'){
    const existing = deck.carryOverLang || [];
    const seen = new Set(existing.map(i=>`${i.cardId}:${i.exType}`));
    remainder.forEach(item => {
      const key = `${item.cardId}:${item.exType}`;
      if(!seen.has(key)){ existing.push(item); seen.add(key); }
    });
    deck.carryOverLang = existing;
    saveData();
  } else if(s.mode === 'std-mixed'){
    const existing = deck.carryOverStd || [];
    const seen = new Set(existing.map(i=>`${i.cardId}:${i.exType}`));
    remainder.forEach(item => {
      const key = `${item.cardId}:${item.exType}`;
      if(!seen.has(key)){ existing.push(item); seen.add(key); }
    });
    deck.carryOverStd = existing;
    saveData();
  } else if(s.mode === 'mc' || s.mode === 'open'){
    deck.carryOverByMode = deck.carryOverByMode || {};
    const existing = deck.carryOverByMode[s.mode] || [];
    const seen = new Set(existing);
    remainder.forEach(id => { if(!seen.has(id)){ existing.push(id); seen.add(id); } });
    deck.carryOverByMode[s.mode] = existing;
    saveData();
  }
}

function startMixedStandardSession(deckId){
  const deck = state.decks.find(d=>d.id===deckId);

  if(enabledTypes.length === 0){ showToast('Ative pelo menos 1 tipo de exercício antes de estudar.', 'error'); return; }

    if(isImageCard(c)){
      if(enabledTypes.includes('image')) fullQueue.push({ cardId: c.id, exType: 'image-answer' });
    } else {
      if(enabledTypes.includes('mc')) fullQueue.push({ cardId: c.id, exType: 'mc' });
      if(enabledTypes.includes('open')) fullQueue.push({ cardId: c.id, exType: 'open' });
    }
  });
  if(fullQueue.length === 0){ showToast('Nenhum cartão combina com os tipos ativos — ajuste os tipos ou adicione cartões.', 'error'); return; }

  const aiOn = isAiEnabled(deck);
  const usesAI = aiOn && (enabledTypes.includes('mc') || enabledTypes.includes('open') || enabledTypes.includes('image'));
  let queue;
  if(usesAI){
    const fullKeys = new Set(fullQueue.map(i => `${i.cardId}:${i.exType}`));
    const carry = ((deck && deck.carryOverStd) || []).filter(i => fullKeys.has(`${i.cardId}:${i.exType}`));
    const carrySet = new Set(carry.map(i => `${i.cardId}:${i.exType}`));
    const fresh = shuffle(fullQueue.filter(i => !carrySet.has(`${i.cardId}:${i.exType}`)));
    const ordered = [...shuffle(carry), ...fresh];
    queue = ordered.slice(0, AI_SESSION_CAP);
    const leftover = ordered.slice(AI_SESSION_CAP);
    if(deck){ deck.carryOverStd = leftover; saveData(); }
  } else {
    queue = shuffle(fullQueue);
  }

  state.session = {
    deckId, mode: 'std-mixed',
    usesGradedOpen: !aiOn,
    queue, index: 0,
    correct: 0, total: queue.length,
    startTime: Date.now(), cardStart: Date.now(),
    revealed: false, userInput: '', options: null, loadingOptions: false,
    verifying: false, verifyResult: null, lastFeedback: null, chosenIndex: null,
    graded: false, gradeChosen: null, autoMatched: false
  };
  state.view = 'study';
  render();
  if(getCurrentExType() === 'mc') loadOptionsForCurrent();

function startLanguageSession(deckId){
  const deck = state.decks.find(d=>d.id===deckId);

  if(enabledTypes.length === 0){ showToast('Ative pelo menos 1 tipo de exercício antes de estudar.', 'error'); return; }

  let fullQueue = [];

    enabledTypes.forEach(exType => {
      if((exType === 'translate' || exType === 'reverseTranslate') && !c.back) return; // sem tradução cadastrada, pula esses tipos pra esse termo
      if(exType === 'translateOther' && getCardTranslations(c).length < 2) return; // precisa de pelo menos 2 traduções pra ter uma resposta "alternativa" válida
      fullQueue.push({ cardId: c.id, exType });
    });
  });
  if(fullQueue.length === 0){ showToast('Adicione a tradução de pelo menos um termo (ou ative outro tipo de exercício) antes de estudar.', 'error'); return; }

  const usesAI = enabledTypes.includes('write'); // mc agora é local, só 'write' usa IA
  let queue;
  if(usesAI){
    const fullKeys = new Set(fullQueue.map(i => `${i.cardId}:${i.exType}`));
    const carry = (deck && deck.carryOverLang || []).filter(i => fullKeys.has(`${i.cardId}:${i.exType}`));
    const carrySet = new Set(carry.map(i => `${i.cardId}:${i.exType}`));
    const fresh = shuffle(fullQueue.filter(i => !carrySet.has(`${i.cardId}:${i.exType}`)));
    const ordered = [...shuffle(carry), ...fresh];

  state.session = {

    correct: 0, total: queue.length,

function friendlyAiErrorMsg(e){
  if(e && e.code === 'missing_api_key') return 'É preciso configurar sua chave de API do Gemini (link no rodapé da barra lateral) para usar os recursos de IA.';
  return 'Não foi possível verificar agora. Tente novamente.';
}
async function loadContentForCurrent(){
  const s = state.session; if(!s) return;
  const card = getCurrentCard(); if(!card) return;
  const exType = getCurrentExType();
  if(exType === 'translate'){ s.loadingContent = false; s.content = {}; render(); return; } // local, sem IA
  if(exType === 'reverseTranslate'){
    const options = String(card.back||'').split('/').map(o=>o.trim()).filter(Boolean);
    const chosen = options[Math.floor(Math.random()*options.length)] || card.back;
    s.loadingContent = false; s.content = { chosenTranslation: chosen }; render(); return; // local, sem IA
  }
  if(exType === 'mc'){
    const mc = generateLocalMC(card, state.cards[s.deckId]);
    s.loadingContent = false;
    s.content = mc || { error: true, notEnoughCards: true };
    render();
    return; // local, sem IA
  }
  if(exType === 'translateOther'){
    const options = getCardTranslations(card);
    const excludeIdx = Math.floor(Math.random()*options.length);
    s.loadingContent = false;
    s.content = { excluded: options[excludeIdx], validOptions: options.filter((_,i)=>i!==excludeIdx) };
    render();
    return; // local, sem IA
  }
  if(exType === 'copy-translation'){
    const item = getCurrentQueueItem();
    const options = getCardTranslations(card);
    const idx = Math.min((item && item.translationIndex) || 0, options.length-1);
    s.loadingContent = false;
    s.content = { targetTranslation: options[idx] };
    render();
    return; // local, sem IA
  }
  const cacheKey = `${card.id}:${exType}`;
  if(s.contentCache && s.contentCache[cacheKey]){
    s.loadingContent = false; s.content = s.contentCache[cacheKey]; render(); return; // já veio pré-gerado em lote
  }
  s.loadingContent = true; s.content = null; render();
  try{
    if(exType === 'write'){
      s.content = { sentence: await generateSentenceForTerm(card.front) };
    }
  }catch(e){
    console.error(e);
    s.content = { error: true, missingKey: e && e.code === 'missing_api_key' };
  }
  s.loadingContent = false; render();
}
function submitFromInput(inputId){
  const val = document.getElementById(inputId).value;
  state.session.userInput = val;
  submitLanguageAnswer();
}
function requeueOnWrong(){
  const s = state.session; if(!s) return;
  const current = s.queue[s.index];
  const clone = (current && typeof current === 'object') ? { ...current } : current;
  const offset = 3 + Math.floor(Math.random()*4); // reaparece de 3 a 6 perguntas à frente
  const insertAt = Math.min(s.index + offset, s.queue.length);
  s.queue.splice(insertAt, 0, clone);
}
function startMemorizeMode(){
  const s = state.session; if(!s || s.mode !== 'lang-mixed') return;
  const card = getCurrentCard(); if(!card) return;
  const translations = getCardTranslations(card);
  if(translations.length === 0){ showToast('Esse termo não tem tradução cadastrada — adicione uma antes de memorizar.', 'error'); return; }
  // 1 pergunta de cópia por tradução (até 2), depois sempre 2 de recordação livre —
  // assim quem tem só 1 tradução treina menos e quem tem 2+ é empurrado a usar as duas.
  let queue = [];
  const copyCount = Math.min(2, translations.length);
  for(let i=0; i<copyCount; i++) queue.push({ cardId: card.id, exType: 'copy-translation', translationIndex: i });
  queue.push({ cardId: card.id, exType: 'translate' });
  queue.push({ cardId: card.id, exType: 'translate' });
  state.previousSession = s; // guarda a sessão normal pra retomar depois
  state.session = {
    deckId: s.deckId, mode: 'lang-mixed', memorizeMode: true, memorizeCardId: card.id,
    queue, index: 0,
    correct: 0, total: queue.length,
    startTime: Date.now(), cardStart: Date.now(),
    revealed: false, userInput: '', verifying: false, verifyResult: null, lastFeedback: null,
    loadingContent: false, content: null, chosenIndex: null
  };
  showToast(`Modo memorizar: ${queue.length} exercícios focados só nesse termo.`);
  render();
  prefetchSessionContent(state.session).then(() => loadContentForCurrent());
}
function dontKnowOpen(){
  const s = state.session; const card = getCurrentCard();
  const inOpenContext = s && (s.mode === 'open' || (s.mode === 'std-mixed' && getCurrentExType() === 'open'));
  if(!s || !card || !inOpenContext || s.revealed) return;
  if(s.usesGradedOpen){
    scheduleCardGraded(card, 'hard');
    awardPoints(card, false, 'open-graded', 'hard');
  } else {
    scheduleCard(card, false);
    awardPoints(card, false, 'open');
  }
  requeueOnWrong(); // essa pergunta volta a aparecer mais à frente na sessão normal
  saveData();
  startCopyMemorize();
  // avança a sessão pausada além dessa pergunta, pra não repetir ela de novo assim que voltar
  if(state.previousSession){
    state.previousSession.index++;
    state.previousSession.revealed = false;
    state.previousSession.userInput = '';
    state.previousSession.verifyResult = null;
    state.previousSession.lastFeedback = null;
    state.previousSession.graded = false;
    state.previousSession.gradeChosen = null;
    state.previousSession.autoMatched = false;
  }
}

  // avança a sessão pausada além dessa pergunta, pra não repetir ela de novo assim que voltar

/* transforma uma frase gerada pela IA em texto com cada palavra clicável,
   pra consultar a tradução de termos desconhecidos sem sair do exercício. */
function renderClickableSentence(sentence){
  if(!sentence) return '';
  const tokens = sentence.split(/(\s+)/);
  return tokens.map(tok => {
    const m = tok.match(/^([A-Za-zÀ-ÿ']+)(.*)$/);
    if(m && m[1]){
      const word = m[1];
      return `<span class="clickable-word" onclick="lookupWord('${word.replace(/'/g,"\\'")}')">${escapeHtml(word)}</span>${escapeHtml(m[2])}`;
    }
    return escapeHtml(tok);
  }).join('');
}
/* deckId/sentenceOverride ficam de fora quando chamado durante uma sessão de estudo
   (usa o baralho e a frase da sessão atual); o leitor de EPUB passa os dois explicitamente,
   já que ali não existe uma sessão de estudo ativa. */
function lookupWord(word, deckId, sentenceOverride){
  const targetDeckId = deckId || (state.session && state.session.deckId);
  const sentence = sentenceOverride != null ? sentenceOverride : ((state.session && state.session.content && state.session.content.sentence) || '');
  const cleanWord = (word||'').trim();
  if(!cleanWord) return;
  state.modal = { type:'word-lookup', word: cleanWord, sentence, deckId: targetDeckId, status:'loading', translations:[], note:'' };
  render();
  translateWordInContext(cleanWord, sentence).then(result => {
    if(state.modal && state.modal.type === 'word-lookup' && state.modal.word === cleanWord){
      state.modal.status = 'done';
      state.modal.translations = result.translations;
      state.modal.note = result.note;
      render();
    }
  }).catch(err => {
    console.error('Falha ao traduzir palavra', err);
    if(state.modal && state.modal.type === 'word-lookup' && state.modal.word === cleanWord){
      state.modal.status = 'error';
      state.modal.error = friendlyAiErrorMsg(err);
      render();
    }
  });
}

async function submitLanguageAnswer(){
  const s = state.session; const card = getCurrentCard(); const exType = getCurrentExType();
  if(!s.userInput.trim()) return;
  if(exType === 'translate'){
    // verificação 100% local, sem chamada de IA
    const correct = checkLocalTranslation(s.userInput.trim(), card.back);
    const acceptedList = String(card.back||'').split('/').map(s=>s.trim()).filter(Boolean);
    const typedNorm = normalizeAnswer(s.userInput.trim());
    const otherOptions = acceptedList.filter(a => normalizeAnswer(a) !== typedNorm);
    const explanation = correct
      ? (otherOptions.length ? `Outras traduções também aceitas: ${otherOptions.join(', ')}` : '')
      : `Tradução esperada: ${acceptedList.join(', ')}`;
    s.verifyResult = { correct, explanation };
    scheduleCard(card, correct);
    if(correct){ s.correct++; } else { requeueOnWrong(); }
    awardPoints(card, correct, 'translate');
    s.lastFeedback = correct;
    s.revealed = true;
    saveData();
    render();
    return;
  }
  if(exType === 'reverseTranslate'){
    // verificação 100% local, sem chamada de IA — compara com o termo original (front), ignorando texto entre parênteses
    const cleanFront = stripParens(card.front);
    const correct = normalizeAnswer(s.userInput.trim()) === normalizeAnswer(cleanFront);
    s.verifyResult = { correct, explanation: correct ? '' : `Termo esperado: ${cleanFront}` };
    scheduleCard(card, correct);
    if(correct){ s.correct++; } else { requeueOnWrong(); }
    awardPoints(card, correct, 'reverseTranslate');
    s.lastFeedback = correct;
    s.revealed = true;
    saveData();
    render();
    return;
  }
  if(exType === 'translateOther'){
    // verificação 100% local — precisa bater com alguma tradução aceita QUE NÃO seja a excluída
    const typedNorm = normalizeAnswer(s.userInput.trim());
    const excludedNorm = normalizeAnswer(s.content.excluded);
    const correct = typedNorm !== excludedNorm && s.content.validOptions.some(o => normalizeAnswer(o) === typedNorm);
    const explanation = correct ? '' : `Não vale "${s.content.excluded}" — outra(s) tradução(ões) aceita(s): ${s.content.validOptions.join(', ')}`;
    s.verifyResult = { correct, explanation };
    scheduleCard(card, correct);
    if(correct){ s.correct++; } else { requeueOnWrong(); }
    awardPoints(card, correct, 'translateOther');
    s.lastFeedback = correct;
    s.revealed = true;
    saveData();
    render();
    return;
  }
  if(exType === 'copy-translation'){
    // só copiar certinho pra fixar — não afeta a repetição espaçada, igual o copy-memorize do baralho padrão
    const correct = normalizeAnswer(s.userInput.trim()) === normalizeAnswer(s.content.targetTranslation);
    s.verifyResult = { correct, explanation: correct ? '' : `Devia ser: ${s.content.targetTranslation}` };
    s.lastFeedback = correct;
    s.revealed = true;
    render();
    return;
  }
  s.verifying = true; render();
  try{
    let result;
    if(exType === 'write') result = await verifyTranslation(card.front, s.content.sentence, s.userInput.trim());
    s.verifyResult = result;
    scheduleCard(card, result.correct);
    if(result.correct){ s.correct++; } else { requeueOnWrong(); }
    awardPoints(card, result.correct, 'write');
    s.lastFeedback = result.correct;
  }catch(e){
    console.error(e);
    s.verifyResult = { correct:false, explanation: friendlyAiErrorMsg(e) };
  }
  s.verifying = false; s.revealed = true;
  saveData();
  render();
}
function answerLangMC(optionIndex){
  const s = state.session; const card = getCurrentCard();
  if(s.revealed) return;
  const correctIdx = s.content.correctIndexes || [];
  s.checkedIndexes = s.checkedIndexes || [];
  if(s.checkedIndexes.includes(optionIndex)) return;
  const isCorrectPick = correctIdx.includes(optionIndex);
  if(!isCorrectPick){
    // marcou uma errada: encerra a questão como errada, mesmo se já tinha achado uma certa antes
    s.chosenIndex = optionIndex; s.revealed = true; s.lastFeedback = false; s.partialCorrect = false;
    scheduleCard(card, false);
    requeueOnWrong();
    awardPoints(card, false, 'langMC');
    saveData();
    render();
    return;
  }
  s.checkedIndexes.push(optionIndex);
  if(s.checkedIndexes.length < correctIdx.length){
    // achou uma certa, mas ainda tem outra(s) — não revela nem avança ainda
    s.partialCorrect = true;
    render();
    return;
  }
  // achou todas as opções certas
  s.revealed = true; s.lastFeedback = true; s.partialCorrect = false;
  scheduleCard(card, true);
  s.correct++;
  awardPoints(card, true, 'langMC');
  saveData();
  render();
}
