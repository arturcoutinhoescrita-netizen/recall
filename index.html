/* ============ LEITOR DE EPUB (dentro de Leituras) ============ */
// dados "vivos" (zip aberto, caminhos dos capítulos) ficam FORA de state — não são
// serializáveis e não fazem sentido sincronizar; só os metadados leves (book.epub)
// e as citações/cartões criados a partir da leitura sincronizam normalmente.
let epubRuntime = {}; // bookId -> { zip, chapterPaths, paragraphsCache: {index: [parágrafos]} }

async function parseEpubFile(blob){
  const zip = await JSZip.loadAsync(blob);
  const containerFile = zip.file('META-INF/container.xml');
  if(!containerFile) throw new Error('epub_invalido');
  const containerXml = await containerFile.async('text');
  const containerDoc = new DOMParser().parseFromString(containerXml, 'application/xml');
  const opfPath = containerDoc.querySelector('rootfile').getAttribute('full-path');
  const opfFile = zip.file(opfPath);
  if(!opfFile) throw new Error('epub_invalido');
  const opfXml = await opfFile.async('text');
  const opfDoc = new DOMParser().parseFromString(opfXml, 'application/xml');
  const opfDir = opfPath.includes('/') ? opfPath.slice(0, opfPath.lastIndexOf('/')+1) : '';

  const titleEl = opfDoc.getElementsByTagNameNS('http://purl.org/dc/elements/1.1/', 'title')[0];
  const authorEl = opfDoc.getElementsByTagNameNS('http://purl.org/dc/elements/1.1/', 'creator')[0];
  const title = (titleEl && titleEl.textContent.trim()) || 'Sem título';
  const author = (authorEl && authorEl.textContent.trim()) || '';

  const manifestItems = {};
  const manifestItemEls = Array.from(opfDoc.querySelectorAll('manifest > item'));
  manifestItemEls.forEach(item => {
    manifestItems[item.getAttribute('id')] = item.getAttribute('href');
  });
  const spineIds = Array.from(opfDoc.querySelectorAll('spine > itemref')).map(ir => ir.getAttribute('idref'));
  const chapterPaths = spineIds.map(id => manifestItems[id]).filter(Boolean).map(href => opfDir + href);
  if(chapterPaths.length === 0) throw new Error('epub_sem_capitulos');

  // capa: tenta o padrão EPUB3 (properties="cover-image") e cai pro EPUB2
  // (<meta name="cover" content="ID"/> apontando pro item no manifesto).
  let coverHref = null;
  const coverItemEl = manifestItemEls.find(item => (item.getAttribute('properties')||'').split(/\s+/).includes('cover-image'));
  if(coverItemEl) coverHref = coverItemEl.getAttribute('href');
  if(!coverHref){
    const metaCover = opfDoc.querySelector('metadata > meta[name="cover"]');
    if(metaCover) coverHref = manifestItems[metaCover.getAttribute('content')];
  }
  let coverUrl = '';
  if(coverHref){
    const coverFile = zip.file(opfDir + coverHref);
    if(coverFile){
      const base64 = await coverFile.async('base64');
      const ext = coverHref.split('.').pop().toLowerCase();
      const mime = ext==='png' ? 'image/png' : ext==='svg' ? 'image/svg+xml' : ext==='gif' ? 'image/gif' : 'image/jpeg';
      coverUrl = `data:${mime};base64,${base64}`;
    }
  }

  const { toc, chapterTitles } = await parseEpubToc(zip, opfDoc, opfDir, manifestItemEls, manifestItems, chapterPaths);

  return { zip, title, author, chapterPaths, coverUrl, toc, chapterTitles };
}
// resolve um href relativo (do nav/ncx) contra o diretório de onde ele veio —
// usa a API de URL só pra lidar com "../" direito. Mantém a âncora (#p45) à
// parte: em muitos epubs (principalmente convertidos pelo Calibre) vários
// capítulos de verdade ficam num único arquivo grande, diferenciados só pela
// âncora — sem isso o sumário não consegue apontar pro lugar certo.
function resolveEpubHrefParts(baseDir, href){
  if(!href) return { path:'', fragment:'' };
  const [pathPart, fragment] = href.split('#');
  if(!pathPart) return { path:'', fragment: fragment||'' };
  try{
    const resolved = new URL(pathPart, 'file:///' + baseDir).pathname.replace(/^\//, '');
    return { path: decodeURIComponent(resolved), fragment: fragment||'' };
  }catch(e){ return { path: baseDir + pathPart, fragment: fragment||'' }; }
}
// lê o sumário do epub: tenta o nav document do EPUB3 (properties="nav") e,
// se não achar, cai pro NCX do EPUB2 (navMap/navPoint). Cada entrada é casada
// com o índice do capítulo correspondente no spine pelo caminho do arquivo.
async function parseEpubToc(zip, opfDoc, opfDir, manifestItemEls, manifestItems, chapterPaths){
  const entries = [];
  const navItem = manifestItemEls.find(item => (item.getAttribute('properties')||'').split(/\s+/).includes('nav'));
  if(navItem){
    try{
      const navPath = opfDir + navItem.getAttribute('href');
      const navFile = zip.file(navPath);
      if(navFile){
        const navXml = await navFile.async('text');
        let navDoc = new DOMParser().parseFromString(navXml, 'application/xhtml+xml');
        if(navDoc.querySelector('parsererror')) navDoc = new DOMParser().parseFromString(navXml, 'text/html');
        const navDir = navPath.includes('/') ? navPath.slice(0, navPath.lastIndexOf('/')+1) : '';
        const navEls = Array.from(navDoc.querySelectorAll('nav'));
        const tocNav = navEls.find(n => (n.getAttribute('epub:type')||'').includes('toc')) || navEls[0];
        if(tocNav){
          Array.from(tocNav.querySelectorAll('a[href]')).forEach(a => {
            const title = a.textContent.replace(/\s+/g,' ').trim();
            const href = a.getAttribute('href');
            if(title && href) entries.push({ title, ...resolveEpubHrefParts(navDir, href) });
          });
        }
      }
    }catch(e){ console.warn('Falha ao ler nav (sumário) do epub', e); }
  }
  if(entries.length === 0){
    const spineEl = opfDoc.querySelector('spine');
    const tocId = spineEl && spineEl.getAttribute('toc');
    const ncxHref = tocId ? manifestItems[tocId] : Object.values(manifestItems).find(h => h && h.toLowerCase().endsWith('.ncx'));
    if(ncxHref){
      try{
        const ncxPath = opfDir + ncxHref;
        const ncxFile = zip.file(ncxPath);
        if(ncxFile){
          const ncxXml = await ncxFile.async('text');
          const ncxDoc = new DOMParser().parseFromString(ncxXml, 'application/xml');
          const ncxDir = ncxPath.includes('/') ? ncxPath.slice(0, ncxPath.lastIndexOf('/')+1) : '';
          Array.from(ncxDoc.querySelectorAll('navPoint')).forEach(np => {
            const labelEl = np.querySelector('navLabel > text');
            const contentEl = np.querySelector('content');
            const title = labelEl ? labelEl.textContent.replace(/\s+/g,' ').trim() : '';
            const src = contentEl ? contentEl.getAttribute('src') : '';
            if(title && src) entries.push({ title, ...resolveEpubHrefParts(ncxDir, src) });
          });
        }
      }catch(e){ console.warn('Falha ao ler ncx (sumário) do epub', e); }
    }
  }
  const toc = [];
  const chapterTitles = new Array(chapterPaths.length).fill(null);
  entries.forEach(entry => {
    const idx = chapterPaths.findIndex(p => p === entry.path);
    if(idx === -1) return;
    toc.push({ title: entry.title, chapterIndex: idx, fragment: entry.fragment || null });
    if(!chapterTitles[idx]) chapterTitles[idx] = entry.title;
  });
  return { toc, chapterTitles };
}
// estimativa grosseira de páginas impressas a partir da contagem de palavras
// (só roda no upload, não toda vez que o livro é reaberto).
async function estimateEpubPageCount(zip, chapterPaths){
  const WORDS_PER_PAGE = 260;
  let totalWords = 0;
  for(const path of chapterPaths){
    const file = zip.file(path);
    if(!file) continue;
    try{
      const xhtml = await file.async('text');
      let doc = new DOMParser().parseFromString(xhtml, 'application/xhtml+xml');
      if(doc.querySelector('parsererror')) doc = new DOMParser().parseFromString(xhtml, 'text/html');
      const text = (doc.body || doc.documentElement).textContent || '';
      totalWords += (text.match(/\S+/g) || []).length;
    }catch(e){ /* ignora capítulo problemático na estimativa */ }
  }
  return Math.max(1, Math.round(totalWords / WORDS_PER_PAGE));
}
async function loadEpubChapterParagraphs(bookId, index){
  const runtime = epubRuntime[bookId];
  if(!runtime) throw new Error('epub_nao_carregado');
  if(runtime.paragraphsCache[index]) return runtime.paragraphsCache[index];
  const path = runtime.chapterPaths[index];
  const file = runtime.zip.file(path);
  if(!file) throw new Error('capitulo_nao_encontrado');
  const xhtml = await file.async('text');
  let doc = new DOMParser().parseFromString(xhtml, 'application/xhtml+xml');
  if(doc.querySelector('parsererror')) doc = new DOMParser().parseFromString(xhtml, 'text/html'); // fallback pra epubs com xhtml malformado
  const kept = [];
  Array.from(doc.querySelectorAll('p, h1, h2, h3, h4, li, blockquote')).forEach(el => {
    const text = el.textContent.replace(/\s+/g,' ').trim();
    if(text) kept.push({ el, text });
  });
  const paragraphs = kept.map(k => k.text);
  // mapa âncora->parágrafo: em muitos epubs vários capítulos de verdade ficam
  // no mesmo arquivo, diferenciados só por id="pN" — sem isso o sumário e os
  // marcadores não têm como apontar pro parágrafo certo dentro do arquivo.
  const anchorMap = {};
  Array.from(doc.querySelectorAll('[id]')).forEach(idEl => {
    const id = idEl.getAttribute('id');
    if(!id || anchorMap[id] !== undefined) return;
    let found = kept.length ? kept.length - 1 : 0;
    for(let i=0;i<kept.length;i++){
      const node = kept[i].el;
      if(node === idEl){ found = i; break; }
      const rel = idEl.compareDocumentPosition(node);
      if(rel & (Node.DOCUMENT_POSITION_FOLLOWING | Node.DOCUMENT_POSITION_CONTAINED_BY)){ found = i; break; }
    }
    anchorMap[id] = found;
  });
  runtime.paragraphsCache[index] = paragraphs;
  runtime.anchorMaps = runtime.anchorMaps || {};
  runtime.anchorMaps[index] = anchorMap;
  return paragraphs;
}
// divide os parágrafos de um capítulo em "páginas" de tamanho parecido (por
// contagem de palavras) — é o que abandona a rolagem infinita: cada página
// vira um bloco curto, e o Anterior/Próximo passa por elas uma de cada vez.
// Nunca quebra um parágrafo ao meio, então uma página pode ficar um pouco
// maior que o alvo se um único parágrafo já for longo.
const EPUB_WORDS_PER_PAGE = 220;
// "hardBreaks" força o início de página exatamente onde um capítulo de
// verdade começa (âncora do sumário) — sem isso, um pulo pelo sumário podia
// cair numa página que começava com o FINAL do capítulo anterior, e só lá
// embaixo é que aparecia o capítulo que a pessoa realmente escolheu.
function chunkParagraphsIntoPages(paragraphs, hardBreaks){
  hardBreaks = hardBreaks || new Set();
  if(paragraphs.length === 0) return [{ start:0, end:0 }];
  const pages = [];
  let start = 0, count = 0;
  for(let i=0;i<paragraphs.length;i++){
    const words = (paragraphs[i].match(/\S+/g)||[]).length;
    const forceBreak = i > start && hardBreaks.has(i);
    if(forceBreak || (count > 0 && count + words > EPUB_WORDS_PER_PAGE)){
      pages.push({ start, end:i });
      start = i; count = 0;
    }
    count += words;
  }
  pages.push({ start, end:paragraphs.length });
  return pages;
}
// só calcula (e guarda em cache) depois que os parágrafos do capítulo já
// foram carregados — devolve null se ainda não deu tempo.
function getEpubPages(bookId, chapterIndex){
  const runtime = epubRuntime[bookId];
  const paragraphs = runtime && runtime.paragraphsCache[chapterIndex];
  if(!paragraphs) return null;
  runtime.pagesCache = runtime.pagesCache || {};
  if(!runtime.pagesCache[chapterIndex]){
    const book = state.books.find(b=>b.id===bookId);
    const hardBreaks = new Set();
    if(book && book.epub && book.epub.toc){
      book.epub.toc.forEach(entry => {
        if(entry.chapterIndex === chapterIndex && entry.fragment){
          const pIdx = resolveEpubAnchorParagraphIndex(bookId, chapterIndex, entry.fragment);
          if(pIdx > 0) hardBreaks.add(pIdx);
        }
      });
    }
    runtime.pagesCache[chapterIndex] = chunkParagraphsIntoPages(paragraphs, hardBreaks);
  }
  return runtime.pagesCache[chapterIndex];
}
// pra qual parágrafo (já no espaço de índices filtrado, igual paragraphsCache)
// uma âncora "#pN" do sumário aponta — 0 se a âncora não existir ou o
// capítulo ainda não tiver sido carregado (fica pro início dele).
function resolveEpubAnchorParagraphIndex(bookId, chapterIndex, fragment){
  const runtime = epubRuntime[bookId];
  const map = runtime && runtime.anchorMaps && runtime.anchorMaps[chapterIndex];
  if(!fragment || !map || map[fragment] === undefined) return 0;
  return map[fragment];
}
// acha, entre as entradas do sumário que caem dentro do capítulo atual, qual
// delas é a mais próxima (por trás ou igual) do início da página que está
// sendo mostrada — é o que permite um único arquivo grande (comum em epubs
// convertidos pelo Calibre, com vários capítulos de verdade separados só por
// âncora) mudar o título exibido conforme o leitor avança pelas páginas.
function getActiveEpubTocEntry(bookId, book, chapterIndex, pageStartParagraphIdx){
  const entries = (book.epub.toc||[]).filter(e => e.chapterIndex === chapterIndex);
  if(entries.length === 0) return null;
  let best = null, bestPos = -1;
  entries.forEach(e => {
    const pIdx = e.fragment ? resolveEpubAnchorParagraphIndex(bookId, chapterIndex, e.fragment) : 0;
    if(pIdx <= pageStartParagraphIdx && pIdx >= bestPos){ bestPos = pIdx; best = e; }
  });
  return best;
}
function getEpubReadPercent(book){
  if(!book || !book.epub || !book.epub.chapterCount) return 0;
  const idx = book.epub.currentChapterIndex || 0;
  const pageIdx = book.epub.currentPageIndex || 0;
  const pagesInChapter = book.epub.pagesInCurrentChapter || 1;
  const frac = pagesInChapter > 0 ? Math.min(1, pageIdx / pagesInChapter) : 0;
  return Math.max(0, Math.min(100, Math.round(((idx + frac) / book.epub.chapterCount) * 100)));
}

async function ensureEpubLoaded(bookId){
  if(epubRuntime[bookId]) return;
  const book = state.books.find(b=>b.id===bookId);
  if(!book || !book.epub) return;
  book.epubStatus = 'downloading';
  render();
  try{
    const blob = await downloadEpubForBook(bookId);
    const parsed = await parseEpubFile(blob);
    epubRuntime[bookId] = { zip: parsed.zip, chapterPaths: parsed.chapterPaths, paragraphsCache: {} };
  }catch(err){
    console.error('Falha ao baixar/abrir epub salvo', err);
    showToast(epubErrorMessage(err), 'error');
  }
  delete book.epubStatus;
  render();
}
function epubErrorMessage(err){
  if(err && err.message === 'not_logged_in') return 'Faça login pra guardar ou abrir livros.';
  if(err && err.message === 'upload_timeout') return 'O envio demorou demais e foi cancelado. Tente de novo.';
  if(err && err.message === 'download_timeout') return 'Demorou demais pra abrir o livro salvo. Tente de novo.';
  if(err && err.message === 'epub_upload_error') return 'Não consegui salvar esse arquivo agora. Tente de novo.';
  return 'Não consegui abrir esse arquivo. Confira se é um .epub válido, sem proteção DRM.';
}
// pula pro início de um capítulo (página 0) — usado pelo sumário, marcadores e
// pelos próprios Anterior/Próximo quando cruzam a fronteira de um capítulo.
function goToEpubChapter(bookId, index){
  const book = state.books.find(b=>b.id===bookId);
  if(!book || !book.epub) return;
  const clamped = Math.max(0, Math.min(book.epub.chapterCount-1, index));
  book.epub.currentChapterIndex = clamped;
  book.epub.currentPageIndex = 0;
  saveData(); render();
  scrollEpubMainToTop();
}
function jumpToEpubTocEntry(bookId, chapterIndex, fragment){
  closeModal();
  const book = state.books.find(b=>b.id===bookId);
  if(!book || !book.epub) return;
  const clamped = Math.max(0, Math.min(book.epub.chapterCount-1, chapterIndex));
  book.epub.currentChapterIndex = clamped;
  if(fragment){
    // a âncora só pode ser resolvida depois que os parágrafos desse capítulo
    // estiverem carregados — renderEpubReaderView termina o trabalho quando chegar lá.
    state._epubPendingPageJump = { fragment };
    render();
  } else {
    book.epub.currentPageIndex = 0;
    saveData(); render();
    scrollEpubMainToTop();
  }
}
function scrollEpubMainToTop(){
  requestAnimationFrame(() => { const m = document.querySelector('.main'); if(m) m.scrollTop = 0; });
}
// avança/volta uma "página" (bloco de parágrafos) por vez, sem rolagem contínua.
// Quando chega no fim/início do capítulo carregado, pula pro capítulo vizinho —
// se esse capítulo ainda não foi carregado, marca uma "página pendente" que o
// renderEpubReaderView resolve assim que os parágrafos chegarem.
function nextEpubPage(bookId){
  const book = state.books.find(b=>b.id===bookId);
  if(!book || !book.epub) return;
  const idx = book.epub.currentChapterIndex;
  const pages = getEpubPages(bookId, idx);
  const pageIdx = book.epub.currentPageIndex || 0;
  if(pages && pageIdx < pages.length-1){
    book.epub.currentPageIndex = pageIdx + 1;
    book.epub.pagesInCurrentChapter = pages.length;
    saveData(); render();
    scrollEpubMainToTop();
    return;
  }
  if(idx < book.epub.chapterCount-1){
    book.epub.currentChapterIndex = idx + 1;
    book.epub.currentPageIndex = 0;
    saveData(); render();
    scrollEpubMainToTop();
  }
}
function prevEpubPage(bookId){
  const book = state.books.find(b=>b.id===bookId);
  if(!book || !book.epub) return;
  const idx = book.epub.currentChapterIndex;
  const pageIdx = book.epub.currentPageIndex || 0;
  if(pageIdx > 0){
    book.epub.currentPageIndex = pageIdx - 1;
    saveData(); render();
    scrollEpubMainToTop();
    return;
  }
  if(idx > 0){
    book.epub.currentChapterIndex = idx - 1;
    state._epubPendingPageJump = 'last'; // resolvido no render() quando o capítulo anterior carregar
    render();
  }
}
function addEpubBookmark(bookId){
  const book = state.books.find(b=>b.id===bookId);
  if(!book || !book.epub) return;
  const idx = book.epub.currentChapterIndex;
  const pageIdx = book.epub.currentPageIndex || 0;
  const paragraphs = epubRuntime[bookId] && epubRuntime[bookId].paragraphsCache[idx];
  const pages = getEpubPages(bookId, idx);
  const pageStart = paragraphs && pages && pages[pageIdx] ? paragraphs[pages[pageIdx].start] : null;
  const excerpt = pageStart ? pageStart.slice(0, 80) : '';
  const label = (book.epub.chapterTitles && book.epub.chapterTitles[idx]) || `Capítulo ${idx+1}`;
  book.epub.bookmarks = book.epub.bookmarks || [];
  book.epub.bookmarks.push({
    id: uid(), chapterIndex: idx, pageIndex: pageIdx,
    label, excerpt, createdAt: Date.now()
  });
  saveData(); render();
  showToast('Marcador adicionado.');
}
function removeEpubBookmark(bookId, bookmarkId){

/* transforma o texto de um parágrafo em HTML com cada palavra clicável, agrupada
   por frase (guardada num atributo data-sentence) pra dar contexto à tradução —
   usado só em livros marcados como "em inglês". */
function renderEpubParagraphClickable(text, targetDeckId){
  const sentences = text.split(/(?<=[.!?])\s+/).filter(Boolean);
  return sentences.map(sentence => {
    const wordsHtml = sentence.split(/(\s+)/).map(tok => {
      const m = tok.match(/^([A-Za-zÀ-ÿ']+)(.*)$/);
      if(m && m[1]){
        return `<span class="clickable-word" onclick="lookupWord('${m[1].replace(/'/g,"\\'")}', '${targetDeckId}', this.closest('[data-sentence]').getAttribute('data-sentence'))">${escapeHtml(m[1])}</span>${escapeHtml(m[2])}`;
      }
      return escapeHtml(tok);
    }).join('');
    return `<span data-sentence="${escapeHtml(sentence)}">${wordsHtml}</span>`;
  }).join(' ');
}
/* --- livros que NÃO são em inglês: seleciona um trecho pra guardar como
   citação ou pedir um cartão de flashcard gerado pela IA. A barra só existe

document.addEventListener('mouseup', handleReaderSelection);
document.addEventListener('touchend', handleReaderSelection);

}

async function generateCardFromPassage(passageText){
  const prompt = `Trecho de um livro:\n"${passageText}"\n\nCrie 1 flashcard de pergunta e resposta em português sobre o conteúdo principal desse trecho, com pergunta objetiva e resposta curta e direta. Escreva também uma nota breve (1-2 frases) com uma explicação um pouco mais elaborada.\n\nResponda SOMENTE com um JSON válido, exatamente neste formato:\n{"front":"pergunta","back":"resposta objetiva","note":"breve explicação"}`;
  const text = (await callGemini(prompt, { maxTokens: 300 })).trim();
  const clean = text.replace(/```json|```/g,"").trim();
  const obj = JSON.parse(clean);
  return {
    front: String((obj && obj.front) || '').trim(),
    back: String((obj && obj.back) || '').trim(),
    note: String((obj && obj.note) || '').trim()
  };
}
function requestCardFromReaderSelection(){
  const text = state.readerSelection;
  const book = state.books.find(b=>b.id===state.currentBookId);
  if(!text || !book) return;

  if(bar) bar.style.display = 'none';
  state.modal = { type:'passage-card', status:'loading', passage:text, card:{front:'',back:'',note:''}, deckId: book.linkedDeckId || '' };
  render();

    if(state.modal && state.modal.type === 'passage-card'){
      state.modal.status = 'review';
      state.modal.card = card;
      render();
    }
  }).catch(err => {

      state.modal.error = friendlyAiErrorMsg(err);
      render();

  });
}
function confirmPassageCard(){

}

function renderEpubReaderView(){
  const book = state.books.find(b=>b.id===state.currentBookId);
  if(!book) return '';
  if(!book.epub){
    // não deveria acontecer (só se navegar aqui sem epub), volta pro detalhe do livro
    state.view = 'book';
    return '';
  }
  const gearBtn = `<button class="icon-btn" title="Editar propriedades do livro" onclick="state.view='book'; render();">⚙️</button>`;
  if(book.epubStatus === 'downloading' || !epubRuntime[book.id]){
    if(!epubRuntime[book.id] && book.epubStatus !== 'downloading') ensureEpubLoaded(book.id);
    return `
    <button class="ghost-btn mobile-back-btn" onclick="closeEpubReader()">← Leituras</button>
    <div class="loading-line" style="justify-content:center; padding:60px;"><div class="spinner"></div> Abrindo o livro...</div>`;
  }
  const idx = book.epub.currentChapterIndex;
  const runtime = epubRuntime[book.id];
  if(!runtime.paragraphsCache[idx]){
    loadEpubChapterParagraphs(book.id, idx).then(() => render()).catch(err => {
      console.error('Falha ao carregar capítulo', err);
      showToast('Não consegui carregar esse capítulo.', 'error');
    });
    return `
    <button class="ghost-btn mobile-back-btn" onclick="closeEpubReader()">← Leituras</button>
    <div class="loading-line" style="justify-content:center; padding:60px;"><div class="spinner"></div> Carregando capítulo...</div>`;
  }
  const paragraphs = runtime.paragraphsCache[idx];
  const pages = getEpubPages(book.id, idx);
  // "Anterior" cruzando pra um capítulo ainda não carregado, ou um pulo vindo
  // do sumário/marcador com âncora: só dá pra resolver depois que os
  // parágrafos (e o mapa de âncoras) desse capítulo chegarem — é aqui.
  if(state._epubPendingPageJump){
    const pending = state._epubPendingPageJump;
    state._epubPendingPageJump = null;
    if(pending === 'last'){
      book.epub.currentPageIndex = pages.length - 1;
    } else if(pending.fragment){
      const anchorParagraphIdx = resolveEpubAnchorParagraphIndex(book.id, idx, pending.fragment);
      const targetPage = pages.findIndex(p => anchorParagraphIdx >= p.start && anchorParagraphIdx < p.end);
      book.epub.currentPageIndex = targetPage === -1 ? 0 : targetPage;
    }
    book.epub.pagesInCurrentChapter = pages.length;
    saveData();
    scrollEpubMainToTop();
  }
  book.epub.pagesInCurrentChapter = pages.length;
  const pageIdx = Math.min(book.epub.currentPageIndex || 0, pages.length - 1);
  const page = pages[pageIdx];
  const pageParagraphs = paragraphs.slice(page.start, page.end);
  const atFirstPage = idx === 0 && pageIdx === 0;
  const atLastPage = idx >= book.epub.chapterCount-1 && pageIdx >= pages.length-1;
  // o título mostrado em fonte grande reflete o capítulo de VERDADE mais recente
  // até esse ponto — muitos epubs (principalmente convertidos pelo Calibre)
  // empacotam vários capítulos reais dentro do mesmo arquivo, diferenciados só
  // por âncora, então um único título fixo por arquivo mostraria errado.
  const activeToc = getActiveEpubTocEntry(book.id, book, idx, page.start);
  const chapterTitle = (activeToc && activeToc.title) || (book.epub.chapterTitles && book.epub.chapterTitles[idx]) || `Capítulo ${idx+1}`;
  const prevPage = pageIdx > 0 ? pages[pageIdx-1] : null;
  const prevActiveToc = prevPage ? getActiveEpubTocEntry(book.id, book, idx, prevPage.start) : null;
  const prevChapterTitle = prevPage ? ((prevActiveToc && prevActiveToc.title) || (book.epub.chapterTitles && book.epub.chapterTitles[idx]) || `Capítulo ${idx+1}`) : null;
  const showChapterHeading = pageIdx === 0 || chapterTitle !== prevChapterTitle;
  const totalPages = book.totalPages || 0;
  const currentPage = totalPages ? Math.max(1, Math.round((getEpubReadPercent(book)/100) * totalPages)) : 0;
  return `
  <div style="position:sticky; top:0; z-index:20; background:var(--bg); padding:calc(10px + env(safe-area-inset-top, 0px)) 0 8px 0; border-bottom:1px solid var(--border);">

        <button class="icon-btn" title="Marcadores" onclick="state.modal={type:'epub-nav', bookId:'${book.id}'}; render();">🔖</button>
        ${gearBtn}
      </div>
    </div>
    <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
      <button class="ghost-btn" ${atFirstPage?'disabled':''} onclick="prevEpubPage('${book.id}')">← Anterior</button>
      <span style="font-size:12px; color:var(--text-muted); text-align:center;">Cap. ${idx+1}/${book.epub.chapterCount} · pág. ${pageIdx+1}/${pages.length}${currentPage ? ` · ~${currentPage} de ${totalPages}` : ''}</span>
      <button class="ghost-btn" ${atLastPage?'disabled':''} onclick="nextEpubPage('${book.id}')">Próximo →</button>
    </div>
  </div>
  <div style="margin:14px 0; text-align:center;">
    <h3 style="margin:0;">${escapeHtml(book.epub.title)}</h3>
    ${book.epub.author ? `<p style="color:var(--text-muted); font-size:12.5px; margin:2px 0 0 0;">${escapeHtml(book.epub.author)}</p>` : ''}
  </div>
  <p style="font-size:11px; color:var(--text-faint); text-align:center; margin:0 0 14px 0;">${book.isEnglish ? '💡 Toque numa palavra pra ver a tradução' : '💡 Selecione um trecho pra guardar como citação ou pedir um cartão'}</p>
  <div class="epub-page" style="max-width:640px; margin:0 auto; line-height:1.9; font-size:15.5px;">
    ${showChapterHeading ? `<h2 style="text-align:center; font-size:23px; margin:6px 0 26px 0;">${escapeHtml(chapterTitle)}</h2>` : ''}
    ${pageParagraphs.length===0 ? `<p style="color:var(--text-faint);">(Capítulo sem texto legível)</p>` : pageParagraphs.map(p => `<p>${book.isEnglish ? renderEpubParagraphClickable(p, book.linkedDeckId||'') : escapeHtml(p)}</p>`).join('')}
  </div>
  ${!book.isEnglish ? `
  <div id="reader-selection-bar" style="display:none; position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-top:1px solid var(--border); padding:12px 20px; align-items:center; justify-content:center; gap:10px; box-shadow:0 -4px 16px rgba(0,0,0,0.2); z-index:50;">

    <button class="primary-btn" onclick="requestCardFromReaderSelection()">🤖 Pedir cartão à IA</button>

  ` : ''}

}

function renderPointsBadge(s){
  if(!s.revealed || !s.lastFeedback || !s.lastEarned) return '';

}
function fmtTime(ms){
  const s = Math.floor(ms/1000);
  const m = Math.floor(s/60);
  const sec = s%60;
  return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}
function fmtDue(due){
  if(!due) return 'novo';
  const diff = due - Date.now();
  if(diff <= 0) return 'hoje';
  const days = Math.round(diff/(24*60*60*1000));
  if(days <= 0) return 'hoje';
  if(days === 1) return 'amanhã';
  return `em ${days}d`;
}

let __lastRenderKey = null;
function render(){
  // guarda foco e posição do cursor ANTES de recriar a tela, pra restaurar depois —
  // evita que re-renders disparados por outra coisa (ex: o toast sumindo sozinho)
  // joguem o cursor de volta pro início enquanto o usuário está digitando.
  const active = document.activeElement;
  let savedId = null, savedStart = null, savedEnd = null;
  if(active && (active.tagName === 'TEXTAREA' || active.tagName === 'INPUT') && active.id){
    savedId = active.id;
    try{ savedStart = active.selectionStart; savedEnd = active.selectionEnd; }catch(e){}
  }
  // idem pra rolagem: render() recria .main do zero a cada chamada, então sem isso
  // qualquer clique (marcar status, adicionar tag, favoritar...) jogava a tela de
  // volta pro topo. Só restaura se a "tela" continua sendo a mesma (mesma view,
  // mesmo livro/baralho/aba) — trocar de tela deve mesmo começar do topo.
  const prevMain = document.querySelector('.main');
  const prevScrollTop = prevMain ? prevMain.scrollTop : 0;
  const renderKey = `${state.view}|${state.currentBookId||''}|${state.currentDeckId||''}|${state.tab||''}`;
  const restoreScroll = renderKey === __lastRenderKey;
  __lastRenderKey = renderKey;

  const app = document.getElementById('app');
  if(!hasClaudeStorage() && !state.firebaseUser){
    app.innerHTML = renderAuthGate();
    return;
  }
  // no mobile, alterna entre a "etapa" da lista de baralhos e a do baralho aberto;
  // no desktop essa classe não tem efeito nenhum (barra lateral fica sempre visível).
  app.className = state.view === 'home' ? 'step-home' : 'step-detail';
  app.innerHTML = `
    ${renderSidebar()}
    <div class="main">${renderMain()}</div>
    ${state.modal ? renderModal() : ''}
    ${state.toast ? renderToast() : ''}
  `;
  if(restoreScroll){
    const newMain = document.querySelector('.main');
    if(newMain) newMain.scrollTop = prevScrollTop;
  }

  if(savedId){
    const el = document.getElementById(savedId);
    if(el){
      el.focus();
      if(savedStart !== null){
        const len = el.value.length;
        try{ el.setSelectionRange(Math.min(savedStart, len), Math.min(savedEnd, len)); }catch(e){}
      }
      return; // já restauramos o foco certo, não precisa do fallback abaixo
    }
  }
  requestAnimationFrame(focusStudyInput);
}
function focusStudyInput(){
  if(state.view === 'deck' && state.tab === 'cards' && state._searchFocused){
    const el = document.getElementById('card-search-input');
    if(el){
      el.focus();
      const pos = el.value.length;
      try{ el.setSelectionRange(pos, pos); }catch(e){}
    }
    return;
  }
  if(state.view !== 'study' || !state.session) return;
  const s = state.session;
  if(s.revealed || s.verifying) return;
  let id = null;
  if(s.mode === 'open' && !s.usesGradedOpen) id = 'open-input';
  else if(s.mode === 'open' && s.usesGradedOpen && !s.revealed) id = 'open-graded-input';
  else if(s.mode === 'copy-memorize') id = 'copy-input';
  else if(s.mode === 'std-mixed'){
    const exType = getCurrentExType();
    if(exType === 'open' || exType === 'image-answer'){
      id = s.usesGradedOpen ? 'open-graded-input' : 'open-input';
    }
  }
  else if(s.mode === 'lang-mixed'){
    const exType = getCurrentExType();
    if(exType === 'translate') id = 'lang-input';
    else if(exType === 'reverseTranslate') id = 'lang-input';
    else if(exType === 'write' && s.content && !s.content.error && !s.loadingContent) id = 'lang-input';
    else if(exType === 'translateOther') id = 'lang-input';
    else if(exType === 'copy-translation') id = 'lang-input';
  }
  if(!id) return;
  const el = document.getElementById(id);
  if(el){ el.focus(); }
}

function getReadingStats(){
  const now = new Date();
  const curMonth = now.getMonth(), curYear = now.getFullYear();
  let month = 0, year = 0;
  state.books.forEach(b => {
    if(b.status === 'lido' && b.dateFinished){
      const d = new Date(b.dateFinished+'T00:00:00');
      if(d.getFullYear() === curYear){
        year++;
        if(d.getMonth() === curMonth) month++;
      }
    }
  });
  return { month, year };
}

function renderTranslationFields(idPrefix, existingBack){
  const parts = String(existingBack||'').split('/').map(s=>s.trim());
  const vals = [0,1,2,3].map(i => escapeHtml(parts[i] || ''));
  const labels = ['Tradução 1', 'Tradução 2 (opcional)', 'Tradução 3 (opcional)', 'Tradução 4 (opcional)'];
  return `
  <div style="display:flex; flex-direction:column; gap:6px;">
    ${[0,1,2,3].map(i => `<input type="text" id="${idPrefix}-${i}" value="${vals[i]}" placeholder="${labels[i]}" style="padding:7px 9px; font-size:13px;">`).join('')}
  </div>`;
}
function collectTranslationFields(idPrefix){
  return [0,1,2,3].map(i => {
    const el = document.getElementById(`${idPrefix}-${i}`);
    return el ? el.value.trim() : '';
  }).filter(Boolean).join('/');
}

  const priorityCount = allCards.filter(c=>c.priority).length;

    <button type="button" class="ghost-btn" style="padding:9px 14px; font-size:12.5px; ${learnedOnly ? 'border-color:var(--success); color:var(--success);' : ''}" onclick="state.cardFilterLearned=!state.cardFilterLearned; render();">✅ Só aprendidas${learnedCount ? ` (${learnedCount})` : ''}</button>

function renderStateDot(card){
  const info = CARD_STATE_INFO[getCardState(card)];
  return `<div title="${info.label}" style="width:8px; height:8px; border-radius:50%; background:${info.color}; flex-shrink:0;"></div>`;
}
function startEditCard(cardId){ state.editingCardId = cardId; render(); }
function cancelEditCard(){ state.editingCardId = null; render(); }
function saveEditCard(deckId, cardId){
  const frontInput = document.getElementById(`edit-front-${cardId}`);
  if(!frontInput) return;
  const front = frontInput.value.trim();
  const deck = state.decks.find(d=>d.id===deckId);
  const isLanguage = deck && deck.type === 'language';
  const back = isLanguage
    ? collectTranslationFields(`edit-back-${cardId}`)
    : (document.getElementById(`edit-back-${cardId}`) ? document.getElementById(`edit-back-${cardId}`).value.trim() : '');
  if(!front || (!isLanguage && !back)) { showToast('Preencha os campos antes de salvar.', 'error'); return; }
  const noteInput = document.getElementById(`edit-note-${cardId}`);
  const note = noteInput ? noteInput.value.trim() : '';
  const card = (state.cards[deckId]||[]).find(c=>c.id===cardId);
  if(!card) return;
  card.front = front;
  card.back = back;
  card.note = note;
  state.editingCardId = null;
  saveData(); render();
}
function submitNewCard(deckId){
  const front = document.getElementById('new-front').value;
  const back = document.getElementById('new-back').value;
  const note = document.getElementById('new-note').value;
  addCard(deckId, front, back, note);
}
function submitNewTerm(deckId){
  const term = document.getElementById('new-term').value;
  const translation = collectTranslationFields('new-term-translation');
  const note = document.getElementById('new-term-note').value;
  addTermCard(deckId, term, translation, note);
  const termInput = document.getElementById('new-term');
  if(termInput) termInput.value = '';
}

function renderStudyPicker(deck){
  const due = getDueCards(deck.id).length;
  const total = (state.cards[deck.id]||[]).length;
  if(total === 0){
    return `<div style="color:var(--text-faint); font-size:13.5px;">Adicione ${deck.type==='language'?'termos':'cartões'} na aba "Cartões" antes de estudar.</div>`;
  }
  const dueLine = `<p style="color:var(--text-muted); font-size:13.5px; margin-bottom:14px;">
    ${due>0 ? `${due} ${deck.type==='language'?'termo(s)':'cartão(ões)'} prontos para revisão hoje.` : `Nada vencido — você pode revisar o baralho inteiro mesmo assim.`}
  </p>`;
  if(deck.type === 'language'){
    const enabled = getEnabledExercises(deck);
    const usesAI = enabled.includes('write'); // mc agora é local, só 'write' usa IA
    const carryCount = (deck.carryOverLang || []).length;
    return `
    ${dueLine}
    <div style="margin-bottom:16px;">
      <label style="font-size:11px; letter-spacing:0.06em; color:var(--text-faint); text-transform:uppercase; font-weight:600;">Exercícios ativos nesta sessão</label>

        ${EXERCISE_TYPES.map(exType => `
          <button type="button" class="ghost-btn" style="padding:8px 14px; font-size:12.5px; ${enabled.includes(exType) ? 'border-color:var(--accent); color:var(--accent);' : 'opacity:0.55;'}" onclick="toggleExerciseType('${deck.id}','${exType}')">

        `).join('')}
      </div>
      ${enabled.length === 0 ? `<p style="font-size:11.5px; color:var(--error); margin-top:8px;">Ative pelo menos 1 tipo de exercício pra estudar.</p>` : ''}
      ${usesAI && carryCount > 0 ? `<p style="font-size:11.5px; color:var(--accent); margin-top:8px;">🔁 ${carryCount} exercício(s) pendente(s) da sessão anterior serão priorizados agora.</p>` : ''}

function renderStudyView(){

  const card = getCurrentCard();

  const elapsed = Date.now() - s.startTime;

  let body = '';
  if(s.mode === 'direct'){
    body = renderDirectMode(s, card);
  } else if(s.mode === 'mc'){
    body = renderMCMode(s, card);
  } else if(s.mode === 'open'){

    body = renderCopyMemorizeMode(s, card);

    if(stdExType === 'mc') body = renderMCMode(s, card);
    else if(stdExType === 'open') body = renderOpenMode(s, card);
    else if(stdExType === 'image-answer') body = renderImageAnswerMode(s, card);
  } else if(s.mode === 'lang-mixed'){
    const exType = getCurrentExType();
    if(exType === 'translate') body = renderTranslateExercise(s, card);
    else if(exType === 'reverseTranslate') body = renderReverseTranslateExercise(s, card);
    else if(exType === 'write') body = renderWriteExercise(s, card);
    else if(exType === 'mc') body = renderLangMCExercise(s, card);
    else if(exType === 'translateOther') body = renderTranslateOtherExercise(s, card);
    else if(exType === 'copy-translation') body = renderCopyTranslationExercise(s, card);
  }

  const exLabel = s.mode === 'lang-mixed' ? ` · ${EXERCISE_LABELS[getCurrentExType()]}` : (s.mode === 'std-mixed' ? ` · ${STD_TYPE_LABELS[getCurrentExType()]}` : '');
  const remaining = s.queue.length - s.index;
  const currentExType = (s.mode === 'lang-mixed' || s.mode === 'std-mixed') ? getCurrentExType() : null;
  const isReverse = currentExType === 'reverseTranslate';
  const hideTopQuestion = currentExType === 'mc'; // a pergunta real já aparece dentro do quadro de alternativas
  const questionText = isReverse
    ? (s.content && s.content.chosenTranslation ? s.content.chosenTranslation : '...')

  return `
  <div class="study-wrap">
    <div class="session-top">

      </div>
      <div class="session-badges" style="display:flex; align-items:center; gap:10px;">
        ${(s.streak||0) >= 2 ? `<div style="font-size:12.5px; color:var(--accent); font-weight:600; white-space:nowrap;">🔥 ${s.streak}</div>` : ''}
        <div style="font-size:12.5px; color:var(--success); font-weight:600; white-space:nowrap;">🏆 ${s.points||0} pts</div>
        <div class="timer mono">${fmtTime(elapsed)}</div>
      </div>
    </div>
    ${(!s.memorizeMode && s.mode !== 'copy-memorize' && (card.missStreak||0) >= 3) ? `
    <div style="background:rgba(245,166,35,0.12); border:1px solid rgba(245,166,35,0.4); border-radius:10px; padding:10px 14px; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;">
      <span style="font-size:12.5px; color:var(--accent);">Você errou essa questão 3 vezes seguidas.</span>

    </div>
    ` : ''}
    ${s.memorizeMode && s.mode === 'lang-mixed' ? `
    <div style="background:rgba(125,169,250,0.12); border:1px solid rgba(125,169,250,0.4); border-radius:10px; padding:8px 14px; margin-bottom:14px; font-size:12px; color:#7DA9FA; text-align:center;">
      🎯 Modo memorizar — a sessão normal retoma de onde parou ao terminar estes ${s.queue.length} exercícios
    </div>
    ` : ''}
    ${s.mode === 'copy-memorize' ? `
    <div style="background:rgba(125,169,250,0.12); border:1px solid rgba(125,169,250,0.4); border-radius:10px; padding:8px 14px; margin-bottom:14px; font-size:12px; color:#7DA9FA; text-align:center;">

    <div class="study-card">
      <div class="eyebrow" style="display:flex; justify-content:space-between; align-items:center;">

        <div style="display:flex; gap:4px;">

          <button class="icon-btn" style="width:26px; height:26px; font-size:13px; ${card.priority ? 'color:var(--accent);' : 'opacity:0.4;'}" title="${card.priority ? 'Remover prioridade' : 'Marcar prioridade (aparece mais vezes)'}" onclick="togglePriorityCurrentCard()">🔥</button>
          <button class="icon-btn" style="width:26px; height:26px; font-size:13px; ${card.flagged ? 'color:var(--accent);' : 'opacity:0.4;'}" title="${card.flagged ? 'Remover sinalização' : 'Sinalizar esta pergunta para editar/revisar depois'}" onclick="toggleFlagCurrentCard()">🚩</button>
        </div>
      </div>
      ${(card.note && s.showNote) ? `<div style="background:var(--accent-soft); border:1px solid var(--accent-dim); border-radius:10px; padding:10px 14px; margin:10px 0 0 0; font-size:13px; color:var(--text); text-align:left; white-space:pre-wrap;">💡 ${escapeHtml(card.note)}</div>` : ''}
      ${isReverse ? `<p style="color:var(--text-muted); font-size:12px; margin:0 0 4px 0;">Digite o termo em inglês para:</p>` : ''}
      ${hideTopQuestion ? '' : `<div class="question">${escapeHtml(questionText)}</div>`}
    </div>
    ${body}
  </div>`;

function renderImagePinMarkers(card, highlightCurrent){
  const allPins = (state.cards[state.session.deckId]||[]).filter(c => isImageCard(c) && c.imageUrl === card.imageUrl);
  return allPins.map(p => {
    const isCurrent = p.id === card.id;
    const size = (highlightCurrent && isCurrent) ? 24 : 14;
    const bg = (highlightCurrent && isCurrent) ? 'var(--accent)' : 'rgba(244,241,234,0.4)';
    const ring = (highlightCurrent && isCurrent) ? 'box-shadow:0 0 0 6px rgba(245,166,35,0.25);' : '';
    return `<div style="position:absolute; left:${p.pinX}%; top:${p.pinY}%; transform:translate(-50%,-50%); width:${size}px; height:${size}px; border-radius:50%; background:${bg}; border:2px solid var(--brand-text); ${ring} pointer-events:none;"></div>`;
  }).join('');
}
function renderImageBroken(){
  return `<div style="display:none; padding:36px 16px; text-align:center; color:var(--error); font-size:13px; background:var(--bg-2); border-radius:12px;">⚠ Não foi possível carregar essa imagem.</div>`;
}
function renderImageAnswerMode(s, card){
  // reaproveita 100% a mesma lógica de pergunta aberta (digita, autoavalia fácil/médio/difícil
  // quando a IA tá desligada, ou verificação por IA quando ligada) — só acrescenta a imagem em cima.
  const imageBlock = `
  <div style="position:relative; max-width:420px; width:100%; margin:0 auto 14px;">
    <img src="${escapeHtml(card.imageUrl)}" style="width:100%; display:block; border-radius:12px;" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
    ${renderImageBroken()}
    ${renderImagePinMarkers(card, true)}
  </div>`;
  return renderOpenMode(s, card, imageBlock);
}
const IMAGE_LOCATE_TOLERANCE_PCT = 7;
function answerImageLocate(e){
  const s = state.session; const card = getCurrentCard();
  if(!s || s.revealed) return;
  const rect = e.target.getBoundingClientRect();
  const x = ((e.clientX - rect.left) / rect.width) * 100;
  const y = ((e.clientY - rect.top) / rect.height) * 100;
  const dist = Math.hypot(x - card.pinX, y - card.pinY);
  const correct = dist <= IMAGE_LOCATE_TOLERANCE_PCT;
  s.clickPos = { x, y };
  scheduleCard(card, correct);
  if(correct){ s.correct++; } else { requeueOnWrong(); }
  awardPoints(card, correct, 'image-locate');
  s.lastFeedback = correct;
  s.revealed = true;
  saveData();
  render();
}
function renderImageLocateMode(s, card){
  if(!s.revealed){
    return `
    <div class="answer-zone" style="align-items:center;">
      <div style="position:relative; max-width:420px; width:100%; margin:0 auto;">
        <img src="${escapeHtml(card.imageUrl)}" style="width:100%; display:block; border-radius:12px; cursor:crosshair;" onclick="answerImageLocate(event)" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
        ${renderImageBroken()}
      </div>
      <p style="color:var(--text-muted); font-size:12.5px; text-align:center;">Clique no ponto certo da imagem.</p>
    </div>`;
  }
  return `
  <div class="answer-zone">
    <div style="position:relative; max-width:420px; width:100%; margin:0 auto;">
      <img src="${escapeHtml(card.imageUrl)}" style="width:100%; display:block; border-radius:12px;">
      <div style="position:absolute; left:${card.pinX}%; top:${card.pinY}%; transform:translate(-50%,-50%); width:22px; height:22px; border-radius:50%; background:var(--success); border:2px solid #06210F;"></div>
      ${(!s.lastFeedback && s.clickPos) ? `<div style="position:absolute; left:${s.clickPos.x}%; top:${s.clickPos.y}%; transform:translate(-50%,-50%); width:18px; height:18px; border-radius:50%; background:var(--error); border:2px solid #2A0A10;"></div>` : ''}
    </div>
    <div class="reveal-zone">
      <div class="feedback-banner ${s.lastFeedback?'ok':'no'}">${s.lastFeedback? '✓ Isso aí!' : '✕ Não era ali — o certo tá marcado em verde.'}</div>

      <div class="action-row"><button class="primary-btn" onclick="nextCard()">Próximo →</button></div>
    </div>
  </div>`;

function renderMCMode(s, card){

function renderOpenMode(s, card, extraTop){

    return `
    <div class="answer-zone">
      ${extraTop||''}
      <textarea id="open-input" rows="3" placeholder="Digite sua resposta... (Enter para confirmar, Shift+Enter para quebrar linha)" autofocus autocomplete="off" autocorrect="off" spellcheck="false" ${s.verifying?'disabled':''} onkeydown="if(event.key==='Enter' && !event.shiftKey){ event.preventDefault(); if(!${s.verifying}) submitOpenAnswerFromInput(); }" onkeyup="state.session.userInput=this.value">${escapeHtml(s.userInput||'')}</textarea>
      <div class="action-row">
        <button class="primary-btn" ${s.verifying?'disabled':''} onclick="submitOpenAnswerFromInput()">
          ${s.verifying ? 'Verificando na internet...' : 'Verificar resposta'}

      ${s.verifying ? `<div class="loading-line" style="justify-content:center;"><div class="spinner"></div> Buscando informações para conferir...</div>` : ''}
      <div style="text-align:center; margin-top:-4px;">
        <a href="#" style="font-size:11.5px; color:var(--text-faint); text-decoration:underline;" onclick="event.preventDefault(); dontKnowOpen();">não sei <span style="opacity:0.6;">(Esc)</span></a>
      </div>
    </div>`;
  }
  const r = s.verifyResult;
  return `
  <div class="answer-zone">

function renderLangMCExercise(s, card){
  if(!s.content || s.content.error || !s.content.options){
    if(s.content && s.content.notEnoughCards){
      return `<div class="answer-zone" style="align-items:center;"><p style="color:var(--text-muted); font-size:13px; text-align:center;">Esse baralho precisa de pelo menos 4 termos com tradução cadastrada pra montar alternativas de múltipla escolha. Adicione mais traduções na aba "Cartões".</p></div>`;
    }
    return langLoadError(s);
  }
  const correctIdx = s.content.correctIndexes || [];
  const checked = s.checkedIndexes || [];
  const multi = correctIdx.length > 1;
  return `
  <div class="answer-zone">
    <div class="answer-box" style="text-align:left;">${escapeHtml(s.content.prompt)}</div>
    ${(multi && !s.revealed) ? `<p style="color:var(--text-muted); font-size:12px; text-align:center; margin:-4px 0 0 0;">Esse termo tem mais de uma tradução certa — marque todas antes de avançar.</p>` : ''}
    <div class="options-grid">
      ${s.content.options.map((opt, i) => {
        let cls = '';
        const isChecked = checked.includes(i);
        if(s.revealed){
          if(correctIdx.includes(i)) cls = 'correct';
          else if(i === s.chosenIndex || isChecked) cls = 'wrong';
        } else if(isChecked){
          cls = 'correct';
        }
        return `<button class="option-btn ${cls}" ${(s.revealed||isChecked)?'disabled':''} onclick="answerLangMC(${i})"><span class="opt-num">${isChecked && !s.revealed ? '✓' : i+1}</span>${escapeHtml(opt)}</button>`;
      }).join('')}
    </div>
    ${(!s.revealed && s.partialCorrect) ? `<div class="feedback-banner ok">☑ Essa foi! Ainda falta marcar ${correctIdx.length - checked.length} opção(ões) certa(s).</div>` : ''}
    ${!s.revealed ? renderDontKnowLangLink() : ''}
    ${s.revealed ? `
      <div class="feedback-banner ${s.lastFeedback?'ok':'no'}">${s.lastFeedback? '✓ Isso aí!' : '✕ Não foi dessa vez.'}</div>
      ${renderPointsBadge(s)}
      <div class="action-row"><button class="primary-btn" onclick="nextCard()">Próximo →</button></div>
    ` : ''}
  </div>`;
}

function renderResultsView(){
  const s = state.session;
  if(!s) return '';
  const total = s.queue.length;
  const accuracy = total ? Math.round((s.correct / total) * 100) : 0;
  const elapsed = Date.now() - s.startTime;
  const avgSec = total ? (elapsed/1000/total) : 0;
  let rank = 'D';
  if(accuracy >= 90 && avgSec < 10) rank = 'S';
  else if(accuracy >= 80) rank = 'A';
  else if(accuracy >= 60) rank = 'B';
  else if(accuracy >= 40) rank = 'C';

  return `
  <div class="results-wrap">
    <div class="eyebrow" style="font-size:11px; letter-spacing:0.1em; color:var(--text-faint); text-transform:uppercase; font-weight:600;">Sessão concluída</div>
    <div class="rank-ring" style="--pct:${accuracy}"><div class="rank-letter">${rank}</div></div>
    <h2 style="margin:0;">${accuracy}% de acerto</h2>
    <div class="results-stats">
      <div class="res-chip"><div class="num mono">${fmtTime(elapsed)}</div><div class="lbl">tempo total</div></div>
      <div class="res-chip"><div class="num mono">${s.correct}/${total}</div><div class="lbl">acertos</div></div>
      <div class="res-chip"><div class="num mono">${avgSec.toFixed(1)}s</div><div class="lbl">média por cartão</div></div>
      <div class="res-chip"><div class="num mono" style="color:var(--success);">🏆 ${s.points||0}</div><div class="lbl">pontos ganhos</div></div>
    </div>
    <div class="action-row">
      <button class="ghost-btn" onclick="backToDeck()">Voltar ao baralho</button>
      <button class="primary-btn" onclick="${s.mode === 'lang-mixed' ? `startLanguageSession('${s.deckId}')` : `startSession('${s.deckId}','${s.mode}')`}">Estudar de novo</button>
    </div>
  </div>`;
}

}

/* ============ UTIL ============ */
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* live timer tick while studying */
setInterval(()=>{ if(state.view === 'study'){ const t = document.querySelector('.timer'); if(t && state.session) t.textContent = fmtTime(Date.now()-state.session.startTime); } }, 1000);

/* Enter avança para a próxima pergunta quando o botão "Próximo →" está visível,
   sem precisar clicar com o mouse. Enquanto o campo de resposta ainda não foi
   revelado, o Enter continua sendo tratado pelo próprio campo (confirma a resposta). */
document.addEventListener('keydown', function(e){
  if(e.key !== 'Enter') return;
  if(state.view !== 'study' || !state.session) return;
  const s = state.session;
  const stdMixedExType = s.mode === 'std-mixed' ? getCurrentExType() : null;
  const isGradedContext = (s.mode === 'open' || stdMixedExType === 'open' || stdMixedExType === 'image-answer') && s.usesGradedOpen;
  const nextVisible = s.mode === 'direct'
    ? (s.revealed && s.lastFeedback !== null)
    : isGradedContext
      ? (s.revealed && s.graded)
      : (s.revealed && !s.verifying);
  if(nextVisible){
    e.preventDefault();
    nextCard();
  }
});

/* Teclas 1-4 escolhem a alternativa correspondente nos modos de múltipla escolha. */
document.addEventListener('keydown', function(e){
  if(!['1','2','3','4'].includes(e.key)) return;
  if(state.view !== 'study' || !state.session) return;
  const s = state.session;
  if(s.revealed || s.verifying) return;
  const idx = parseInt(e.key, 10) - 1;
  if((s.mode === 'mc' || (s.mode === 'std-mixed' && getCurrentExType() === 'mc')) && s.options && !s.loadingOptions){
    if(idx < s.options.length){ e.preventDefault(); answerMC(idx); }
  } else if(s.mode === 'lang-mixed' && getCurrentExType() === 'mc' && s.content && s.content.options && !s.loadingContent){
    if(idx < s.content.options.length){ e.preventDefault(); answerLangMC(idx); }
  }
});

/* Esc aciona "não sei" nas perguntas abertas e nos exercícios de idioma, antes de revelar a resposta. */
document.addEventListener('keydown', function(e){
  if(e.key !== 'Escape') return;
  if(state.view !== 'study' || !state.session) return;
  const s = state.session;
  const stdMixedExType = s.mode === 'std-mixed' ? getCurrentExType() : null;
  if((s.mode === 'open' || stdMixedExType === 'open' || stdMixedExType === 'image-answer') && !s.revealed && !s.verifying){
    e.preventDefault();
    dontKnowOpen();
  } else if(s.mode === 'lang-mixed' && !s.revealed && !s.memorizeMode){
    e.preventDefault();
    dontKnowLang();
  }
});

/* Tecla L mostra/esconde a nota do cartão — só quando não tem campo de texto focado,
   pra não atrapalhar quem está digitando uma resposta que contenha a letra L. */
document.addEventListener('keydown', function(e){
  if(e.key !== 'l' && e.key !== 'L') return;
  if(state.view !== 'study' || !state.session) return;
  const active = document.activeElement;
  if(active && (active.tagName === 'TEXTAREA' || active.tagName === 'INPUT')) return;
  const card = getCurrentCard();
  if(!card || !card.note) return;
  e.preventDefault();
  toggleNoteView();
});
