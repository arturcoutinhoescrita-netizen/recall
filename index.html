async function loadContentForCurrent(){
  const s = state.session; if(!s) return;
  const card = getCurrentCard(); if(!card) return;
  const exType = getCurrentExType();
  if(exType === 'translate'){
    // sorteia qual sentido "focar" a dica dessa vez — a pontuação continua
    // aceitando qualquer tradução válida, a dica só ajuda a lembrar uma delas.
    const options = getCardTranslations(card);
    const hintIndex = Math.floor(Math.random()*options.length);
    s.loadingContent = false; s.content = { hintIndex }; render(); return; // local, sem IA
  }
  if(exType === 'translateAI'){
    s.loadingContent = false; s.content = {}; render(); return;
  }
  if(exType === 'reverseTranslate'){
    const options = String(card.back||'').split('/').map(o=>o.trim()).filter(Boolean);
    const idx = Math.floor(Math.random()*options.length);
    const chosen = options[idx] || card.back;
    s.loadingContent = false; s.content = { chosenTranslation: chosen, chosenIndex: idx }; render(); return; // local, sem IA
  }
  if(exType === 'mc'){
    const mc = generateLocalMC(card, state.cards[s.deckId]);
    s.loadingContent = false;
    s.content = mc || { error: true, notEnoughCards: true };
    render();
    return; // local, sem IA
  }
  if(exType === 'translateOther'){
    const options = getCardTranslations(card);
    const excludeIdx = Math.floor(Math.random()*options.length);
    s.loadingContent = false;
    s.content = { excluded: options[excludeIdx], validOptions: options.filter((_,i)=>i!==excludeIdx) };
    render();
    return; // local, sem IA
  }
  if(exType === 'copy-translation'){
    const item = getCurrentQueueItem();
    const options = getCardTranslations(card);
    const idx = Math.min((item && item.translationIndex) || 0, options.length-1);
    s.loadingContent = false;
    s.content = { targetTranslation: options[idx], translationIndex: idx };
    render();
    return; // local, sem IA
  }
  const cacheKey = `${card.id}:${exType}`;
  if(s.contentCache && s.contentCache[cacheKey]){
    s.loadingContent = false; s.content = s.contentCache[cacheKey]; render(); return; // já veio pré-gerado em lote
  }
  s.loadingContent = true; s.content = null; render();
  try{
    if(exType === 'write'){
      s.content = { sentence: await generateSentenceForTerm(card.front, s.sentenceDifficulty) };
    }
  }catch(e){
    console.error(e);
    s.content = { error: true, missingKey: e && e.code === 'missing_api_key' };
  }
  s.loadingContent = false; render();
}

function requeueOnWrong(){
  const s = state.session; if(!s) return;
  const current = s.queue[s.index];
  const clone = (current && typeof current === 'object') ? { ...current } : current;
  const offset = 3 + Math.floor(Math.random()*4); // reaparece de 3 a 6 perguntas à frente
  const insertAt = Math.min(s.index + offset, s.queue.length);
  s.queue.splice(insertAt, 0, clone);
}
function startMemorizeMode(){
  const s = state.session; if(!s || s.mode !== 'lang-mixed') return;
  const card = getCurrentCard(); if(!card) return;
  const translations = getCardTranslations(card);
  if(translations.length === 0){ showToast('Esse termo não tem tradução cadastrada — adicione uma antes de memorizar.', 'error'); return; }
  // 1 pergunta de cópia por tradução (até 2), depois sempre 2 de recordação livre —
  // assim quem tem só 1 tradução treina menos e quem tem 2+ é empurrado a usar as duas.
  let queue = [];
  const copyCount = Math.min(2, translations.length);
  for(let i=0; i<copyCount; i++) queue.push({ cardId: card.id, exType: 'copy-translation', translationIndex: i });
  queue.push({ cardId: card.id, exType: 'translate' });
  queue.push({ cardId: card.id, exType: 'translate' });
  state.previousSession = s; // guarda a sessão normal pra retomar depois
  state.session = {
    deckId: s.deckId, mode: 'lang-mixed', memorizeMode: true, memorizeCardId: card.id,
    queue, index: 0,

    loadingContent: false, content: null, chosenIndex: null

/* transforma uma frase gerada pela IA em texto com cada palavra clicável,
   pra consultar a tradução de termos desconhecidos sem sair do exercício. */
function renderClickableSentence(sentence){
  if(!sentence) return '';
  const tokens = sentence.split(/(\s+)/);
  return tokens.map(tok => {
    const m = tok.match(/^([A-Za-zÀ-ÿ']+)(.*)$/);
    if(m && m[1]){
      const word = m[1];
      return `<span class="clickable-word" onclick="lookupWord('${word.replace(/'/g,"\\'")}')">${escapeHtml(word)}</span>${escapeHtml(m[2])}`;
    }
    return escapeHtml(tok);
  }).join('');
}
/* deckId/sentenceOverride ficam de fora quando chamado durante uma sessão de estudo
   (usa o baralho e a frase da sessão atual); o leitor de EPUB passa os dois explicitamente,
   já que ali não existe uma sessão de estudo ativa. */
function lookupWord(word, deckId, sentenceOverride){
  const targetDeckId = deckId || (state.session && state.session.deckId);
  const sentence = sentenceOverride != null ? sentenceOverride : ((state.session && state.session.content && state.session.content.sentence) || '');
  const cleanWord = (word||'').trim();
  if(!cleanWord) return;
  state.modal = { type:'word-lookup', word: cleanWord, sentence, deckId: targetDeckId, status:'loading', direct:'', contextual:[], category:'', hint:'', note:'' };
  render();
  translateWordInContext(cleanWord, sentence).then(result => {
    if(state.modal && state.modal.type === 'word-lookup' && state.modal.word === cleanWord){
      state.modal.status = 'done';
      state.modal.direct = result.direct;
      state.modal.contextual = result.contextual;
      state.modal.category = result.category;
      state.modal.hint = result.hint;
      state.modal.note = result.note;
      render();
    }
  }).catch(err => {
    console.error('Falha ao traduzir palavra', err);
    if(state.modal && state.modal.type === 'word-lookup' && state.modal.word === cleanWord){
      state.modal.status = 'error';
      state.modal.error = friendlyAiErrorMsg(err);
      render();
    }
  });
}
// front = a palavra, back = tradução direta (a que mais importa) + as opções
// contextuais, todas separadas por "/" (o mesmo formato que getCardTranslations
// já espera pra virar respostas alternativas) — sem repetir se a direta já
// coincidir com uma das contextuais. note = explicação breve da IA (livre pra
// citar a tradução, só aparece se a pessoa clicar pra ver), category = classe
// gramatical (substantivo/verbo/etc.) mostrada durante o estudo.
// hints = uma DICA por opção (mesma ordem de allTranslations): em branco pra
// tradução direta (índice 0, não depende de contexto nenhum) e uma pista curta
// da situação pras opções contextuais — sem citar a tradução, só ajuda a
// lembrar qual sentido usar sem entregar a resposta.
function buildLookupCard(m){
  const seen = new Set();
  const allTranslations = [];
  const hints = [];
  // rede de segurança: se por algum motivo a dica da IA citar uma das próprias
  // traduções aceitas, é melhor não mostrar nada do que entregar a resposta.
  const allAcceptedNorms = [m.direct, ...(m.contextual||[])].filter(Boolean).map(normalizeAnswer);
  const safeHint = (() => {
    const hint = (m.hint||'').trim();
    if(!hint) return '';
    const hintNorm = normalizeAnswer(hint);
    const leaks = allAcceptedNorms.some(t => t && new RegExp(`\\b${t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}\\b`).test(hintNorm));
    return leaks ? '' : hint;
  })();
  if(m.direct){
    allTranslations.push(m.direct);
    hints.push(''); // direta não depende de contexto
    seen.add(normalizeAnswer(m.direct));
  }
  (m.contextual||[]).forEach(t => {
    const norm = normalizeAnswer(t);
    if(!seen.has(norm)){
      allTranslations.push(t);
      hints.push(safeHint);
      seen.add(norm);
    }
  });
  const card = makeCard(m.word, allTranslations.join(' / '));
  card.note = m.note || '';
  card.category = m.category || '';
  card.hints = hints;
  return card;
}
function addLookupWordToDeck(){
  const m = state.modal;
  if(!m || m.type !== 'word-lookup' || m.status !== 'done') return;
  if(!m.deckId || !state.cards[m.deckId]){ state.modal = null; render(); return; }
  const card = buildLookupCard(m);
  if(findDuplicateLanguageTerm(m.deckId, card.front, card.category)){
    showToast(`"${card.front}" já existe neste baralho com a categoria ${card.category || 'não informada'}.`, 'error');
    return;
  }
  state.cards[m.deckId].push(card);
  state.modal = null;
  saveData(); render();
  showToast(`"${m.word}" adicionado ao baralho.`);
}
// cria o cartão igual addLookupWordToDeck, mas já abre uma sessão rápida de

function memorizeLookupWord(){
  const m = state.modal;
  if(!m || m.type !== 'word-lookup' || m.status !== 'done') return;
  if(!m.deckId || !state.cards[m.deckId]){ showToast('Vincule um baralho a este livro pra poder memorizar.', 'error'); return; }

// mesmo critério do "memorizar" do modo idioma (startMemorizeMode): uma pergunta

// terminando em UMA pergunta de tradução livre (sem ver a resposta antes).
function startReaderMemorize(deckId, card, bookId){
  const translations = getCardTranslations(card);
  if(translations.length === 0){ showToast('Esse termo não tem tradução cadastrada.', 'error'); return; }
  const queue = translations.map((t,i) => ({ cardId: card.id, exType: 'copy-translation', translationIndex: i }));
  queue.push({ cardId: card.id, exType: 'translate' });
  state.previousSession = null;
  state.currentDeckId = deckId; // renderMain() cai na tela vazia sem isso, mesmo com view='study'
  state.session = {
    deckId, mode: 'lang-mixed', memorizeMode: true, memorizeCardId: card.id,
    queue, index: 0,
    correct: 0, total: queue.length,
    startTime: Date.now(), cardStart: Date.now(),
    revealed: false, userInput: '', verifying: false, verifyResult: null, lastFeedback: null,
    loadingContent: false, content: null, chosenIndex: null,
    returnToReaderBookId: bookId
  };
  state.view = 'study';
  showToast(`Memorizando "${card.front}": ${queue.length} exercícios antes de voltar pra leitura.`);
  render();
  prefetchSessionContent(state.session).then(() => loadContentForCurrent());
}
function startCopyMemorize(){

function endMemorizeMode(){
  const returnBookId = state.session && state.session.returnToReaderBookId;
  if(returnBookId){
    // veio do leitor de epub (memorizar direto da tradução), não de uma sessão
    // de estudo pausada — volta pra página onde a pessoa estava lendo.
    state.session = null;
    state.previousSession = null;
    state.currentDeckId = null; // senão o baralho do cartão memorizado fica marcado como "ativo" na barra lateral por engano
    state._epubPendingPageJump = null; // defensivo: não deixa um pulo pendente de antes disparar num capítulo errado
    state.currentBookId = returnBookId;
    state.view = 'epub-reader';
    render();
    return;
  }
  const prev = state.previousSession;
  state.previousSession = null;
  if(prev){
    const card = (state.cards[prev.deckId]||[]).find(c=>c.id === state.session.memorizeCardId);
    if(card) card.missStreak = 0; // zera pra não reabrir o memorizar de novo imediatamente
    if(prev.index >= prev.queue.length){
      // a sessão pausada já tinha chegado ao fim (ex: "não sei" na última pergunta)
      state.session = prev;
      finalizeCarryOver();
      state.view = 'results';
      render();
      return;
    }
    state.session = prev;
    state.view = 'study';
    saveData();
    render();
    if(prev.mode === 'mc') loadOptionsForCurrent();
    else if(prev.mode === 'lang-mixed') loadContentForCurrent();
    else if(prev.mode === 'std-mixed' && getCurrentExType() === 'mc') loadOptionsForCurrent();
  } else {
    state.view = 'results';
    render();
  }
}

async function submitLanguageAnswer(){
  const s = state.session; const card = getCurrentCard(); const exType = getCurrentExType();
  if(!s.userInput.trim()) return;
  if(exType === 'translate'){
    // verificação 100% local, sem chamada de IA
    const correct = checkLocalTranslation(s.userInput.trim(), card.back);
    const acceptedList = String(card.back||'').split('/').map(s=>s.trim()).filter(Boolean);
    const typedNorm = normalizeAnswer(s.userInput.trim());
    const otherOptions = acceptedList.filter(a => normalizeAnswer(a) !== typedNorm);
    const explanation = correct
      ? (otherOptions.length ? `Outras traduções também aceitas: ${otherOptions.join(', ')}` : '')
      : `Tradução esperada: ${acceptedList.join(', ')}`;
    s.verifyResult = { correct, explanation };
    scheduleCard(card, correct);
    if(correct){ s.correct++; } else { requeueOnWrong(); }
    awardPoints(card, correct, 'translate');
    s.lastFeedback = correct;
    s.revealed = true;
    saveData();
    render();
    return;
  }
  if(exType === 'translateAI'){
    s.verifying = true; render();
    try{
      const result = await verifyDirectTranslationWithAI(card.front, card.category || '', s.userInput.trim());
      s.verifyResult = result;
      scheduleCard(card, result.correct);
      if(result.correct){ s.correct++; } else { requeueOnWrong(); }
      awardPoints(card, result.correct, 'translateAI');
      s.lastFeedback = result.correct;
    }catch(e){
      console.error(e);
      s.verifyResult = { correct:false, explanation: friendlyAiErrorMsg(e) };
    }
    s.verifying = false; s.revealed = true;
    saveData();
    render();
    return;
  }
  if(exType === 'reverseTranslate'){
    // verificação 100% local, sem chamada de IA — compara com o termo original (front), ignorando texto entre parênteses
    const cleanFront = stripParens(card.front);
    const correct = normalizeAnswer(s.userInput.trim()) === normalizeAnswer(cleanFront);
    s.verifyResult = { correct, explanation: correct ? '' : `Termo esperado: ${cleanFront}` };
    scheduleCard(card, correct);
    if(correct){ s.correct++; } else { requeueOnWrong(); }
    awardPoints(card, correct, 'reverseTranslate');
    s.lastFeedback = correct;
    s.revealed = true;
    saveData();
    render();
    return;
  }
  if(exType === 'translateOther'){
    // verificação 100% local — precisa bater com alguma tradução aceita QUE NÃO seja a excluída
    const typedNorm = normalizeAnswer(s.userInput.trim());
    const excludedNorm = normalizeAnswer(s.content.excluded);
    const correct = typedNorm !== excludedNorm && s.content.validOptions.some(o => normalizeAnswer(o) === typedNorm);
    const explanation = correct ? '' : `Não vale "${s.content.excluded}" — outra(s) tradução(ões) aceita(s): ${s.content.validOptions.join(', ')}`;
    s.verifyResult = { correct, explanation };
    scheduleCard(card, correct);
    if(correct){ s.correct++; } else { requeueOnWrong(); }
    awardPoints(card, correct, 'translateOther');
    s.lastFeedback = correct;
    s.revealed = true;
    saveData();
    render();
    return;
  }
  if(exType === 'copy-translation'){
    // só copiar certinho pra fixar — não afeta a repetição espaçada, igual o copy-memorize do baralho padrão
    const correct = normalizeAnswer(s.userInput.trim()) === normalizeAnswer(s.content.targetTranslation);
    s.verifyResult = { correct, explanation: correct ? '' : `Devia ser: ${s.content.targetTranslation}` };
    s.lastFeedback = correct;
    s.revealed = true;
    if(correct) playCorrect(); else playWrong();
    render();
    return;
  }
  s.verifying = true; render();
  try{
    let result;
    if(exType === 'write') result = await verifyTranslation(card.front, s.content.sentence, s.userInput.trim());
    s.verifyResult = result;
    scheduleCard(card, result.correct);
    if(result.correct){ s.correct++; } else { requeueOnWrong(); }
    awardPoints(card, result.correct, 'write');
    s.lastFeedback = result.correct;
  }catch(e){
    console.error(e);
    s.verifyResult = { correct:false, explanation: friendlyAiErrorMsg(e) };
  }
  s.verifying = false; s.revealed = true;
  saveData();
  render();
}
function answerLangMC(optionIndex){
  const s = state.session; const card = getCurrentCard();
  if(s.revealed) return;
  const correctIdx = s.content.correctIndexes || [];
  s.checkedIndexes = s.checkedIndexes || [];
  if(s.checkedIndexes.includes(optionIndex)) return;
  const isCorrectPick = correctIdx.includes(optionIndex);
  if(!isCorrectPick){
    // marcou uma errada: encerra a questão como errada, mesmo se já tinha achado uma certa antes
    s.chosenIndex = optionIndex; s.revealed = true; s.lastFeedback = false; s.partialCorrect = false;
    scheduleCard(card, false);
    requeueOnWrong();
    awardPoints(card, false, 'langMC');
    saveData();
    render();
    return;
  }
  s.checkedIndexes.push(optionIndex);
  if(s.checkedIndexes.length < correctIdx.length){
    // achou uma certa, mas ainda tem outra(s) — não revela nem avança ainda
    s.partialCorrect = true;
    render();
    return;
  }
  // achou todas as opções certas
  s.revealed = true; s.lastFeedback = true; s.partialCorrect = false;
  scheduleCard(card, true);
  s.correct++;
  awardPoints(card, true, 'langMC');
  saveData();
  render();
}

/* ============ LEITOR DE EPUB (dentro de Leituras) ============ */
// dados "vivos" (zip aberto, caminhos dos capítulos) ficam FORA de state — não são
// serializáveis e não fazem sentido sincronizar; só os metadados leves (book.epub)
// e as citações/cartões criados a partir da leitura sincronizam normalmente.
let epubRuntime = {}; // bookId -> { zip, chapterPaths, paragraphsCache: {index: [parágrafos]} }
let __lastEpubPageKey = null; // guarda qual página foi renderizada por último, pra só animar em virada de página de verdade

async function parseEpubFile(blob){
  const zip = await JSZip.loadAsync(blob);
  const containerFile = zip.file('META-INF/container.xml');
  if(!containerFile) throw new Error('epub_invalido');
  const containerXml = await containerFile.async('text');
  const containerDoc = new DOMParser().parseFromString(containerXml, 'application/xml');
  const opfPath = containerDoc.querySelector('rootfile').getAttribute('full-path');
  const opfFile = zip.file(opfPath);
  if(!opfFile) throw new Error('epub_invalido');
  const opfXml = await opfFile.async('text');
  const opfDoc = new DOMParser().parseFromString(opfXml, 'application/xml');
  const opfDir = opfPath.includes('/') ? opfPath.slice(0, opfPath.lastIndexOf('/')+1) : '';

  const titleEl = opfDoc.getElementsByTagNameNS('http://purl.org/dc/elements/1.1/', 'title')[0];
  const authorEl = opfDoc.getElementsByTagNameNS('http://purl.org/dc/elements/1.1/', 'creator')[0];
  const title = (titleEl && titleEl.textContent.trim()) || 'Sem título';
  const author = (authorEl && authorEl.textContent.trim()) || '';

  const manifestItems = {};
  const manifestItemEls = Array.from(opfDoc.querySelectorAll('manifest > item'));
  manifestItemEls.forEach(item => {
    manifestItems[item.getAttribute('id')] = item.getAttribute('href');
  });
  const spineIds = Array.from(opfDoc.querySelectorAll('spine > itemref')).map(ir => ir.getAttribute('idref'));
  const chapterPaths = spineIds.map(id => manifestItems[id]).filter(Boolean).map(href => opfDir + href);
  if(chapterPaths.length === 0) throw new Error('epub_sem_capitulos');

  // capa: tenta o padrão EPUB3 (properties="cover-image") e cai pro EPUB2
  // (<meta name="cover" content="ID"/> apontando pro item no manifesto).
  let coverHref = null;
  const coverItemEl = manifestItemEls.find(item => (item.getAttribute('properties')||'').split(/\s+/).includes('cover-image'));
  if(coverItemEl) coverHref = coverItemEl.getAttribute('href');
  if(!coverHref){
    const metaCover = opfDoc.querySelector('metadata > meta[name="cover"]');
    if(metaCover) coverHref = manifestItems[metaCover.getAttribute('content')];
  }
  let coverUrl = '';
  if(coverHref){
    const coverFile = zip.file(opfDir + coverHref);
    if(coverFile){
      const base64 = await coverFile.async('base64');
      const ext = coverHref.split('.').pop().toLowerCase();
      const mime = ext==='png' ? 'image/png' : ext==='svg' ? 'image/svg+xml' : ext==='gif' ? 'image/gif' : 'image/jpeg';
      coverUrl = `data:${mime};base64,${base64}`;
    }
  }

  const { toc, chapterTitles } = await parseEpubToc(zip, opfDoc, opfDir, manifestItemEls, manifestItems, chapterPaths);

  return { zip, title, author, chapterPaths, coverUrl, toc, chapterTitles };
}
// resolve um href relativo (do nav/ncx) contra o diretório de onde ele veio —
// usa a API de URL só pra lidar com "../" direito. Mantém a âncora (#p45) à
// parte: em muitos epubs (principalmente convertidos pelo Calibre) vários
// capítulos de verdade ficam num único arquivo grande, diferenciados só pela
// âncora — sem isso o sumário não consegue apontar pro lugar certo.
function resolveEpubHrefParts(baseDir, href){
  if(!href) return { path:'', fragment:'' };
  const [pathPart, fragment] = href.split('#');
  if(!pathPart) return { path:'', fragment: fragment||'' };
  try{
    const resolved = new URL(pathPart, 'file:///' + baseDir).pathname.replace(/^\//, '');
    return { path: decodeURIComponent(resolved), fragment: fragment||'' };
  }catch(e){ return { path: baseDir + pathPart, fragment: fragment||'' }; }
}
// lê o sumário do epub: tenta o nav document do EPUB3 (properties="nav") e,
// se não achar, cai pro NCX do EPUB2 (navMap/navPoint). Cada entrada é casada
// com o índice do capítulo correspondente no spine pelo caminho do arquivo.
async function parseEpubToc(zip, opfDoc, opfDir, manifestItemEls, manifestItems, chapterPaths){
  const entries = [];
  const navItem = manifestItemEls.find(item => (item.getAttribute('properties')||'').split(/\s+/).includes('nav'));
  if(navItem){
    try{
      const navPath = opfDir + navItem.getAttribute('href');
      const navFile = zip.file(navPath);
      if(navFile){
        const navXml = await navFile.async('text');
        let navDoc = new DOMParser().parseFromString(navXml, 'application/xhtml+xml');
        if(navDoc.querySelector('parsererror')) navDoc = new DOMParser().parseFromString(navXml, 'text/html');
        const navDir = navPath.includes('/') ? navPath.slice(0, navPath.lastIndexOf('/')+1) : '';
        const navEls = Array.from(navDoc.querySelectorAll('nav'));
        const tocNav = navEls.find(n => (n.getAttribute('epub:type')||'').includes('toc')) || navEls[0];
        if(tocNav){
          Array.from(tocNav.querySelectorAll('a[href]')).forEach(a => {
            const title = a.textContent.replace(/\s+/g,' ').trim();
            const href = a.getAttribute('href');
            if(title && href) entries.push({ title, ...resolveEpubHrefParts(navDir, href) });
          });
        }
      }
    }catch(e){ console.warn('Falha ao ler nav (sumário) do epub', e); }
  }
  if(entries.length === 0){
    const spineEl = opfDoc.querySelector('spine');
    const tocId = spineEl && spineEl.getAttribute('toc');
    const ncxHref = tocId ? manifestItems[tocId] : Object.values(manifestItems).find(h => h && h.toLowerCase().endsWith('.ncx'));
    if(ncxHref){
      try{
        const ncxPath = opfDir + ncxHref;
        const ncxFile = zip.file(ncxPath);
        if(ncxFile){
          const ncxXml = await ncxFile.async('text');
          const ncxDoc = new DOMParser().parseFromString(ncxXml, 'application/xml');
          const ncxDir = ncxPath.includes('/') ? ncxPath.slice(0, ncxPath.lastIndexOf('/')+1) : '';
          Array.from(ncxDoc.querySelectorAll('navPoint')).forEach(np => {
            const labelEl = np.querySelector('navLabel > text');
            const contentEl = np.querySelector('content');
            const title = labelEl ? labelEl.textContent.replace(/\s+/g,' ').trim() : '';
            const src = contentEl ? contentEl.getAttribute('src') : '';
            if(title && src) entries.push({ title, ...resolveEpubHrefParts(ncxDir, src) });
          });
        }
      }catch(e){ console.warn('Falha ao ler ncx (sumário) do epub', e); }
    }
  }
  const toc = [];
  const chapterTitles = new Array(chapterPaths.length).fill(null);
  entries.forEach(entry => {
    const idx = chapterPaths.findIndex(p => p === entry.path);
    if(idx === -1) return;
    toc.push({ title: entry.title, chapterIndex: idx, fragment: entry.fragment || null });
    if(!chapterTitles[idx]) chapterTitles[idx] = entry.title;
  });
  return { toc, chapterTitles };
}
// estimativa grosseira de páginas impressas a partir da contagem de palavras
// (só roda no upload, não toda vez que o livro é reaberto).
async function estimateEpubPageCount(zip, chapterPaths){
  const WORDS_PER_PAGE = 260;
  let totalWords = 0;
  for(const path of chapterPaths){
    const file = zip.file(path);
    if(!file) continue;
    try{
      const xhtml = await file.async('text');
      let doc = new DOMParser().parseFromString(xhtml, 'application/xhtml+xml');
      if(doc.querySelector('parsererror')) doc = new DOMParser().parseFromString(xhtml, 'text/html');
      const text = (doc.body || doc.documentElement).textContent || '';
      totalWords += (text.match(/\S+/g) || []).length;
    }catch(e){ /* ignora capítulo problemático na estimativa */ }
  }
  return Math.max(1, Math.round(totalWords / WORDS_PER_PAGE));
}
async function loadEpubChapterParagraphs(bookId, index){
  const runtime = epubRuntime[bookId];
  if(!runtime) throw new Error('epub_nao_carregado');
  if(runtime.paragraphsCache[index]) return runtime.paragraphsCache[index];
  const path = runtime.chapterPaths[index];
  const file = runtime.zip.file(path);
  if(!file) throw new Error('capitulo_nao_encontrado');
  const xhtml = await file.async('text');
  let doc = new DOMParser().parseFromString(xhtml, 'application/xhtml+xml');
  if(doc.querySelector('parsererror')) doc = new DOMParser().parseFromString(xhtml, 'text/html'); // fallback pra epubs com xhtml malformado
  const kept = [];
  Array.from(doc.querySelectorAll('p, h1, h2, h3, h4, li, blockquote')).forEach(el => {
    const text = el.textContent.replace(/\s+/g,' ').trim();
    if(text) kept.push({ el, text });
  });
  const paragraphs = kept.map(k => k.text);
  // mapa âncora->parágrafo: em muitos epubs vários capítulos de verdade ficam
  // no mesmo arquivo, diferenciados só por id="pN" — sem isso o sumário e os
  // marcadores não têm como apontar pro parágrafo certo dentro do arquivo.
  const anchorMap = {};
  Array.from(doc.querySelectorAll('[id]')).forEach(idEl => {
    const id = idEl.getAttribute('id');
    if(!id || anchorMap[id] !== undefined) return;
    let found = kept.length ? kept.length - 1 : 0;
    for(let i=0;i<kept.length;i++){
      const node = kept[i].el;
      if(node === idEl){ found = i; break; }
      const rel = idEl.compareDocumentPosition(node);
      if(rel & (Node.DOCUMENT_POSITION_FOLLOWING | Node.DOCUMENT_POSITION_CONTAINED_BY)){ found = i; break; }
    }
    anchorMap[id] = found;
  });
  runtime.paragraphsCache[index] = paragraphs;
  runtime.anchorMaps = runtime.anchorMaps || {};
  runtime.anchorMaps[index] = anchorMap;
  return paragraphs;
}
// divide os parágrafos de um capítulo em "páginas" de tamanho parecido (por
// contagem de palavras) — é o que abandona a rolagem infinita: cada página
// vira um bloco curto, e o Anterior/Próximo passa por elas uma de cada vez.
// Nunca quebra um parágrafo ao meio, então uma página pode ficar um pouco
// maior que o alvo se um único parágrafo já for longo.
const EPUB_WORDS_PER_PAGE = 220;
// "hardBreaks" força o início de página exatamente onde um capítulo de
// verdade começa (âncora do sumário) — sem isso, um pulo pelo sumário podia
// cair numa página que começava com o FINAL do capítulo anterior, e só lá
// embaixo é que aparecia o capítulo que a pessoa realmente escolheu.
function chunkParagraphsIntoPages(paragraphs, hardBreaks){
  hardBreaks = hardBreaks || new Set();
  if(paragraphs.length === 0) return [{ start:0, end:0 }];
  const pages = [];
  let start = 0, count = 0;
  for(let i=0;i<paragraphs.length;i++){
    const words = (paragraphs[i].match(/\S+/g)||[]).length;
    const forceBreak = i > start && hardBreaks.has(i);
    if(forceBreak || (count > 0 && count + words > EPUB_WORDS_PER_PAGE)){
      pages.push({ start, end:i });
      start = i; count = 0;
    }
    count += words;
  }
  pages.push({ start, end:paragraphs.length });
  return pages;
}
// só calcula (e guarda em cache) depois que os parágrafos do capítulo já
// foram carregados — devolve null se ainda não deu tempo.
function getEpubPages(bookId, chapterIndex){
  const runtime = epubRuntime[bookId];
  const paragraphs = runtime && runtime.paragraphsCache[chapterIndex];
  if(!paragraphs) return null;
  runtime.pagesCache = runtime.pagesCache || {};
  if(!runtime.pagesCache[chapterIndex]){
    const book = state.books.find(b=>b.id===bookId);
    const hardBreaks = new Set();
    if(book && book.epub && book.epub.toc){
      book.epub.toc.forEach(entry => {
        if(entry.chapterIndex === chapterIndex && entry.fragment){
          const pIdx = resolveEpubAnchorParagraphIndex(bookId, chapterIndex, entry.fragment);
          if(pIdx > 0) hardBreaks.add(pIdx);
        }
      });
    }
    runtime.pagesCache[chapterIndex] = chunkParagraphsIntoPages(paragraphs, hardBreaks);
  }
  return runtime.pagesCache[chapterIndex];
}
// pra qual parágrafo (já no espaço de índices filtrado, igual paragraphsCache)
// uma âncora "#pN" do sumário aponta — 0 se a âncora não existir ou o
// capítulo ainda não tiver sido carregado (fica pro início dele).
function resolveEpubAnchorParagraphIndex(bookId, chapterIndex, fragment){
  const runtime = epubRuntime[bookId];
  const map = runtime && runtime.anchorMaps && runtime.anchorMaps[chapterIndex];
  if(!fragment || !map || map[fragment] === undefined) return 0;
  return map[fragment];
}
// acha, entre as entradas do sumário que caem dentro do capítulo atual, qual
// delas é a mais próxima (por trás ou igual) do início da página que está
// sendo mostrada — é o que permite um único arquivo grande (comum em epubs
// convertidos pelo Calibre, com vários capítulos de verdade separados só por
// âncora) mudar o título exibido conforme o leitor avança pelas páginas.
function getActiveEpubTocEntry(bookId, book, chapterIndex, pageStartParagraphIdx){
  const entries = (book.epub.toc||[]).filter(e => e.chapterIndex === chapterIndex);
  if(entries.length === 0) return null;
  let best = null, bestPos = -1;
  entries.forEach(e => {
    const pIdx = e.fragment ? resolveEpubAnchorParagraphIndex(bookId, chapterIndex, e.fragment) : 0;
    if(pIdx <= pageStartParagraphIdx && pIdx >= bestPos){ bestPos = pIdx; best = e; }
  });
  return best;
}
function getEpubReadPercent(book){
  if(!book || !book.epub || !book.epub.chapterCount) return 0;
  const idx = book.epub.currentChapterIndex || 0;
  const pageIdx = book.epub.currentPageIndex || 0;
  const pagesInChapter = book.epub.pagesInCurrentChapter || 1;
  const frac = pagesInChapter > 0 ? Math.min(1, pageIdx / pagesInChapter) : 0;
  return Math.max(0, Math.min(100, Math.round(((idx + frac) / book.epub.chapterCount) * 100)));
}

async function ensureEpubLoaded(bookId){
  if(epubRuntime[bookId]) return;
  const book = state.books.find(b=>b.id===bookId);
  if(!book || !book.epub) return;
  book.epubStatus = 'downloading';
  render();
  try{
    const blob = await downloadEpubForBook(bookId);
    const parsed = await parseEpubFile(blob);
    epubRuntime[bookId] = { zip: parsed.zip, chapterPaths: parsed.chapterPaths, paragraphsCache: {} };
  }catch(err){
    console.error('Falha ao baixar/abrir epub salvo', err);
    showToast(epubErrorMessage(err), 'error');
  }
  delete book.epubStatus;
  render();
}
function epubErrorMessage(err){
  if(err && err.message === 'not_logged_in') return 'Faça login pra guardar ou abrir livros.';
  if(err && err.message === 'upload_timeout') return 'O envio demorou demais e foi cancelado. Tente de novo.';
  if(err && err.message === 'download_timeout') return 'Demorou demais pra abrir o livro salvo. Tente de novo.';
  if(err && err.message === 'epub_upload_error') return 'Não consegui salvar esse arquivo agora. Tente de novo.';
  return 'Não consegui abrir esse arquivo. Confira se é um .epub válido, sem proteção DRM.';
}
// pula pro início de um capítulo (página 0) — usado pelo sumário, marcadores e
// pelos próprios Anterior/Próximo quando cruzam a fronteira de um capítulo.
function goToEpubChapter(bookId, index){
  const book = state.books.find(b=>b.id===bookId);
  if(!book || !book.epub) return;
  const clamped = Math.max(0, Math.min(book.epub.chapterCount-1, index));
  book.epub.currentChapterIndex = clamped;
  book.epub.currentPageIndex = 0;
  saveData(); render();
  scrollEpubMainToTop();
}
function jumpToEpubTocEntry(bookId, chapterIndex, fragment){
  closeModal();
  const book = state.books.find(b=>b.id===bookId);
  if(!book || !book.epub) return;
  const clamped = Math.max(0, Math.min(book.epub.chapterCount-1, chapterIndex));
  book.epub.currentChapterIndex = clamped;
  if(fragment){
    // a âncora só pode ser resolvida depois que os parágrafos desse capítulo
    // estiverem carregados — renderEpubReaderView termina o trabalho quando chegar lá.
    state._epubPendingPageJump = { fragment };
    render();
  } else {
    book.epub.currentPageIndex = 0;
    saveData(); render();
    scrollEpubMainToTop();
  }
}
function scrollEpubMainToTop(){
  requestAnimationFrame(() => { const m = document.querySelector('.main'); if(m) m.scrollTop = 0; });
}
// avança/volta uma "página" (bloco de parágrafos) por vez, sem rolagem contínua.
// Quando chega no fim/início do capítulo carregado, pula pro capítulo vizinho —
// se esse capítulo ainda não foi carregado, marca uma "página pendente" que o
// renderEpubReaderView resolve assim que os parágrafos chegarem.
function nextEpubPage(bookId){
  const book = state.books.find(b=>b.id===bookId);
  if(!book || !book.epub) return;
  const idx = book.epub.currentChapterIndex;
  const pages = getEpubPages(bookId, idx);
  const pageIdx = book.epub.currentPageIndex || 0;
  if(pages && pageIdx < pages.length-1){
    book.epub.currentPageIndex = pageIdx + 1;
    book.epub.pagesInCurrentChapter = pages.length;
    saveData(); render();
    scrollEpubMainToTop();
    return;
  }
  if(idx < book.epub.chapterCount-1){
    book.epub.currentChapterIndex = idx + 1;
    book.epub.currentPageIndex = 0;
    saveData(); render();
    scrollEpubMainToTop();
  }
}
function prevEpubPage(bookId){
  const book = state.books.find(b=>b.id===bookId);
  if(!book || !book.epub) return;
  const idx = book.epub.currentChapterIndex;
  const pageIdx = book.epub.currentPageIndex || 0;
  if(pageIdx > 0){
    book.epub.currentPageIndex = pageIdx - 1;
    saveData(); render();
    scrollEpubMainToTop();
    return;
  }
  if(idx > 0){
    book.epub.currentChapterIndex = idx - 1;
    state._epubPendingPageJump = 'last'; // resolvido no render() quando o capítulo anterior carregar
    render();
  }
}
function addEpubBookmark(bookId){
  const book = state.books.find(b=>b.id===bookId);
  if(!book || !book.epub) return;
  const idx = book.epub.currentChapterIndex;
  const pageIdx = book.epub.currentPageIndex || 0;
  const paragraphs = epubRuntime[bookId] && epubRuntime[bookId].paragraphsCache[idx];
  const pages = getEpubPages(bookId, idx);
  const pageStart = paragraphs && pages && pages[pageIdx] ? paragraphs[pages[pageIdx].start] : null;
  const excerpt = pageStart ? pageStart.slice(0, 80) : '';
  const label = (book.epub.chapterTitles && book.epub.chapterTitles[idx]) || `Capítulo ${idx+1}`;
  book.epub.bookmarks = book.epub.bookmarks || [];
  book.epub.bookmarks.push({

    label, excerpt, createdAt: Date.now()
  });

  showToast('Marcador adicionado.');
}
function removeEpubBookmark(bookId, bookmarkId){

function goToEpubBookmark(bookId, bookmarkId){

/* transforma o texto de um parágrafo em HTML com cada palavra clicável, agrupada
   por frase (guardada num atributo data-sentence) pra dar contexto à tradução —
   usado só em livros marcados como "em inglês". */
function renderEpubParagraphClickable(text, targetDeckId){
  const sentences = text.split(/(?<=[.!?])\s+/).filter(Boolean);
  return sentences.map(sentence => {
    const wordsHtml = sentence.split(/(\s+)/).map(tok => {
      const m = tok.match(/^([A-Za-zÀ-ÿ']+)(.*)$/);
      if(m && m[1]){
        return `<span class="clickable-word" onclick="lookupWord('${m[1].replace(/'/g,"\\'")}', '${targetDeckId}', this.closest('[data-sentence]').getAttribute('data-sentence'))">${escapeHtml(m[1])}</span>${escapeHtml(m[2])}`;
      }
      return escapeHtml(tok);
    }).join('');
    return `<span data-sentence="${escapeHtml(sentence)}">${wordsHtml}</span>`;
  }).join(' ');
}
/* --- livros que NÃO são em inglês: seleciona um trecho pra guardar como
   citação ou pedir um cartão de flashcard gerado pela IA. A barra só existe

   brigar com o toque de tradução. --- */
document.addEventListener('mouseup', handleReaderSelection);
document.addEventListener('touchend', handleReaderSelection);
function handleReaderSelection(){

}

}
async function generateCardFromPassage(passageText){
  const prompt = `Trecho de um livro:\n"${passageText}"\n\nCrie 1 flashcard de pergunta e resposta em português sobre o conteúdo principal desse trecho, com pergunta objetiva e resposta curta e direta. Escreva também uma nota breve (1-2 frases) com uma explicação um pouco mais elaborada.\n\nResponda SOMENTE com um JSON válido, exatamente neste formato:\n{"front":"pergunta","back":"resposta objetiva","note":"breve explicação"}`;
  const text = (await callGemini(prompt, { maxTokens: 300 })).trim();
  const clean = text.replace(/```json|```/g,"").trim();
  const obj = JSON.parse(clean);
  return {
    front: String((obj && obj.front) || '').trim(),
    back: String((obj && obj.back) || '').trim(),
    note: String((obj && obj.note) || '').trim()
  };
}
function requestCardFromReaderSelection(){
  const text = state.readerSelection;

  render();

}
function confirmPassageCard(){

}

function renderEpubReaderView(){
  const book = state.books.find(b=>b.id===state.currentBookId);
  if(!book) return '';
  if(!book.epub){
    // não deveria acontecer (só se navegar aqui sem epub), volta pro detalhe do livro
    state.view = 'book';
    return '';
  }
  const gearBtn = `<button class="icon-btn" title="Editar propriedades do livro" onclick="state.view='book'; render();">⚙️</button>`;
  if(book.epubStatus === 'downloading' || !epubRuntime[book.id]){
    if(!epubRuntime[book.id] && book.epubStatus !== 'downloading') ensureEpubLoaded(book.id);
    return `
    <button class="ghost-btn mobile-back-btn" onclick="closeEpubReader()">← Leituras</button>
    <div class="loading-line" style="justify-content:center; padding:60px;"><div class="spinner"></div> Abrindo o livro...</div>`;
  }
  const idx = book.epub.currentChapterIndex;
  const runtime = epubRuntime[book.id];
  if(!runtime.paragraphsCache[idx]){
    loadEpubChapterParagraphs(book.id, idx).then(() => render()).catch(err => {
      console.error('Falha ao carregar capítulo', err);
      showToast('Não consegui carregar esse capítulo.', 'error');
    });
    return `
    <button class="ghost-btn mobile-back-btn" onclick="closeEpubReader()">← Leituras</button>
    <div class="loading-line" style="justify-content:center; padding:60px;"><div class="spinner"></div> Carregando capítulo...</div>`;
  }
  const paragraphs = runtime.paragraphsCache[idx];
  const pages = getEpubPages(book.id, idx);
  // "Anterior" cruzando pra um capítulo ainda não carregado, ou um pulo vindo
  // do sumário/marcador com âncora: só dá pra resolver depois que os
  // parágrafos (e o mapa de âncoras) desse capítulo chegarem — é aqui.
  if(state._epubPendingPageJump){
    const pending = state._epubPendingPageJump;
    state._epubPendingPageJump = null;
    if(pending === 'last'){
      book.epub.currentPageIndex = pages.length - 1;
    } else if(pending.fragment){
      const anchorParagraphIdx = resolveEpubAnchorParagraphIndex(book.id, idx, pending.fragment);
      const targetPage = pages.findIndex(p => anchorParagraphIdx >= p.start && anchorParagraphIdx < p.end);
      book.epub.currentPageIndex = targetPage === -1 ? 0 : targetPage;
    }
    book.epub.pagesInCurrentChapter = pages.length;
    saveData();
    scrollEpubMainToTop();
  }
  book.epub.pagesInCurrentChapter = pages.length;
  const pageIdx = Math.min(book.epub.currentPageIndex || 0, pages.length - 1);
  const page = pages[pageIdx];
  const pageParagraphs = paragraphs.slice(page.start, page.end);
  const atFirstPage = idx === 0 && pageIdx === 0;
  const atLastPage = idx >= book.epub.chapterCount-1 && pageIdx >= pages.length-1;
  // o título mostrado em fonte grande reflete o capítulo de VERDADE mais recente
  // até esse ponto — muitos epubs (principalmente convertidos pelo Calibre)
  // empacotam vários capítulos reais dentro do mesmo arquivo, diferenciados só
  // por âncora, então um único título fixo por arquivo mostraria errado.
  const activeToc = getActiveEpubTocEntry(book.id, book, idx, page.start);
  const chapterTitle = (activeToc && activeToc.title) || (book.epub.chapterTitles && book.epub.chapterTitles[idx]) || `Capítulo ${idx+1}`;
  const prevPage = pageIdx > 0 ? pages[pageIdx-1] : null;
  const prevActiveToc = prevPage ? getActiveEpubTocEntry(book.id, book, idx, prevPage.start) : null;
  const prevChapterTitle = prevPage ? ((prevActiveToc && prevActiveToc.title) || (book.epub.chapterTitles && book.epub.chapterTitles[idx]) || `Capítulo ${idx+1}`) : null;
  const showChapterHeading = pageIdx === 0 || chapterTitle !== prevChapterTitle;
  const totalPages = book.totalPages || 0;
  const currentPage = totalPages ? Math.max(1, Math.round((getEpubReadPercent(book)/100) * totalPages)) : 0;

      <span style="font-size:12px; color:var(--text-muted); text-align:center;">Cap. ${idx+1}/${book.epub.chapterCount} · pág. ${pageIdx+1}/${pages.length}${currentPage ? ` · ~${currentPage} de ${totalPages}` : ''}</span>
      <button class="ghost-btn" ${atLastPage?'disabled':''} onclick="nextEpubPage('${book.id}')">Próximo →</button>
    </div>
  </div>
  <div style="margin:14px 0; text-align:center;">
    <h3 style="margin:0;">${escapeHtml(book.epub.title)}</h3>
    ${book.epub.author ? `<p style="color:var(--text-muted); font-size:12.5px; margin:2px 0 0 0;">${escapeHtml(book.epub.author)}</p>` : ''}
  </div>

  <div class="epub-page ${isPageTurn ? 'epub-page-turn' : ''}" style="max-width:640px; margin:0 auto; line-height:1.9; font-size:15.5px;">
    ${showChapterHeading ? `<h2 style="text-align:center; font-size:23px; margin:6px 0 26px 0;">${escapeHtml(chapterTitle)}</h2>` : ''}
    ${pageParagraphs.length===0 ? `<p style="color:var(--text-faint);">(Capítulo sem texto legível)</p>` : pageParagraphs.map(p => `<p>${book.isEnglish ? renderEpubParagraphClickable(p, book.linkedDeckId||'') : escapeHtml(p)}</p>`).join('')}

    <button class="primary-btn" onclick="requestCardFromReaderSelection()">🤖 Pedir cartão à IA</button>

/* ============ CADERNO DE NOTAS ============ */

// usuário) — só metadados (nome, pasta, datas) ficam ali. O conteúdo de verdade

function makeNoteItem(type, name, parentId){
  const item = {
    id: uid(), type, name: (name||'').trim() || (type==='folder' ? 'Nova pasta' : 'Nova nota'),
    parentId: parentId || null,
    // Todas as notas novas usam o editor visual de texto normal.
    format: type === 'note' ? 'plain' : undefined,
    linkedDeckId: type === 'note' ? null : undefined,
    icon: type === 'folder' ? '📁' : undefined,
    iconColor: type === 'note' ? '#F5A623' : undefined,
    favorite: false,
    pageSettings: type === 'note' ? { ...DEFAULT_NOTE_PAGE_SETTINGS } : undefined,
    createdAt: Date.now(), updatedAt: Date.now()

  return item;
}
function normalizeNoteItem(n){
  const type = n.type === 'folder' ? 'folder' : 'note';
  return {
    id: n.id || uid(),
    type,
    name: n.name || (type==='folder' ? 'Pasta' : 'Nota'),
    parentId: n.parentId || null,
    // A aplicação não oferece mais Markdown: inclusive notas antigas passam
    // a abrir no editor de texto normal.
    format: type === 'folder' ? undefined : 'plain',
    linkedDeckId: type === 'folder' ? undefined : (n.linkedDeckId || null),
    icon: type === 'folder' ? (n.icon || '📁') : undefined,
    iconColor: type === 'note' ? (n.iconColor || '#F5A623') : undefined,
    favorite: type === 'note' && !!n.favorite,
    pageSettings: type === 'folder' ? undefined : { ...DEFAULT_NOTE_PAGE_SETTINGS, ...(n.pageSettings || {}) },
    aiConversations: type === 'folder' ? undefined : (Array.isArray(n.aiConversations) ? n.aiConversations : []),

function getNoteConversations(note){

function createNoteConversation(note, type, data){

  getNoteConversations(note).unshift(conversation);

}

// migração de uma versão anterior, que guardava o texto da nota junto com os

function migrateLegacyInlineNoteContent(rawItems){
  (rawItems||[]).forEach(raw => {
    if(raw && raw.type !== 'folder' && typeof raw.content === 'string' && raw.content){

function toggleNotesFolder(id){

    list.push(id);

    noteContentLoading[id] = true;

      // reescrita pra WYSIWYG) UMA VEZ SÓ aqui, no carregamento — nunca a

      noteContentCache[id] = (note && note.format === 'plain') ? normalizePlainNoteContentForEditing(content) : content;

function isNoteDescendantOf(candidateId, ancestorId){
  let current = state.notesItems.find(n=>n.id===candidateId);
  while(current && current.parentId){
    if(current.parentId === ancestorId) return true;
    current = state.notesItems.find(n=>n.id===current.parentId);
  }
  return false;
}
function moveNoteItemToParent(id, newParentId){
  if(!id) return;

  if(!item) return;

  if(newParentId){
    if(item.id === newParentId || (item.type==='folder' && isNoteDescendantOf(newParentId, id))){
      showToast('Não dá pra mover uma pasta pra dentro dela mesma.', 'error');

function getNoteDescendantIds(id){

let notesSaveTimer = null;
// Página 15 × 21 cm com margens de 1,5 cm deixa uma área útil de 12 × 18 cm.
// Em fonte de leitura comum (aprox. 12 pt, entrelinha 1,5), isso equivale a
// cerca de 230 palavras por página — ainda é uma estimativa, não paginação real.
const NOTE_WORDS_PER_PAGE = 230;
const NOTE_PAGE_PRESETS = {
  book:{ key:'book', label:'Livro — 15 × 21 cm', width:15, height:21 },
  a4:{ key:'a4', label:'A4 — 21 × 29,7 cm', width:21, height:29.7 },
  a3:{ key:'a3', label:'A3 — 29,7 × 42 cm', width:29.7, height:42 }
};
const DEFAULT_NOTE_PAGE_SETTINGS = { preset:'book', width:15, height:21, margin:2, unit:'cm', pageNumbers:false, pageNumberPosition:'right', hiddenPages:'' };
function getNotePageSettings(note){ return { ...DEFAULT_NOTE_PAGE_SETTINGS, ...((note && note.pageSettings) || {}) }; }
function getNotePagePresetKey(settings){
  const s=settings||DEFAULT_NOTE_PAGE_SETTINGS;
  const exact=Object.values(NOTE_PAGE_PRESETS).find(p=>Math.abs(Number(s.width)-p.width)<.01 && Math.abs(Number(s.height)-p.height)<.01 && s.unit!=='px');
  return exact ? exact.key : 'book';
}
function getNoteWordsPerPage(note){
  const p = getNotePageSettings(note);
  const factor = p.unit === 'px' ? 37.795 : 1;
  const width = Math.max(1, p.width / factor - 2 * p.margin / factor);
  const height = Math.max(1, p.height / factor - 2 * p.margin / factor);
  return Math.max(60, Math.round(230 * (width * height) / (12 * 18)));
}
function getNoteWritingStats(content, note, actualPages){
  const text = htmlToText(String(content || ''))
    .replace(/!\[([^\]]*)\]\([^)]*\)/g, '$1')
    .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
    .replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (_, name, alias) => alias || name);
  const wordCount = (text.match(/[\p{L}\p{N}]+(?:['’\-][\p{L}\p{N}]+)*/gu) || []).length;
  const hasActualPages=Number.isFinite(actualPages);
  const pages = hasActualPages ? actualPages : Math.round((wordCount / getNoteWordsPerPage(note)) * 10) / 10;
  const pageLabel = pages === 1 ? 'página' : 'páginas';
  return `${wordCount.toLocaleString('pt-BR')} ${wordCount === 1 ? 'palavra' : 'palavras'} · ${hasActualPages?'':'≈ '}${pages.toLocaleString('pt-BR', { maximumFractionDigits:1 })} ${pageLabel}`;
}
function renderCurrentPageNumber(note, content){
  const settings = getNotePageSettings(note);
  if(!settings.pageNumbers) return '';
  const hidden = String(settings.hiddenPages||'').split(',').some(part => part.trim()==='1');
  if(hidden) return '';
  const align = settings.pageNumberPosition==='left' ? 'left' : settings.pageNumberPosition==='center' ? 'center' : 'right';
  return `<div class="note-page-number" style="text-align:${align}; padding:0 ${settings.margin}${settings.unit};">1</div>`;
}
function pageNumberIsHidden(page, hiddenPages){
  return String(hiddenPages||'').split(',').some(raw => {
    const part=raw.trim(); if(!part) return false;
    const range=part.match(/^(\d+)\s*-\s*(\d+)$/); if(range) return page>=Number(range[1]) && page<=Number(range[2]);
    return Number(part)===page;
  });

function splitNoteHtmlIntoPages(content, wordsPerPage){
  const holder = document.createElement('div'); holder.innerHTML = content || '';
  const pages = [], current = []; let count = 0;
  const push = () => { if(current.length){ pages.push(current.join('')); current.length=0; count=0; } };
  const wordCount = node => (node.textContent||'').trim().split(/\s+/).filter(Boolean).length;
  const units = [];
  const collect = node => {
    const words = wordCount(node);
    if(node.nodeType===3 && words > wordsPerPage){
      const parts=(node.textContent||'').trim().split(/\s+/);
      for(let i=0;i<parts.length;i+=wordsPerPage) units.push(document.createTextNode(parts.slice(i,i+wordsPerPage).join(' ')));
      return;
    }
    // Containers grandes (div, p, section) são abertos até seus filhos. Já
    // elementos pequenos como <strong>, <em> e <li> continuam inteiros.
    if(node.nodeType===1 && words > wordsPerPage && node.childNodes.length>1 && !/^(LI|STRONG|EM|A)$/i.test(node.tagName)) Array.from(node.childNodes).forEach(collect);

    const words = wordCount(node);

    current.push(html); count += words;
  });

function splitNoteHtmlByRenderedHeight(content, contentWidth, contentHeight){

  history.entries = history.entries.slice(0, history.index + 1);
  history.entries.push(after);

// captura a posição do cursor/seleção no contenteditable ANTES de abrir um
// modal — a Selection global do navegador se move assim que o modal ganha
// foco (o input de dentro dele tem autofocus), então sem isso qualquer
// inserção feita depois (link, imagem) sempre acabava caindo no início do
// texto em vez de onde o usuário realmente estava escrevendo.
function captureRichCursorOffset(){
  const el = document.getElementById('note-editor-plain');
  const sel = window.getSelection();
  if(!el || !sel || !sel.rangeCount || !el.contains(sel.anchorNode)) return null;
  const r = sel.getRangeAt(0);
  return {
    start: domPositionToTextOffset(el, r.startContainer, r.startOffset),
    end: domPositionToTextOffset(el, r.endContainer, r.endOffset)
  };
}
function restoreRichCursorOffset(el, savedOffset){
  if(!savedOffset) return;
  const range = textOffsetToRange(el, savedOffset.start, savedOffset.end);
  if(range){
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }
}
function openInsertRichLinkModal(savedOffsetOverride, selectedTextOverride){
  const sel = window.getSelection();

  const savedOffset = savedOffsetOverride || captureRichCursorOffset();
  state.modal = { type:'insert-rich-link', url:'', text, savedOffset };
  render();
}

    el.focus();

    document.execCommand('insertHTML', false, `<a href="${escapeHtml(url)}" target="_blank" rel="noopener">${escapeHtml(text)}</a>`);
    onNoteContentInput(state.currentNoteId, el.innerHTML);
  }
}

}

// notas "texto normal" criadas antes dessa mudança guardavam texto puro (sem
// tag nenhuma); se o conteúdo não parece ter HTML, escapa e vira <br> nas
// quebras de linha antes de jogar dentro do contenteditable, senão símbolos
// como "<" quebrariam a renderização e as quebras de linha sumiriam.
function normalizePlainNoteContentForEditing(content){
  if(!content) return '';
  if(/<[a-z][\s\S]*>/i.test(content)) return content;
  return escapeHtml(content).replace(/\n/g, '<br>');
}
function htmlToText(html){
  const tmp = document.createElement('div');
  tmp.innerHTML = html || '';
  return tmp.textContent || '';
}
// mapeia um intervalo de caracteres do texto visível (ex: os índices que
// findTextMatches devolve) de volta pra um Range real do DOM — necessário
// pra buscar/substituir dentro do contenteditable, onde o texto pode estar
// espalhado por vários nós por causa das tags de formatação.
function textOffsetToRange(container, start, end){
  const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
  let node, charCount = 0;
  let startNode, startOffset, endNode, endOffset;
  while(node = walker.nextNode()){
    const nextCount = charCount + node.length;
    if(startNode === undefined && start <= nextCount){ startNode = node; startOffset = start - charCount; }
    if(endNode === undefined && end <= nextCount){ endNode = node; endOffset = end - charCount; break; }
    charCount = nextCount;
  }
  if(startNode === undefined || endNode === undefined) return null;
  const range = document.createRange();
  range.setStart(startNode, startOffset);
  range.setEnd(endNode, endOffset);
  return range;
}
// Substitui um intervalo do editor rico sem depender de document.execCommand.
// Em alguns navegadores, especialmente no celular, o comando "insertText"
// apagava a seleção mas não inseria o texto devolvido pela IA.
function replaceRichTextRange(container, start, end, replacement){
  const range = textOffsetToRange(container, start, end);
  if(!range) return false;
  const fragment = document.createDocumentFragment();
  const lines = String(replacement == null ? '' : replacement).split(/\r?\n/);
  lines.forEach((line, index) => {
    fragment.appendChild(document.createTextNode(line));
    if(index < lines.length - 1) fragment.appendChild(document.createElement('br'));
  });
  range.deleteContents();
  range.insertNode(fragment);
  return true;
}
// Versão para o marcador de comentário. O HTML é produzido só pelo próprio
// app, com o conteúdo do usuário escapado antes de chegar aqui.
function replaceRichHtmlRange(container, start, end, html){
  const range = textOffsetToRange(container, start, end);
  if(!range) return false;
  const fragment = range.createContextualFragment(html);
  range.deleteContents();
  range.insertNode(fragment);
  return true;
}
// o inverso de textOffsetToRange: acha o índice de caractere (relativo ao
// .textContent do container) que corresponde a um nó+offset do DOM. Usado
// pra guardar a seleção como números (que sobrevivem a um render()) em vez
// de um objeto Range (que fica inválido assim que o nó original é recriado).
function domPositionToTextOffset(container, node, offset){
  // um boundary de Range pode apontar pra um nó de TEXTO (offset = índice do
  // caractere) ou pra um ELEMENTO (offset = índice do filho) — o próprio
  // Range.setEnd já sabe resolver os dois casos corretamente, então em vez
  // de reimplementar isso na mão, só mede o texto do começo do container até
  // esse ponto.
  const range = document.createRange();
  range.selectNodeContents(container);
  range.setEnd(node, offset);
  return range.toString().length;
}
function openInsertImageModal(savedOffsetOverride){

  const savedOffset = savedOffsetOverride || ((note && note.format === 'plain') ? captureRichCursorOffset() : null);
  state.modal = { type:'insert-note-image', url:'', alt:'', savedOffset };
  render();
}
function openNoteInsertOption(select){

  select.value='';
  if(!choice) return;
  const savedOffset=state.pendingNoteInsertOffset || null;

function confirmInsertNoteImage(){
  const m = state.modal;
  const url = (m.url||'').trim();
  if(!url){ showToast('Cole o link da imagem.', 'error'); return; }
  const alt = m.alt||'';
  const savedOffset = m.savedOffset;
  state.modal = null;
  render();
  const note = state.notesItems.find(n=>n.id===state.currentNoteId);
  if(note && note.format === 'plain'){
    const el = document.getElementById('note-editor-plain');
    if(el){
      el.focus();
      restoreRichCursorOffset(el, savedOffset);
      document.execCommand('insertHTML', false, `<img data-note-image-id="${uid()}" src="${escapeHtml(url)}" alt="${escapeHtml(alt)}">`);
      onNoteContentInput(state.currentNoteId, el.innerHTML);
    }
  } else {
    insertImageMarkdown('note-editor-textarea', url, alt);
  }
}
function openNoteImageUploadPicker(savedOffsetOverride){
  const noteId = state.currentNoteId;
  if(!noteId) return;
  const note = state.notesItems.find(n=>n.id===noteId);
  const savedOffset = savedOffsetOverride || ((note && note.format === 'plain') ? captureRichCursorOffset() : null);
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    showToast('Enviando imagem...');
    try{
      const url = await uploadNoteImage(file);
      const alt = file.name.replace(/\.[^/.]+$/, '');
      if(note && note.format === 'plain'){
        const el = document.getElementById('note-editor-plain');
        if(el){
          el.focus();
          restoreRichCursorOffset(el, savedOffset);
          document.execCommand('insertHTML', false, `<img data-note-image-id="${uid()}" src="${escapeHtml(url)}" alt="${escapeHtml(alt)}">`);
          onNoteContentInput(noteId, el.innerHTML);
        }
      } else {
        insertImageMarkdown('note-editor-textarea', url, alt);
      }
      showToast('Imagem enviada!');
    }catch(err){
      console.error('Falha ao enviar imagem da nota', err);
      showToast('Não consegui enviar a imagem. Tente de novo.', 'error');
    }
  };
  input.click();
}

// Imagens inseridas por upload, link ou pela IA são imagens HTML comuns no
// editor visual. Um clique mostra alças diretamente na imagem, sem precisar
// baixar ou reenviar o arquivo original.
let selectedNoteImageId = null;
let noteImageTransformOverlay = null;
let noteImageTransformDrag = null;
let noteImageLayoutMenu = null;
let noteImageLongPressTimer = null;
let noteImageLongPressStart = null;
let suppressNoteImageClickUntil = 0;
document.addEventListener('click', (event) => {
  const image = event.target && event.target.closest && event.target.closest('#note-editor-plain img, .note-page-sheet-content img');
  if(event.target && event.target.closest && event.target.closest('.note-image-layout-menu')) return;
  if(image && Date.now()<suppressNoteImageClickUntil){ event.preventDefault(); return; }
  closeNoteImageLayoutMenu();
  if(!image){
    if(!event.target.closest || !event.target.closest('.note-image-transform-overlay')) clearSelectedNoteImage();
    return;
  }
  selectNoteImage(image);
});
function selectNoteImage(image){
  document.querySelectorAll('#note-editor-plain img.note-image-selected, .note-page-sheet-content img.note-image-selected').forEach(img => img.classList.remove('note-image-selected'));
  image.dataset.noteImageId = image.dataset.noteImageId || uid();
  image.classList.add('note-image-selected');
  selectedNoteImageId = image.dataset.noteImageId;
  // O painel abre um modal e redesenha a nota. Mantemos o identificador no
  // HTML em memória para que a imagem continue selecionada depois do redraw.
  const editor = document.getElementById('note-editor-plain');
  if(editor && editor.contains(image)){
    noteContentCache[state.currentNoteId] = editor.innerHTML;
  }else{
    const holder=document.createElement('div');
    holder.innerHTML=getNoteContent(state.currentNoteId);
    const previewImages=Array.from(document.querySelectorAll('.note-page-sheet-content img'));
    const index=previewImages.indexOf(image);
    const sourceImage=Array.from(holder.querySelectorAll('img'))[index];
    if(sourceImage){
      sourceImage.dataset.noteImageId=selectedNoteImageId;
      noteContentCache[state.currentNoteId]=holder.innerHTML;
    }
  }
  setTimeout(syncNoteImageTransformOverlay, 0);
}
function clearSelectedNoteImage(){
  document.querySelectorAll('#note-editor-plain img.note-image-selected, .note-page-sheet-content img.note-image-selected').forEach(img => img.classList.remove('note-image-selected'));
  selectedNoteImageId=null;
  removeNoteImageTransformOverlay();
  closeNoteImageLayoutMenu();
}
document.addEventListener('contextmenu', (event) => {
  const image=event.target && event.target.closest && event.target.closest('#note-editor-plain img, .note-page-sheet-content img');
  if(!image) return;
  event.preventDefault();
  selectNoteImage(image);
  openNoteImageLayoutMenu(event.clientX,event.clientY);
});
document.addEventListener('pointerdown', (event) => {
  if(event.pointerType!=='touch') return;
  const image=event.target && event.target.closest && event.target.closest('#note-editor-plain img, .note-page-sheet-content img');
  if(!image) return;
  clearTimeout(noteImageLongPressTimer);
  noteImageLongPressStart={x:event.clientX,y:event.clientY,image};
  noteImageLongPressTimer=setTimeout(()=>{
    if(!noteImageLongPressStart) return;
    selectNoteImage(noteImageLongPressStart.image);
    suppressNoteImageClickUntil=Date.now()+750;
    openNoteImageLayoutMenu(noteImageLongPressStart.x,noteImageLongPressStart.y);
    noteImageLongPressStart=null;
  },550);
},true);
document.addEventListener('pointermove', (event) => {
  if(!noteImageLongPressStart) return;
  if(Math.hypot(event.clientX-noteImageLongPressStart.x,event.clientY-noteImageLongPressStart.y)>12){ clearTimeout(noteImageLongPressTimer); noteImageLongPressStart=null; }
},true);
document.addEventListener('pointerup', ()=>{ clearTimeout(noteImageLongPressTimer); noteImageLongPressStart=null; },true);
document.addEventListener('pointercancel', ()=>{ clearTimeout(noteImageLongPressTimer); noteImageLongPressStart=null; },true);
function closeNoteImageLayoutMenu(){
  if(noteImageLayoutMenu){ noteImageLayoutMenu.remove(); noteImageLayoutMenu=null; }
}
function openNoteImageLayoutMenu(x,y){
  closeNoteImageLayoutMenu();
  const image=getSelectedNoteImage();
  if(!image) return;
  const active=image.dataset.noteImageLayout||'inline';
  const choices=[
    ['inline','↔ Em linha com o texto'], ['block','↕ Acima e abaixo'],
    ['wrap-left','◧ Texto à direita'], ['wrap-right','◨ Texto à esquerda'],
    ['behind','▤ Atrás do texto'], ['free','▣ Livre, sobre o texto']
  ];
  noteImageLayoutMenu=document.createElement('div');
  noteImageLayoutMenu.className='note-image-layout-menu';
  noteImageLayoutMenu.innerHTML=`<div class="note-image-layout-menu-label">COMPORTAMENTO NO TEXTO</div><div class="note-image-layout-menu-grid">${choices.map(([value,label])=>`<button type="button" data-note-image-layout-choice="${value}" class="${active===value?'active':''}">${label}</button>`).join('')}</div><button type="button" data-note-image-delete style="margin-top:7px; color:var(--error);">⌫ Excluir imagem</button><div class="note-image-layout-menu-label">Clique fora para fechar</div>`;
  noteImageLayoutMenu.querySelectorAll('[data-note-image-layout-choice]').forEach(button=>button.addEventListener('click',(event)=>{ event.stopPropagation(); setNoteImageLayout(button.dataset.noteImageLayoutChoice); closeNoteImageLayoutMenu(); }));
  noteImageLayoutMenu.querySelector('[data-note-image-delete]').addEventListener('click',(event)=>{ event.stopPropagation(); deleteSelectedNoteImage(); });
  document.body.appendChild(noteImageLayoutMenu);
  const menuRect=noteImageLayoutMenu.getBoundingClientRect();
  noteImageLayoutMenu.style.left=`${Math.max(8,Math.min(x,window.innerWidth-menuRect.width-8))}px`;
  noteImageLayoutMenu.style.top=`${Math.max(8,Math.min(y,window.innerHeight-menuRect.height-8))}px`;
}
function setNoteImageLayout(layout){
  const image=getSelectedNoteImage();
  if(!image) return;
  const host=image.closest('figure')||image;
  const rect=host.getBoundingClientRect();
  const parentRect=host.parentElement?.getBoundingClientRect();
  image.dataset.noteImageLayout=layout;
  host.dataset.noteImageLayout=layout;
  host.style.float=''; host.style.clear=''; host.style.position=''; host.style.left=''; host.style.top=''; host.style.zIndex=''; host.style.opacity='';
  if(layout==='inline'){
    host.style.display='inline'; host.style.margin='0 4px';
  }else if(layout==='block'){
    host.style.display='block'; host.style.margin='12px auto';
  }else if(layout==='wrap-left' || layout==='wrap-right'){
    host.style.display='block';
  }else{
    host.style.display='block';
    host.style.left=`${Math.max(0,rect.left-(parentRect?.left||rect.left))}px`;
    host.style.top=`${Math.max(0,rect.top-(parentRect?.top||rect.top))}px`;
  }
  commitSelectedNoteImageStyle(image);
}
function deleteSelectedNoteImage(){
  const image=getSelectedNoteImage();
  if(!image) return;
  const editor=document.getElementById('note-editor-plain');
  if(editor && editor.contains(image)){
    (image.closest('figure')||image).remove();
    onNoteContentInput(state.currentNoteId,editor.innerHTML);
  }else{
    const holder=document.createElement('div');
    holder.innerHTML=getNoteContent(state.currentNoteId);
    const source=holder.querySelector(`img[data-note-image-id="${selectedNoteImageId}"]`);
    if(!source) return;
    (source.closest('figure')||source).remove();
    onNoteContentInput(state.currentNoteId,holder.innerHTML);
    render();
  }
  clearSelectedNoteImage();
  showToast('Imagem excluída.');
}
document.addEventListener('keydown', (event) => {
  if(!selectedNoteImageId || (event.key!=='Delete' && event.key!=='Backspace')) return;
  const active=document.activeElement;
  if(active && ['INPUT','TEXTAREA'].includes(active.tagName)) return;
  if(!getSelectedNoteImage()) return;
  event.preventDefault();
  deleteSelectedNoteImage();
});
function getSelectedNoteImage(){
  return selectedNoteImageId ? document.querySelector(`#note-editor-plain img[data-note-image-id="${selectedNoteImageId}"], .note-page-sheet-content img[data-note-image-id="${selectedNoteImageId}"]`) : null;
}
function removeNoteImageTransformOverlay(){
  if(noteImageTransformOverlay){ noteImageTransformOverlay.remove(); noteImageTransformOverlay=null; }
}
function syncNoteImageTransformOverlay(){
  const image=getSelectedNoteImage();
  if(!image || !image.isConnected){ removeNoteImageTransformOverlay(); return; }
  const rawRect=image.getBoundingClientRect();
  const rect=getNoteImageVisibleRect(image,rawRect);
  if(rect.width<4 || rect.height<4){ removeNoteImageTransformOverlay(); return; }
  if(!noteImageTransformOverlay){
    noteImageTransformOverlay=document.createElement('div');
    noteImageTransformOverlay.className='note-image-transform-overlay';
    noteImageTransformOverlay.innerHTML=`
      <button type="button" class="note-image-resize-handle" data-note-image-action="resize-nw" aria-label="Redimensionar imagem"></button>
      <button type="button" class="note-image-resize-handle" data-note-image-action="resize-ne" aria-label="Redimensionar imagem"></button>
      <button type="button" class="note-image-resize-handle" data-note-image-action="resize-se" aria-label="Redimensionar imagem"></button>
      <button type="button" class="note-image-resize-handle" data-note-image-action="resize-sw" aria-label="Redimensionar imagem"></button>
      <button type="button" class="note-image-crop-handle n" data-note-image-action="crop-n" aria-label="Recortar topo"></button>
      <button type="button" class="note-image-crop-handle e" data-note-image-action="crop-e" aria-label="Recortar direita"></button>
      <button type="button" class="note-image-crop-handle s" data-note-image-action="crop-s" aria-label="Recortar base"></button>
      <button type="button" class="note-image-crop-handle w" data-note-image-action="crop-w" aria-label="Recortar esquerda"></button>
      <button type="button" class="note-image-layout-trigger" aria-label="Comportamento da imagem">•••</button>`;
    noteImageTransformOverlay.querySelectorAll('[data-note-image-action]').forEach(handle=>handle.addEventListener('pointerdown', beginNoteImageTransform));
    noteImageTransformOverlay.querySelector('.note-image-layout-trigger').addEventListener('click',(event)=>{
      event.preventDefault(); event.stopPropagation();
      const trigger=event.currentTarget.getBoundingClientRect();
      openNoteImageLayoutMenu(trigger.left+trigger.width/2,trigger.bottom+6);
    });
    document.body.appendChild(noteImageTransformOverlay);
  }
  Object.assign(noteImageTransformOverlay.style,{left:`${rect.left}px`,top:`${rect.top}px`,width:`${rect.width}px`,height:`${rect.height}px`});
  const handle=(action)=>noteImageTransformOverlay.querySelector(`[data-note-image-action="${action}"]`);
  Object.assign(handle('resize-nw').style,{left:'-7px',top:'-7px',cursor:'nwse-resize'});
  Object.assign(handle('resize-ne').style,{right:'-7px',top:'-7px',cursor:'nesw-resize'});
  Object.assign(handle('resize-se').style,{right:'-7px',bottom:'-7px',cursor:'nwse-resize'});
  Object.assign(handle('resize-sw').style,{left:'-7px',bottom:'-7px',cursor:'nesw-resize'});
  Object.assign(handle('crop-n').style,{top:'-3px'});
  Object.assign(handle('crop-e').style,{right:'-3px'});
  Object.assign(handle('crop-s').style,{bottom:'-3px'});
  Object.assign(handle('crop-w').style,{left:'-3px'});
}
function readNoteImageCrop(image){
  const match=(image.style.clipPath||'').match(/^inset\(([\d.]+)% ([\d.]+)% ([\d.]+)% ([\d.]+)%\)$/);
  return match ? {top:+match[1],right:+match[2],bottom:+match[3],left:+match[4]} : {top:0,right:0,bottom:0,left:0};
}
function getNoteImageVisibleRect(image, rawRect=image.getBoundingClientRect(), crop=readNoteImageCrop(image)){
  const horizontal=Math.max(.01,1-(crop.left+crop.right)/100);
  const vertical=Math.max(.01,1-(crop.top+crop.bottom)/100);
  return {
    left:rawRect.left+rawRect.width*crop.left/100,
    top:rawRect.top+rawRect.height*crop.top/100,
    width:rawRect.width*horizontal,
    height:rawRect.height*vertical,
    horizontal, vertical
  };
}
function beginNoteImageTransform(event){
  const image=getSelectedNoteImage();
  if(!image) return;
  event.preventDefault(); event.stopPropagation();
  const rawRect=image.getBoundingClientRect();
  const crop=readNoteImageCrop(image);
  const rect=getNoteImageVisibleRect(image,rawRect,crop);
  noteImageTransformDrag={
    image, action:event.currentTarget.dataset.noteImageAction, startX:event.clientX, startY:event.clientY,
    rect, rawRect, crop, containerWidth:Math.max(rawRect.width, image.parentElement?.getBoundingClientRect().width||rawRect.width)
  };
  event.currentTarget.setPointerCapture?.(event.pointerId);
  window.addEventListener('pointermove', moveNoteImageTransform);
  window.addEventListener('pointerup', finishNoteImageTransform, {once:true});
}
function moveNoteImageTransform(event){
  const drag=noteImageTransformDrag;
  if(!drag) return;
  const {image,action,rect,rawRect}=drag;
  const dx=event.clientX-drag.startX, dy=event.clientY-drag.startY;
  if(action.startsWith('resize-')){
    const horizontal=action.endsWith('e') ? dx : -dx;
    const vertical=action.includes('s') ? dy : -dy;
    const nextVisibleWidth=Math.max(40, rect.width + (Math.abs(horizontal)>Math.abs(vertical)?horizontal:vertical));
    const nextRawWidth=nextVisibleWidth/rect.horizontal;
    image.style.width=`${Math.min(100, Math.max(8, nextRawWidth/drag.containerWidth*100)).toFixed(2)}%`;
  }else{
    const crop={...drag.crop};
    const cap=(value, other)=>Math.max(0,Math.min(92-other,value));
    if(action==='crop-n') crop.top=cap(drag.crop.top+dy/rawRect.height*100,crop.bottom);
    if(action==='crop-s') crop.bottom=cap(drag.crop.bottom-dy/rawRect.height*100,crop.top);
    if(action==='crop-w') crop.left=cap(drag.crop.left+dx/rawRect.width*100,crop.right);
    if(action==='crop-e') crop.right=cap(drag.crop.right-dx/rawRect.width*100,crop.left);
    image.style.clipPath=`inset(${crop.top.toFixed(2)}% ${crop.right.toFixed(2)}% ${crop.bottom.toFixed(2)}% ${crop.left.toFixed(2)}%)`;
  }
  syncNoteImageTransformOverlay();
}
function finishNoteImageTransform(){
  window.removeEventListener('pointermove', moveNoteImageTransform);
  if(!noteImageTransformDrag) return;
  const image=noteImageTransformDrag.image;
  noteImageTransformDrag=null;
  commitSelectedNoteImageStyle(image);
}
function commitSelectedNoteImageStyle(image){
  const editor=document.getElementById('note-editor-plain');
  if(editor && editor.contains(image)){
    onNoteContentInput(state.currentNoteId, editor.innerHTML);
  }else{
    const holder=document.createElement('div');
    holder.innerHTML=getNoteContent(state.currentNoteId);
    const source=holder.querySelector(`img[data-note-image-id="${selectedNoteImageId}"]`);
    if(source){
      source.style.cssText=image.style.cssText;
      if(image.dataset.noteImageLayout) source.dataset.noteImageLayout=image.dataset.noteImageLayout;
      else delete source.dataset.noteImageLayout;

  }
  setTimeout(syncNoteImageTransformOverlay,0);
}

function applyNoteImageChange(image, change){

/* --- seleção de texto na nota: criar cartão a partir do trecho, ou pedir
   correção ortográfica/gramatical à IA. A correção só é oferecida quando a
   seleção vem da textarea (fonte), porque só ali dá pra saber o start/end
   exato pra substituir depois — na prévia renderizada não tem como mapear
   de volta pro markdown original com segurança. --- */
document.addEventListener('mouseup', handleNoteSelection);
// no celular, o touchend dispara antes da seleção "assentar" (e o usuário ainda
// pode arrastar as alcinhas nativas depois, sem gerar outro touchend no editor) —
// por isso, além do touchend com um pequeno atraso, também escutamos o
// selectionchange do documento inteiro, que É disparado a cada ajuste das
// alcinhas. Não funciona 100% em todo navegador/celular, mas quando funciona já
// evita ter que copiar e colar o trecho pra usar os botões de IA.
document.addEventListener('touchend', () => setTimeout(handleNoteSelection, 60));
document.addEventListener('keyup', handleNoteSelection);
document.addEventListener('select', handleNoteSelection);
let noteSelectionChangeTimer = null;
document.addEventListener('selectionchange', () => {
  if(state.view !== 'notes' || !state.currentNoteId) return;
  clearTimeout(noteSelectionChangeTimer);
  noteSelectionChangeTimer = setTimeout(handleNoteSelection, 220);
});
function handleNoteSelection(e){
  if(state.view !== 'notes' || !state.currentNoteId) return;
  // clicar nos próprios botões da barra (Corrigir/Criar cartão) dispara um mouseup
  // fora da textarea/prévia, que sem essa guarda apagaria state.noteSelection um
  // instante antes do onclick do botão rodar — os botões pareciam não fazer nada.
  if(e && e.target && e.target.closest && e.target.closest('#note-selection-bar')) return;
  const bar = document.getElementById('note-selection-bar');
  if(!bar) return;
  const correctBtn = document.getElementById('note-correct-btn');
  const commentBtn = document.getElementById('note-comment-btn');
  const activeEl = document.activeElement;
  if(activeEl && activeEl.id === 'note-editor-textarea'){
    const start = activeEl.selectionStart, end = activeEl.selectionEnd;
    if(end > start){
      const text = activeEl.value.slice(start, end).trim();
      if(text){
        state.noteSelection = { text, source:'textarea', start, end };
        bar.style.display = 'flex';
        if(correctBtn) correctBtn.style.display = '';
        if(commentBtn) commentBtn.style.display = '';
        return;
      }
    }
  } else {
    const richEl = document.getElementById('note-editor-plain');
    const sel = window.getSelection();
    const text = sel ? sel.toString().trim() : '';
    // texto normal (contenteditable): a correção também funciona aqui — guarda
    // os ÍNDICES de caractere (não um Range de verdade, que ficaria inválido
    // assim que render() recriar o contenteditable enquanto a IA está pensando).
    if(text && richEl && sel.rangeCount && !sel.isCollapsed && richEl.contains(sel.anchorNode)){
      const r = sel.getRangeAt(0);
      const start = domPositionToTextOffset(richEl, r.startContainer, r.startOffset);
      const end = domPositionToTextOffset(richEl, r.endContainer, r.endOffset);
      state.noteSelection = { text, source:'richtext', start, end };
      bar.style.display = 'flex';
      if(correctBtn) correctBtn.style.display = '';
      if(commentBtn) commentBtn.style.display = '';
      return;
    }
    const preview = document.querySelector('.notes-preview');
    if(text && preview && sel.anchorNode && preview.contains(sel.anchorNode)){
      state.noteSelection = { text, source:'preview' };
      bar.style.display = 'flex';
      if(correctBtn) correctBtn.style.display = 'none';
      if(commentBtn) commentBtn.style.display = 'none';
      return;
    }
  }
  state.noteSelection = null;
  bar.style.display = 'none';
}
function hideNoteSelectionBar(){
  state.noteSelection = null;
  const bar = document.getElementById('note-selection-bar');

// app roda tanto no Windows quanto no Mac — os atalhos de teclado da nota usam
// Ctrl num e Cmd no outro, então o rótulo mostrado no título dos botões também
// precisa mudar (senão um usuário de Mac vê "Ctrl" e não acha o atalho).
function isMacPlatform(){
  return /Mac|iPhone|iPad|iPod/.test(navigator.platform || navigator.userAgent || '');
}
function noteShortcutLabel(letter){
  return isMacPlatform() ? `⌘⇧${letter.toUpperCase()}` : `Ctrl+Shift+${letter.toUpperCase()}`;
