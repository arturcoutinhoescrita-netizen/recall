<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Letther B</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header><img src="icons/icon-48.png" alt=""><div><strong>Letther B</strong><small>Flashcards da Web</small></div></header>
    <div id="status">Lendo o texto selecionado…</div>
    <div id="selection" hidden></div>
    <label>Quantidade de cartões
      <input id="count" type="number" min="1" max="10" value="3">
    </label>
    <button id="create" disabled>Criar flashcards</button>
    <button id="settings" class="secondary">Configurar endereço do Letther B</button>
  </main>
  <script src="popup.js"></script>
</body>
</html>
